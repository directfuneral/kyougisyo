      const inst = _zmiSplitInst(pick('inst', 'main', 'name', 'company'));
      if (inst.guessed) ctx.review.push(`${ctx.where}：金融機関「${pick('inst', 'main', 'name', 'company')}」の種類を「${inst.type}」と推定しました`);
      const isYubin = inst.type === 'ゆうちょ銀行';
      const acctType = _zmiAcctType(pick('acctType', 'subkind'), isYubin);
      let branchRaw = pick('branch', 'sub').normalize('NFKC');
      let branchType = '支店', branchName = '';
      if (/^本店/.test(branchRaw)) branchType = '本店';
      else branchName = _zmiTrim(branchRaw.replace(/\s*支店$/, ''));
      const noRaw = pick('acctNo', 'num').normalize('NFKC');
      const acct = { institutionName: inst.name, institutionType: inst.type, branchName, branchType, accountType: acctType, accountNumber: noRaw, accountSymbol: '' };
      if (acctType === '通常貯金' || acctType === '定期貯金') {
        const m = noRaw.match(/^\s*(\d+)\s*[-ー―‐]\s*(\d+)\s*$/);
        if (m) { acct.accountSymbol = m[1]; acct.accountNumber = m[2]; }
      }
      d.accounts = [acct];
      d.amount = amount;
      if (v('note') || v('detail') || extras) leftover.push([v('detail'), v('note'), extras].filter(Boolean).join('　'));

    } else if (t.type === 'securities') {
      d.companyName   = pick('company', 'inst', 'main');
      d.branchName    = v('branch');
      d.accountNumber = v('acctNo');
      let issueName = pick('issue', 'sub', 'name');
      let issueType = pick('subkind');
      const m = issueName.match(/^(.*?)[(（]([^()（）]+)[)）]$/);
      if (m) { issueName = _zmiTrim(m[1]); if (!issueType) issueType = _zmiTrim(m[2]); }
      const qtyRaw = (pick('qty', 'num') || (/株|口/.test(v('area')) ? v('area') : '')).normalize('NFKC');
      const qm = qtyRaw.match(/([\d,.]+)\s*(\S*)/);
      const qty  = qm ? qm[1].replace(/,/g, '') : '';
      const unit = qm && qm[2] ? qm[2] : '株';
      if (!issueType && unit === '株') issueType = '普通株式';
      d.issues = [{ name: issueName, type: issueType, amount: qty, unit }];
      d.amount = amount;
      if (v('note') || v('detail') || extras) leftover.push([v('detail'), v('note'), extras].filter(Boolean).join('　'));

    } else if (t.type === 'realestate') {
      const sub = t.sub || _zmiRealestateSub(R);
      const loc   = pick('location', 'main');
      const lot   = pick('lot', 'sub');
      const cat   = pick('category', 'subkind');
      const area  = pick('area', 'num');
      const share = v('share');
      if (sub === 'condominium') {
        d.realestateType = 'condominium';
        d.main_location  = loc;
        d.unit_lotNumber = lot;
        d.unit_structure = cat;
        d.unit_area      = _zmiArea(area);
        d.unit_share     = share;
        ctx.review.push(`${ctx.where}：区分建物（マンション）は一棟の建物・敷地権の情報を画面で補ってください（テンプレートの「区分建物」シートを使うとまとめて取り込めます）`);
      } else if (sub === 'building') {
        d.realestateType     = 'house';
        d.houseSubType       = 'building';
        d.building_location  = loc;
        d.building_lotNumber = lot;
        const BTYPE = /居宅|店舗|事務所|倉庫|車庫|共同住宅|物置|工場|作業所|附属建物/;
        const parts = cat.normalize('NFKC').split(/[\/／・、\s]+/).filter(Boolean);
        const bt = parts.filter(p => BTYPE.test(p));
        d.building_type      = bt.join('・');
        d.building_structure = parts.filter(p => !BTYPE.test(p)).join(' ');
        d.building_share     = share;
        const floors = _zmiParseFloors(area);
        d.building_floors = floors.length ? floors : [{ label: '1階', area: _zmiArea(area) }];
      } else {
        d.realestateType  = 'house';
        d.houseSubType    = 'land';
        d.land_location   = loc;
        d.land_lotNumber  = lot;
        d.land_category   = cat;
        d.land_area       = _zmiArea(area);
        d.land_share      = share;
      }
      d.amount = amount;
      if (v('note') || v('detail') || extras) leftover.push([v('detail'), v('note'), extras].filter(Boolean).join('　'));

    } else if (t.type === 'car') {
      d.cars = [{
        carName:  pick('carName', 'main', 'name'),
        regNo:    pick('regNo', 'sub'),
        carModel: pick('carModel', 'subkind'),
        vin:      pick('vin', 'num'),
      }];
      d.amount = amount;
      if (v('note') || v('detail') || extras) leftover.push([v('detail'), v('note'), extras].filter(Boolean).join('　'));

    } else if (t.type === 'debt') {
      const kindTxt = v('kind');
      d.debtType   = pick('debtType', 'subkind') || (/^(負債|債務|負債債務|借入負債等)$/.test(_zmiNorm(kindTxt)) ? '' : kindTxt);
      d.creditor   = pick('creditor', 'inst', 'main', 'company', 'name');
      /* 「住宅ローン（〇〇銀行）」形式 → 種類と債権者に分解 */
      const dm = d.creditor.match(/^(.*(?:ローン|借入|未払|立替|債務)[^（(]*)[（(](.+)[)）]$/);
      if (dm && !d.debtType) { d.debtType = _zmiTrim(dm[1]); d.creditor = _zmiTrim(dm[2]); }
      d.contractNo = pick('acctNo', 'sub');
      d.balance    = amtNum === null ? '' : _zmiFmtYen(Math.abs(amtNum));
      d.balanceUnit = '円';
      d.note       = [v('detail'), v('location'), v('note'), extras].filter(Boolean).join('　');

    } else {  /* other（判別できない行もここで全情報を保持） */
      const title = pick('name', 'main', 'inst', 'company', 'issue', 'carName') || v('kind') || '（名称不明の財産）';
      const used = new Set();
      ['name', 'main', 'inst', 'company', 'issue', 'carName'].some(f => { if (v(f) === title) { used.add(f); return true; } return false; });
      const bodyFields = ['detail', 'sub', 'subkind', 'num', 'location', 'lot', 'category', 'area', 'branch', 'acctType', 'acctNo', 'qty', 'regNo', 'carModel', 'vin', 'creditor', 'main', 'inst', 'company', 'issue', 'carName', 'note'];
      const body = bodyFields.filter(f => !used.has(f) && v(f)).map(f => v(f));
      if (extras) body.push(extras);
      if (v('kind') && v('kind') !== title && !_zmiTypeFromKind(v('kind'))) body.unshift(v('kind'));
      d.otherItems = [{ otherTitle: title, otherBody: body.join('　') }];
      d.amount = amount;
    }

    /* 取得者 */
    const heirList = _zmiApplyHeirs(asset, R, ctx);
    leftover.filter(Boolean).forEach(txt => ctx.notes.push(`${ctx.where}：${txt}`));
    return { asset, heirKey: heirList.map(h => _zmiNorm(h.name)).join('|'), amountRaw: amount };
  }


  /* 取得者欄・○印列から取得者を設定（共有・連帯債務も対応） */
  function _zmiApplyHeirs(asset, R, ctx) {
    const d = asset.details;
    const heirTxt = _zmiTrim(R.heir);
    const heirList = [];
    if (heirTxt) heirTxt.split(/[、,，;；\n]+/).forEach(p => { const h = _zmiParseHeirPart(p); if (h.name) heirList.push(h); });
    (R._marks || []).forEach(mk => {
      if (!heirList.some(h => _zmiNorm(h.name) === _zmiNorm(mk.name))) heirList.push(mk);
    });
    heirList.forEach(h => {
      const r = _zmiResolveHeirName(h.name);
      h.name = r.name;
      if (!r.matched) ctx.unmatched.push({ name: r.name, where: ctx.where });
    });
    if (heirList.length) {
      const [first, ...rest] = heirList;
      asset.heirName = first.name;
      if (asset.type === 'debt') {
        if (rest.length) d.debtCoHeirs = rest.map(h => ({ name: h.name }));
      } else {
        asset.heirNum = first.num; asset.heirDen = first.den;
        asset.coOwners = rest.map(h => ({ name: h.name, num: h.num, den: h.den }));
        asset.equalShare = rest.length > 0 && heirList.every(h => !h.num && !h.den);
      }
    }
    return heirList;
  }

  /* ─── 区分建物シート（一棟の建物・専有部分・敷地権）の解析 ─────── */
  function _zmiCondoField(cell) {
    const h = _zmiNorm(cell);
    if (!h) return null;
    if (/^(物件)?No\.?$|物件No|物件番号/i.test(h)) return 'no';
    if (/評価額|金額|価額/.test(h)) return 'amount';
    if (/取得|承継|帰属/.test(h))    return 'heir';
    if (/備考|メモ|摘要/.test(h))    return 'note';
    let g = null;
    if (/^一棟/.test(h)) g = 'main';
    else if (/^専有/.test(h)) g = 'unit';
    else if (/^敷地権?/.test(h)) g = 'site';
    if (!g) return null;
    const k = h.replace(/^(一棟の建物の表示|一棟の建物|一棟|専有部分の建物の表示|専有部分の建物|専有部分|専有|敷地権の表示|敷地権|敷地)/, '');
    if (g === 'site') {
      if (/符号/.test(k))           return 'site_symbol';
      if (/所在|地番/.test(k))      return 'site_lotAddress';
      if (/地目/.test(k))           return 'site_category';
      if (/地積|面積/.test(k))      return 'site_area';
      if (/種類/.test(k))           return 'site_rightType';
      if (/割合/.test(k))           return 'site_ratio';
      return null;
    }
    if (/家屋番号/.test(k))  return g + '_lot';
    if (/名称/.test(k))      return g + '_name';
    if (/構造/.test(k))      return g + '_structure';
    if (/床面積|面積/.test(k)) return g + '_area';
    if (/種類/.test(k))      return g + '_type';
    if (/持分/.test(k))      return g + '_share';
    if (/所在/.test(k))      return g + '_location';
    return null;
  }
  function _zmiIsCondoHeader(cells) {
    return cells.map(_zmiCondoField).filter(f => f && /^(main|unit|site)_/.test(f)).length >= 6;
  }
  /* 「1階 500.00　2階 480.00」→ [{label:'1階', area:'500.00'}, …] */
  function _zmiParseFloors(raw) {
    const an = String(raw ?? '').normalize('NFKC');
    const floors = [];
    const re = /(地下\d+階|\d+階|屋階)(?:部分)?\s*([\d,.]+)/g;
    let m;
    while ((m = re.exec(an))) floors.push({ label: m[1], area: m[2].replace(/,/g, '') });
    return floors;
  }
  function _zmiParseCondoSheet(rows, sheetName, range, out) {
    let colMap = null, cur = null, found = 0;
    const finish = () => { if (cur) { out.assets.push(cur.asset); found++; cur = null; } };

    rows.forEach((row, i) => {
      const rowNo = range.s.r + i + 1;
      const cells = row.map(c => _zmiTrim(c));
      if (!cells.some(Boolean)) return;
      if (_zmiIsCondoHeader(cells)) {
        finish();
        colMap = {};
        cells.forEach((c, ci) => { const f = _zmiCondoField(c); if (f && !Object.values(colMap).includes(f)) colMap[ci] = f; });
        return;
      }
      if (!colMap) return;
      const R = {};
      Object.entries(colMap).forEach(([ci, f]) => { if (cells[ci]) R[f] = cells[ci]; });
      if (!Object.keys(R).some(k => k !== 'no')) return;
      if (/【記入例】/.test(R.note || '')) { out.skippedSample++; return; }
      const where = `${sheetName} ${rowNo}行目`;
      const ctx = { where, unmatched: out.unmatched, notes: out.notes, review: out.review };

      const hasBldg = Object.keys(R).some(k => /^(main|unit)_/.test(k));
      const sameNo  = cur && R.no && R.no === cur.no;
      const isNew   = !cur || (R.no ? !sameNo : hasBldg);

      if (isNew) {
        finish();
        const nameRaw = R.main_name || '';
        const noName  = /^(なし|無し|登記なし|\(?登記なし\)?|－|-|ー)$/.test(_zmiNorm(nameRaw));
        const floors  = _zmiParseFloors(R.main_area);
        const up      = String(R.unit_area || '').normalize('NFKC');
        const fp      = up.match(/(地下\d+|\d+)\s*階/);
        const d = {
          realestateType:  'condominium',
          main_location:   R.main_location  || '',
          main_name:       noName ? '' : nameRaw,
          main_noNameReg:  noName,
          main_structure:  R.main_structure || '',
          main_floors:     floors.length ? floors : [{ label: '', area: _zmiArea(R.main_area) }],
          unit_lotNumber:  R.unit_lot       || '',
          unit_name:       R.unit_name      || '',
          unit_type:       R.unit_type      || '',
          unit_structure:  R.unit_structure || '',
          unit_floorPart:  fp ? fp[1] : '',
          unit_area:       _zmiArea(fp ? up.replace(/(地下)?\d+\s*階(部分)?/, '') : up),
          unit_share:      R.unit_share     || '',
          hasSiteLand:     false,
          siteRights:      [],
          amount:          _zmiFmtYen(_zmiParseAmount(R.amount)),
        };
        const asset = { id: _zmiNewId(), type: 'realestate', heirName: '', heirNum: '', heirDen: '', coOwners: [], equalShare: false, details: d };
        _zmiApplyHeirs(asset, R, ctx);
        cur = { asset, no: R.no || '', where };
        if (R.note) ctx.notes.push(`${where}：${R.note}`);
      } else {
        if (R.amount && !cur.asset.details.amount) cur.asset.details.amount = _zmiFmtYen(_zmiParseAmount(R.amount));
        if (R.note) ctx.notes.push(`${where}：${R.note}`);
      }
      /* 敷地権（1行＝1筆） */
      const site = ['symbol', 'lotAddress', 'category', 'area', 'rightType', 'ratio'].reduce((o, k) => { o[k] = R['site_' + k] || ''; return o; }, {});
      if (Object.values(site).some(Boolean)) {
        site.area = _zmiArea(site.area) || site.area;
        cur.asset.details.siteRights.push(site);
        cur.asset.details.hasSiteLand = true;
      }
    });
    finish();
    return found;
  }

  /* ─── シート全体の解析 ───────────────────────────────────────── */
  function _zmiParseWorkbook(wb) {
    const XL = window._XLSXBase || window.XLSX;
    const out = { assets: [], unmatched: [], notes: [], review: [], skippedSample: 0, guessed: 0, sheets: [] };

    wb.SheetNames.forEach(sheetName => {
      if (/記入方法|説明|使い方|README/i.test(sheetName)) return;
      if (/被相続人/.test(sheetName)) return;   // v148 被相続人シートは別処理
      if (_isHeirSheetName(sheetName)) return;  // v150 相続人シートは別処理
      const ws = wb.Sheets[sheetName];
      if (!ws || !ws['!ref']) return;
      const range = XL.utils.decode_range(ws['!ref']);
      const rows = XL.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false, blankrows: true });
      /* v149 合算目録（数式の集計シート）は取り込まない */
      if (/合算目録|総括|集計/.test(sheetName)) return;
      /* v149 分類別シート（預貯金・不動産（土地・建物）・有価証券・自動車・その他・負債） */
      const tplFound = _zmiTplSpecFor(sheetName, rows);
      if (tplFound) {
        if (_zmiParseTplSheet(rows, sheetName, range, tplFound, out)) out.sheets.push(sheetName);
        return;
      }
      /* 区分建物専用シート */
      if (rows.slice(0, 15).some(r => _zmiIsCondoHeader(r.map(c => _zmiTrim(c))))) {
        if (_zmiParseCondoSheet(rows, sheetName, range, out)) out.sheets.push(sheetName);
        return;
      }
      let colMap = null;        // { colIndex: field }
      let extraCols = {};       // { colIndex: 見出し文字列 }（相続人の○列 or 未知の列）
      let section = null;
      let prev = null;          // 直前に作成した財産（複数口座・複数銘柄の続き行用）
      let found = 0;
      const guessedHere = [];

      rows.forEach((row, i) => {
        const rowNo = range.s.r + i + 1;
        const cells = row.map(c => _zmiTrim(c));
        const nonEmpty = cells.filter(Boolean);
        if (!nonEmpty.length) return;

        /* セクション見出し行 */
        if (nonEmpty.length === 1) {
          const sec = _zmiSectionType(nonEmpty[0]);
          if (sec) { section = sec; prev = null; return; }
        }
        /* 見出し行（判別できる列が2つ以上） */
        const fields = cells.map(c => _zmiHeaderField(c));
        const distinct = new Set(fields.filter(Boolean));
        if (distinct.size >= 2) {
          colMap = {}; extraCols = {};
          const firstField = {};
          fields.forEach((f, c) => {
            if (f && !(f in firstField)) { firstField[f] = c; colMap[c] = f; }
            else if (cells[c]) extraCols[c] = cells[c];
          });
          prev = null;
          return;
        }
        if (!colMap) return;

        /* 小計・合計行はスキップ */
        if (cells.slice(0, 4).some(c => /小計|合計|総計|純資産|差引|計$/.test(_zmiNorm(c)))) return;

        /* 1行分のデータ */
        const R = { _extras: [], _marks: [] };
        Object.entries(colMap).forEach(([c, f]) => { if (cells[c]) R[f] = R[f] ? R[f] + ' ' + cells[c] : cells[c]; });
        Object.entries(extraCols).forEach(([c, hd]) => {
          const val = cells[c];
          if (!val) return;
          if (_ZMI_MARK_RE.test(val.normalize('NFKC'))) {
            const p = _zmiParseHeirPart(val);
            R._marks.push({ name: hd, num: p.num, den: p.den });
          } else {
            R._extras.push(`${hd}：${val}`);
          }
        });
        const descriptive = Object.keys(R).filter(k => !k.startsWith('_') && k !== 'no' && k !== 'amount' && R[k]);
        if (!descriptive.length && !R._extras.length) return;

        /* テンプレートの記入例行はスキップ */
        if (/【記入例】/.test(R.note || '')) { out.skippedSample++; return; }

        const where = `${sheetName} ${rowNo}行目`;
        const ctx = { where, unmatched: out.unmatched, notes: out.notes, review: out.review };

        /* 種別の決定：種別列 → セクション見出し → 内容から推測 */
        let t = _zmiTypeFromKind(R.kind);
        if (!t && section) t = { ...section };
        if (!t) { t = _zmiGuessType(R); out.guessed++; guessedHere.push(rowNo); }

        const built = _zmiBuildAsset(R, t, ctx);

        /* 本ツールの財産目録出力：No.空欄の行は直前の財産の追加口座／追加銘柄 */
        const isContinuation = ('no' in (Object.values(colMap).reduce((o, f) => (o[f] = 1, o), {})))
          && !R.no && prev && prev.asset.type === t.type && (t.type === 'bank' || t.type === 'securities')
          && (!built.heirKey || built.heirKey === prev.heirKey);
        if (isContinuation) {
          const pd = prev.asset.details, bd = built.asset.details;
          if (t.type === 'bank') {
            if (pd.accounts.length === 1 && pd.amount && !pd.accounts[0].amount) pd.accounts[0].amount = pd.amount;
            bd.accounts[0].amount = bd.amount;
            pd.accounts.push(bd.accounts[0]);
          } else {
            if (pd.issues.length === 1 && pd.amount && !pd.issues[0].evalAmount) pd.issues[0].evalAmount = pd.amount;
            bd.issues[0].evalAmount = bd.amount;
            pd.issues.push(bd.issues[0]);
          }
          return;
        }
        out.assets.push(built.asset);
        prev = built;
        found++;
      });
      if (found) out.sheets.push(sheetName);
      if (guessedHere.length) {
        const rng = guessedHere.length > 1 ? `${guessedHere[0]}〜${guessedHere[guessedHere.length - 1]}行目` : `${guessedHere[0]}行目`;
        out.review.unshift(`「${sheetName}」シート ${rng}：種別の列がないため、${guessedHere.length}行の財産の種類を内容から判定しました（色分けのバッジで確認してください）`);
      }
    });
    return out;
  }

  /* ─── ファイル読み込み（CSVは UTF-8 / Shift_JIS 自動判別） ──── */
  async function _zmiReadWorkbook(file) {
    const XL = window._XLSXBase || window.XLSX;
    const buf = await file.arrayBuffer();
    if (/\.csv$/i.test(file.name) || file.type === 'text/csv') {
      let text;
      try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf); }
      catch (e) { text = new TextDecoder('shift_jis').decode(buf); }
      return XL.read(text.replace(/^\uFEFF/, ''), { type: 'string', raw: true });
    }
    return XL.read(buf, { type: 'array' });
  }

  /* 入力が空の財産（初期状態の空カードなど）か */
  function _zmiIsBlankAsset(a) {
    if ((a.heirName || '').trim()) return false;
    if ((a.coOwners || []).some(c => (c.name || '').trim())) return false;
    const DEFAULT_KEYS = new Set(['institutionType', 'branchType', 'accountType', 'houseSubType', 'realestateType', 'balanceUnit', 'unit', 'type', 'label', 'showAmountInDoc', 'hasSiteLand', 'main_noNameReg']);
    const hasVal = o => {
      if (o == null) return false;
      if (Array.isArray(o)) return o.some(hasVal);
      if (typeof o === 'object') return Object.entries(o).some(([k, x]) => !DEFAULT_KEYS.has(k) && hasVal(x));
      if (typeof o === 'boolean') return false;
      return String(o).trim() !== '';
    };
    return !hasVal(a.details);
  }

  /* ═══ v145 登記情報PDF 自動入力 ═══════════════════════════════════════
     登記情報提供サービスのPDF（文字データ付き）を読み取り、
     既存の不動産項目（land_* / building_* / main_* / unit_* / siteRights）へ反映する。
     ・スキャン画像PDF（文字データなし）は非対応
     ・附属建物は取り込み対象外
     ・数字の全角／半角はPDFの表記のまま（地積・床面積の「：」のみ小数点に置換）
  ════════════════════════════════════════════════════════════════════ */

  const _RPDF_SP = '[\\s\\u3000]*';
  const _rpdfCompact = s => String(s || '')
    .replace(/[\s\u3000]/g, '')
    .replace(/（/g, '(').replace(/）/g, ')');

  /* 変換できない文字（私用領域・置換文字・制御文字など）
     登記情報PDFでは「余白」や外字がこの形で取り出されることがある */
  const _RPDF_JUNK_SRC = '[\uE000-\uF8FF\uFFFD\u2612\u0000-\u0008\u000B-\u001F\u007F]|[\uDB80-\uDBFF][\uDC00-\uDFFF]';
  const _rpdfJunkRe = () => new RegExp(_RPDF_JUNK_SRC, 'g');

  /* セル内の変換できない文字を除去
     ・変換できない文字だけのかたまり（「余白」等）→ 黙って除去
     ・普通の文字に混ざっている（外字の可能性）→ 除去して row.gaiji を立てる */
  function _rpdfCleanCell(cell, row) {
    return cell.split(/([ \u3000]+)/).map(t => {
      if (!t || /^[ \u3000]+$/.test(t)) return t;
      const cleaned = t.replace(_rpdfJunkRe(), '');
      if (cleaned !== t) {
        row.junk += t.length - cleaned.length;
        if (cleaned) row.gaiji = true;
      }
      return cleaned;
    }).join('').trim();
  }

  /* 1行のテキストをセル配列に分解（罫線文字・タブ・3文字以上の空白で区切る） */
  function _rpdfToRow(raw) {
    const row = { junk: 0, gaiji: false };
    const src = String(raw || '');
    // 横線だけの行（┠───┼───┨ など）は記録の区切り
    if (/[─━]/.test(src) && !src.replace(/[\u2500-\u257F\s\u3000]/g, '')) {
      row.sep = true; row.cells = []; row.raw = ''; row.compact = '';
      return row;
    }
    // 罫線文字（┃│）がある行は、欄の位置を保ったセル（空欄も含む）を作る
    if (/[│┃]/.test(src)) {
      const t = src.trim();
      let cols = t.split(/[│┃]/);
      if (/^[┃│]/.test(t)) cols = cols.slice(1);
      if (/[┃│]$/.test(t)) cols = cols.slice(0, -1);
      const tmp = { junk: 0, gaiji: false };   // 個数は下の cells 側で数えるので、ここでは外字の有無だけ拾う
      row.cols = cols.map(c => _rpdfCleanCell(c.replace(/\t/g, '\u3000'), tmp));
      if (tmp.gaiji) row.gaiji = true;
    }
    const split = src.replace(/[\u2500-\u257F|｜]/g, '\t');
    row.cells = split.split(/\t|[ \u3000]{3,}/).map(c => _rpdfCleanCell(c, row)).filter(Boolean);
    row.raw = row.cells.join('\t');
    row.compact = _rpdfCompact(row.raw);
    return row;
  }

  const _RPDF_NOISE = /下線のあるものは|整理番号|全部事項証明書|一部事項証明書|記録されている事項|証明した書面|登記官|法務局|請求日時|登記情報提供|^\(?[0-9０-９]+[\/／][0-9０-９]+\)?$/;
  const _RPDF_CAUSE = /〔|\[|年.*月.*日|^[①-⑳]|昭和|平成|令和|大正|明治|変更|錯誤|更正|分筆|合筆|新築|増築|取壊|滅失|区画整理|換地|敷地権|住居表示|から|登記/;
  const _RPDF_AREA  = /^[0-9０-９][0-9０-９,，]*(?:[:：.．][0-9０-９]+)?$/;
  const _RPDF_CHIBAN = /^[^\s\u3000]*[0-9０-９一二三四五六七八九十]+番[^\s\u3000]*$/;
  const _RPDF_SYMBOL = /^[0-9０-９]+$/;
  const _RPDF_CHIMOKU = /^(宅地|田|畑|山林|原野|雑種地|公衆用道路|牧場|塩田|鉱泉地|池沼|墓地|境内地|運河用地|水道用地|用悪水路|ため池|堤|井溝|保安林|鉄道用地|学校用地|公園)$/;
  const _RPDF_RIGHT = /^(所有権|賃借権|地上権|使用借権)$/;
  const _RPDF_FLOOR = /((?:地下|塔屋)?[0-9０-９一二三四五六七八九十]+階(?:部分)?|屋階)[\s\u3000\t]*([0-9０-９][0-9０-９,，]*[:：.．][0-9０-９]+)/g;

  const _rpdfIsYohaku = c => _rpdfCompact(c) === '余白';
  const _rpdfIsCause  = c => _RPDF_CAUSE.test(_rpdfCompact(c));
  const _rpdfIsArea   = c => _RPDF_AREA.test(_rpdfCompact(c));
  /* 登記簿の「：」表記を小数点に（全角／半角は元のまま） */
  const _rpdfArea = s => _rpdfCompact(s).replace(/：/g, '．').replace(/:/g, '.');
  const _rpdfTidy = s => String(s || '').replace(/[ \u3000]{2,}/g, '　').trim();

  function _rpdfFloors(row) {
    const out = [];
    const text = row.cells.join('\t');
    let m;
    _RPDF_FLOOR.lastIndex = 0;
    while ((m = _RPDF_FLOOR.exec(text))) out.push({ label: _rpdfCompact(m[1]), area: _rpdfArea(m[2]) });
    return out;
  }
  const _RPDF_FLOOR_LABEL = /^(?:地下|塔屋)?[0-9０-９一二三四五六七八九十]+階(?:部分)?$|^屋階$/;
  const _rpdfHasFloor = cell => { _RPDF_FLOOR.lastIndex = 0; return _RPDF_FLOOR.test(cell); };

  /* 見出し行 → セクション名 */
  function _rpdfSectionOf(compact) {
    if (/権利部|甲区|乙区|共同担保目録/.test(compact)) return 'other';
    if (!/表題部|の表示\)/.test(compact)) return null;
    if (compact.includes('(土地の表示)')) return 'land';
    if (compact.includes('(附属建物の表示)')) return 'annex';
    if (compact.includes('(主である建物の表示)') || compact.includes('(建物の表示)')) return 'bldg';
    if (compact.includes('(一棟の建物の表示)')) return 'main';
    if (compact.includes('敷地権の目的である土地の表示')) return 'siteLand';
    if (compact.includes('(専有部分の建物の表示)')) return 'unit';
    if (compact.includes('(敷地権の表示)')) return 'site';
    return null;
  }

  /* 表の見出し行か */
  function _rpdfIsHeader(sec, c) {
    if (sec === 'land')     return c.includes('地番') && c.includes('地目');
    if (sec === 'bldg' || sec === 'unit' || sec === 'annex') return c.includes('種類') && c.includes('構造');
    if (sec === 'main')     return c.includes('構造') && c.includes('床面積');
    if (sec === 'siteLand') return c.includes('土地の符号') || (c.includes('所在及び地番') && c.includes('地目'));
    if (sec === 'site')     return c.includes('敷地権の種類') || c.includes('敷地権の割合');
    return false;
  }

  /* 物件種別の判定（指示文の優先順位どおり） */
  function _rpdfDetectCategory(all) {
    const hasUnit  = all.includes('専有部分の建物の表示');
    const hasMain  = all.includes('一棟の建物の表示');
    const hasSite  = all.includes('敷地権の表示') || all.includes('敷地権の目的である土地の表示');
    const hasHouse = all.includes('家屋番号');
    if ((hasMain || hasUnit) && hasSite) return 'condo_with_site_right';
    if (hasUnit && !hasSite)             return 'condo_without_site_right';
    if (hasHouse && !hasUnit)            return 'building';
    if (all.includes('地目') && all.includes('地積') && !hasHouse) return 'land';
    return null;
  }

  /* ラベル付きの行（所在・家屋番号・建物の名称） */
  const _RPDF_LABELS = [
    { key: 'location', label: '所在',       not: /^所在(図番号|及び地番)/ },
    { key: 'houseNo',  label: '家屋番号',   not: /^専有部分の家屋番号/ },
    { key: 'name',     label: '建物の名称', not: null },
  ];
  const _RPDF_SKIP_LABEL = /^(地図番号|所在図番号|筆界特定|調製|不動産番号)/;
  function _rpdfStripLabel(cell, label) {
    const re = new RegExp('^' + label.split('').join(_RPDF_SP) + _RPDF_SP);
    return cell.replace(re, '').trim();
  }

  /* テキスト行 → 構造化データ */
  function parseRegistryText(lines) {
    const rows = lines.map(_rpdfToRow).filter(r => r.sep || (r.compact && !_RPDF_NOISE.test(r.compact)));
    const all = rows.map(r => r.compact).join('\n');
    const category = _rpdfDetectCategory(all);
    const warnings = [];

    const S = {};           // セクションごとの抽出結果
    const gaiji = new Set(); // 外字の可能性がある項目（sec.key）

    const secCount = {};
    let sec = null, inTable = false, curField = null, ownerBlock = false;
    const _OWNER_RE = /^(表題部所有者|所有者|共有者)/;
    const sectionData = name => (S[name] = S[name] || { fields: {}, entries: [], rows: [] });

    rows.forEach(row => {
      const newSec = _rpdfSectionOf(row.compact);
      if (newSec) {
        sec = newSec; inTable = false; curField = null; ownerBlock = false;
        secCount[sec] = (secCount[sec] || 0) + 1;
        return;
      }
      if (!sec || sec === 'other') return;
      const d = sectionData(sec);
      if (row.sep) { if (inTable && !ownerBlock) d.rows.push(row); return; }
      if (_rpdfIsHeader(sec, row.compact)) {
        inTable = true; curField = null;
        if (row.cols && row.cols.length >= 2) d.headerCols = row.cols.map(_rpdfCompact);
        return;
      }
      // 表題部の「所有者」欄（住所・氏名・持分）は財産の表示ではないので、以降この表題部は読まない
      if (_OWNER_RE.test(row.compact)) { ownerBlock = true; curField = null; return; }
      if (ownerBlock) return;

      if (!inTable) {
        if (_RPDF_SKIP_LABEL.test(row.compact)) { curField = null; return; }
        // ラベルが「所」「在」のように字間で分かれた場合も拾う
        let lab = null, labCells = 0;
        for (const l of _RPDF_LABELS) {
          if (!row.compact.startsWith(l.label) || (l.not && l.not.test(row.compact))) continue;
          let joined = '';
          for (let k = 1; k <= Math.min(row.cells.length, l.label.length); k++) {
            joined += _rpdfCompact(row.cells[k - 1]);
            if (joined.startsWith(l.label)) { lab = l; labCells = k; break; }
            if (!l.label.startsWith(joined)) break;
          }
          if (lab) break;
        }
        let valueCells, isNewEntry;
        if (lab) {
          curField = lab.key;
          const rest = labCells === 1 ? _rpdfStripLabel(row.cells[0], lab.label) : '';
          valueCells = (rest ? [rest] : []).concat(row.cells.slice(labCells));
          isNewEntry = true;
        } else if (curField) {
          valueCells = row.cells;
          isNewEntry = row.cells.some(c => _rpdfIsYohaku(c) || _rpdfIsCause(c));
        } else return;
        const value = _rpdfTidy(valueCells.filter(c => !_rpdfIsYohaku(c) && !_rpdfIsCause(c)).join('　'));
        if (!value) return;
        if (row.gaiji) gaiji.add(sec + '.' + curField);
        const list = d.fields[curField] = d.fields[curField] || [];
        if (isNewEntry || !list.length) list.push(value);
        else list[list.length - 1] += value;
        return;
      }
      if (row.gaiji) gaiji.add(sec + '.table');
      d.rows.push(row);
    });

    const lastField = (name, key) => {
      const l = S[name] && S[name].fields[key];
      return l && l.length ? l[l.length - 1] : '';
    };

    /* ── 欄の位置で読む（罫線文字のあるPDF） ──
       見出し行から各欄の役割を決め、横線で区切られた1記録ごとに折り返し行をつなげる */
    const colIdx = (d, re) => d.headerCols ? d.headerCols.findIndex(h => re.test(h)) : -1;
    function colRecords(d) {
      if (!d || !d.headerCols || !d.rows.some(r => r.sep)) return null;   // 横線がなければ従来方式
      const n = d.headerCols.length, recs = [];
      let cur = [];
      d.rows.forEach(r => {
        if (r.sep) { if (cur.length) recs.push(cur); cur = []; }
        else if (r.cols && r.cols.length === n) cur.push(r);
      });
      if (cur.length) recs.push(cur);
      return recs.length ? recs : null;
    }
    // 1記録の中の、ある欄の文字をつなげる（余白・「：」だけの欄は空扱い）
    const colText = (rec, i, sep = '') => i < 0 ? '' : rec.map(r => _rpdfTidy(r.cols[i] || ''))
      .filter(t => t && !_rpdfIsYohaku(t) && !/^[:：]$/.test(_rpdfCompact(t))).join(sep);
    // 符号の欄に値がある行で記録を分ける（符号ごとの間に横線がない場合に備える）
    const splitBySymbol = (recs, iSym) => !recs || iSym < 0 ? recs : recs.flatMap(rec => {
      const out = [];
      rec.forEach(r => {
        if (_rpdfTidy(r.cols[iSym] || '') || !out.length) out.push([r]);
        else out[out.length - 1].push(r);
      });
      return out;
    });
    const colFloors = (rec, i) => {
      if (i < 0) return [];
      const floors = rec.flatMap(r => _rpdfFloors({ cells: [r.cols[i] || ''] }));
      if (floors.length) return floors;
      // 平家建など「〇階」の表記がない床面積 → 階は空欄で面積だけ
      const area = rec.map(r => _rpdfCompact(r.cols[i] || '')).find(t => /[0-9０-９]/.test(t) && _RPDF_AREA.test(t));
      return area ? [{ label: '', area: _rpdfArea(area) }] : [];
    };

    /* 建物系の表（種類・構造・床面積） */
    function parseBuildingTable(name, withKind) {
      const res = { kind: '', structure: '', floors: [] };
      const d = S[name]; if (!d) return res;
      const recs = colRecords(d);
      const iKind = colIdx(d, /種類/), iStr = colIdx(d, /構造/), iFlr = colIdx(d, /床面積/);
      if (recs && iStr >= 0 && iFlr >= 0 && (!withKind || iKind >= 0)) {
        recs.forEach(rec => {
          const kind = withKind ? _rpdfCompact(colText(rec, iKind)) : '';
          const structure = _rpdfCompact(colText(rec, iStr));
          const floors = colFloors(rec, iFlr);
          if (kind) res.kind = kind;
          if (structure) res.structure = structure;
          if (floors.length) res.floors = floors;
        });
        return res;
      }
      let entry = null;
      const entries = [];
      d.rows.forEach(row => {
        if (row.sep) return;
        const floors = _rpdfFloors(row);
        const hasMarker = row.cells.some(c => _rpdfIsYohaku(c) || _rpdfIsCause(c));
        const others = [];
        row.cells.forEach(c => {
          if (_rpdfIsYohaku(c) || _rpdfIsCause(c) || _rpdfHasFloor(c) || _rpdfIsArea(c)) return;
          if (_RPDF_FLOOR_LABEL.test(_rpdfCompact(c))) return;
          // 「居宅　木造…」のように1セルにまとまった場合を分割
          c.split(/[ \u3000]+/).forEach(p => { if (p) others.push(p); });
        });
        const structParts = others.filter(p => p.includes('造') || /階建|平家建/.test(p));
        const kindParts   = others.filter(p => !structParts.includes(p) && !_RPDF_CHIBAN.test(p) && !_RPDF_FLOOR_LABEL.test(p) && p.length <= 20);
        const hasYohaku = row.cells.some(c => _rpdfIsYohaku(c));
        // 種類は「構造・床面積・余白・原因日付」のいずれかと同じ行にあるときだけ採用（所有者の住所・氏名などを誤認しない）
        const kindOk = withKind && kindParts.length && (structParts.length || floors.length || hasYohaku || hasMarker);
        if (!kindOk && !structParts.length && !floors.length && !hasYohaku && !hasMarker) return;  // 無関係な行
        const looksNew = hasYohaku || kindOk || (!withKind && structParts.length && !entry)
          || (hasMarker && !floors.length);
        if (looksNew || !entry) { entry = { kind: '', structure: '', floors: [] }; entries.push(entry); }
        if (kindOk && !entry.kind) entry.kind = kindParts[0];
        if (structParts.length) entry.structure += structParts.join('');
        else if (!hasMarker && entry.structure && others.length && others.every(p => /葺|ぶき|屋根|建$/.test(p))) {
          entry.structure += others.join('');   // 構造の折り返し
        }
        entry.floors.push(...floors);
        // 平家建など「〇階」の表記がない床面積
        if (!floors.length && !entry.floors.length) {
          const lone = row.cells.map(_rpdfCompact).find(c => /[0-9０-９]/.test(c) && _RPDF_AREA.test(c));
          if (lone) entry.floors.push({ label: '', area: _rpdfArea(lone) });
        }
      });
      entries.forEach(e => {
        if (e.kind) res.kind = e.kind;
        if (e.structure) res.structure = e.structure;
        if (e.floors.length) res.floors = e.floors;
      });
      return res;
    }

    const out = { category, fields: {}, warnings, counts: secCount };

    if (category === 'land') {
      const r = { chiban: '', chimoku: '', chiseki: '' };
      const landRecs = colRecords(S.land);
      const iBan = S.land ? colIdx(S.land, /地番/) : -1, iMoku = S.land ? colIdx(S.land, /地目/) : -1, iSeki = S.land ? colIdx(S.land, /地積/) : -1;
      if (landRecs && iBan >= 0 && iMoku >= 0 && iSeki >= 0) {
        landRecs.forEach(rec => {
          const ban = _rpdfCompact(colText(rec, iBan)), moku = _rpdfCompact(colText(rec, iMoku)), seki = _rpdfCompact(colText(rec, iSeki));
          if (ban && !_rpdfIsCause(ban)) r.chiban = ban;
          if (moku) r.chimoku = moku;
          if (/[0-9０-９]/.test(seki)) r.chiseki = _rpdfArea(seki);
        });
      } else (S.land ? S.land.rows : []).forEach(row => {
        if (row.sep) return;
        const isTableRow = row.cells.some(c => { const cc = _rpdfCompact(c);
          return _RPDF_CHIMOKU.test(cc) || _RPDF_AREA.test(cc) || _rpdfIsYohaku(c) || _rpdfIsCause(c); });
        if (!isTableRow) return;
        row.cells.forEach(c => {
          const cc = _rpdfCompact(c);
          if (_rpdfIsYohaku(c) || _rpdfIsCause(c)) return;
          if (_RPDF_CHIMOKU.test(cc)) r.chimoku = cc;
          else if (_RPDF_AREA.test(cc)) r.chiseki = _rpdfArea(cc);
          else if (_RPDF_CHIBAN.test(cc)) r.chiban = cc;
        });
      });
      out.fields = {
        realestateType: 'house', houseSubType: 'land',
        land_location:  lastField('land', 'location'),
        land_lotNumber: r.chiban,
        land_category:  r.chimoku,
        land_area:      r.chiseki,
      };
    } else if (category === 'building') {
      const b = parseBuildingTable('bldg', true);
      out.fields = {
        realestateType: 'house', houseSubType: 'building',
        building_location:  lastField('bldg', 'location'),
        building_lotNumber: lastField('bldg', 'houseNo'),
        building_type:      b.kind,
        building_structure: b.structure,
        building_floors:    b.floors,
      };
      if (S.annex) warnings.push('附属建物の表示がありますが、今回の取り込み対象外です。必要に応じて手入力してください。');
    } else if (category === 'condo_with_site_right' || category === 'condo_without_site_right') {
      const m = parseBuildingTable('main', false);
      const u = parseBuildingTable('unit', true);
      const mainName = lastField('main', 'name');
      const uf = u.floors[u.floors.length - 1] || { label: '', area: '' };
      out.fields = {
        realestateType: 'condominium',
        hasSiteLand:    category === 'condo_with_site_right',
        main_location:  lastField('main', 'location'),
        main_name:      mainName,
        main_noNameReg: !mainName,
        main_structure: m.structure,
        main_floors:    m.floors.length ? m.floors : [{ label: '', area: '' }],
        unit_lotNumber: lastField('unit', 'houseNo'),
        unit_name:      lastField('unit', 'name'),
        unit_type:      u.kind,
        unit_structure: u.structure,
        unit_floorPart: uf.label.replace(/階部分$|階$/, ''),
        unit_area:      uf.area,
      };
      if (u.floors.length > 1) warnings.push('専有部分の床面積が複数の階にわたっています。最後の階のみ反映したので確認してください。');

      if (category === 'condo_with_site_right') {
        const map = new Map();
        const get = sym => { if (!map.has(sym)) map.set(sym, { symbol: sym, lotAddress: '', category: '', area: '', rightType: '', ratio: '' }); return map.get(sym); };
        let cur = null;
        const slRecs = colRecords(S.siteLand), stRecs = colRecords(S.site);
        const sl = S.siteLand, st = S.site;
        const slSym = sl ? colIdx(sl, /符号/) : -1, slAddr = sl ? colIdx(sl, /所在及び地番/) : -1,
              slMoku = sl ? colIdx(sl, /地目/) : -1, slSeki = sl ? colIdx(sl, /地積/) : -1;
        const stSym = st ? colIdx(st, /符号/) : -1, stKind = st ? colIdx(st, /種類/) : -1, stRatio = st ? colIdx(st, /割合/) : -1;
        const useColSL = slRecs && slSym >= 0 && slAddr >= 0;
        const useColST = stRecs && stSym >= 0 && stRatio >= 0;
        if (useColSL) splitBySymbol(slRecs, slSym).forEach(rec => {
          const sym = _rpdfCompact(colText(rec, slSym)); if (!sym) return;
          const o = get(sym);
          const addr = colText(rec, slAddr); if (addr) o.lotAddress = addr;
          const moku = _rpdfCompact(colText(rec, slMoku)); if (moku) o.category = moku;
          const seki = _rpdfCompact(colText(rec, slSeki)); if (/[0-9０-９]/.test(seki)) o.area = _rpdfArea(seki);
        });
        if (useColST) splitBySymbol(stRecs, stSym).forEach(rec => {
          const sym = _rpdfCompact(colText(rec, stSym)); if (!sym) return;
          const o = get(sym);
          const kind = _rpdfCompact(colText(rec, stKind)); if (kind) o.rightType = kind;
          const ratio = _rpdfCompact(colText(rec, stRatio)); if (ratio) o.ratio = ratio;
        });
        if (!useColSL) (S.siteLand ? S.siteLand.rows : []).forEach(row => {
          if (row.sep) return;
          const cells = row.cells.slice();
          const isNew = cells.length && _RPDF_SYMBOL.test(_rpdfCompact(cells[0]));
          if (isNew) cur = get(_rpdfCompact(cells.shift()));
          if (!cur) return;
          const addr = [];
          cells.forEach(c => {
            const cc = _rpdfCompact(c);
            if (_rpdfIsYohaku(c) || _rpdfIsCause(c)) return;
            if (_RPDF_CHIMOKU.test(cc)) cur.category = cc;
            else if (_RPDF_AREA.test(cc)) cur.area = _rpdfArea(cc);
            else addr.push(_rpdfTidy(c));
          });
          if (!addr.length) return;
          if (isNew) cur.lotAddress = addr.join('　');
          else cur.lotAddress += addr.join('');   // 所在及び地番の折り返し
        });
        cur = null;
        if (!useColST) (S.site ? S.site.rows : []).forEach(row => {
          if (row.sep) return;
          const cells = row.cells.slice();
          if (cells.length && _RPDF_SYMBOL.test(_rpdfCompact(cells[0]))) cur = get(_rpdfCompact(cells.shift()));
          if (!cur) return;
          cells.forEach(c => {
            const cc = _rpdfCompact(c);
            if (_RPDF_RIGHT.test(cc)) cur.rightType = cc;
            else if (cc.includes('分の') && !_rpdfIsCause(c)) cur.ratio = cc;
          });
        });
        out.fields.siteRights = map.size ? [...map.values()] : [{ symbol: '', lotAddress: '', category: '', area: '', rightType: '', ratio: '' }];
      }
    }

    const _GAIJI_LABEL = {
      'land.location': '所在', 'land.table': '地番・地目・地積',
      'bldg.location': '所在', 'bldg.houseNo': '家屋番号', 'bldg.table': '種類・構造・床面積',
      'main.location': '一棟の建物の所在', 'main.name': '一棟の建物の名称', 'main.table': '一棟の建物の構造・床面積',
      'unit.houseNo': '専有部分の家屋番号', 'unit.name': '専有部分の建物の名称', 'unit.table': '専有部分の種類・構造・床面積',
      'siteLand.table': '敷地権の目的である土地（所在及び地番など）', 'site.table': '敷地権の種類・割合',
    };
    const gaijiLabels = [...gaiji].map(k => _GAIJI_LABEL[k]).filter(Boolean);
    if (gaijiLabels.length) {
      warnings.push(`「${[...new Set(gaijiLabels)].join('」「')}」の中に変換できない文字があり、取り除きました。外字（珍しい漢字など）が抜けている可能性があるため、必ず登記簿と照合してください。`);
    }
    out.junkCount = rows.reduce((n, r) => n + r.junk, 0);

    ['land', 'bldg', 'main', 'unit'].forEach(k => {
      if ((secCount[k] || 0) > 1) warnings.push('1つのPDFに複数の物件が含まれている可能性があります。読み取り結果をよく確認してください。');
    });
    return out;
  }

  /* PDF → 行テキスト（PDF.js で座標から行を組み立てる） */
  async function _rpdfExtractLines(file) {
    const pdf = await pdfjsLib.getDocument({
      data: await file.arrayBuffer(),
      // 日本語フォント（CIDフォント）の文字対応表。これがないと文字が取り出せないPDFがある
      cMapUrl: window._RPDF_CMAP_URL || 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/',
      cMapPacked: true,
    }).promise;
    const lines = [];
    let charCount = 0;
    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p);
      const tc = await page.getTextContent();
      const items = tc.items
        .filter(it => typeof it.str === 'string' && it.str.trim() !== '')
        .map(it => ({ s: it.str, x: it.transform[4], y: it.transform[5], w: it.width || 0,
                      h: Math.abs(it.transform[3]) || it.height || 10 }));
      charCount += items.reduce((n, it) => n + it.s.trim().length, 0);
      items.sort((a, b) => (b.y - a.y) || (a.x - b.x));
      const groups = [];
      items.forEach(it => {
        const g = groups[groups.length - 1];
        if (g && Math.abs(g.y - it.y) <= Math.max(2, it.h * 0.4)) g.items.push(it);
        else groups.push({ y: it.y, items: [it] });
      });
      groups.forEach(g => {
        g.items.sort((a, b) => a.x - b.x);
        const fs = g.items.map(i => i.h).sort((a, b) => a - b)[Math.floor(g.items.length / 2)] || 10;
        let line = '', prevEnd = null;
        g.items.forEach(it => {
          if (prevEnd !== null) {
            const gap = it.x - prevEnd;
            if (gap > fs * 1.8) line += '\t';
            else if (gap > fs * 0.25) line += '\u3000';   // 登記簿の字間は全角空白で扱う
          }
          line += it.s;
          prevEnd = it.x + it.w;
        });
        lines.push(line);
      });
    }
    return { lines, charCount, pages: pdf.numPages };
  }

  function _rpdfFmt(key, v) {
    if (key === 'building_floors' || key === 'main_floors')
      return (v || []).filter(f => f.label || f.area).map(f => (f.label ? `${f.label}　` : '') + `${f.area}㎡`).join('、');
    if (key === 'siteRights')
      return (v || []).map(s => `符号${s.symbol}：${s.lotAddress}　${s.category}　${s.area}㎡　${s.rightType}　${s.ratio}`).join('<br>');
    return v == null ? '' : String(v);
  }
  function _rpdfIsFilled(key, v) {
    if (key === 'building_floors' || key === 'main_floors')   // 「1階」等のラベルだけなら未入力扱い
      return Array.isArray(v) && v.some(f => String((f && f.area) || '').trim());
    if (Array.isArray(v)) return v.some(o => Object.values(o || {}).some(x => String(x || '').trim()));
    return String(v == null ? '' : v).trim() !== '';
  }

  /* 確認用：読み取ったテキスト（変換できない文字は [U+XXXX] で表示） */
  function _rpdfRawHtml(lines) {
    const junkRe = new RegExp('^(?:' + _RPDF_JUNK_SRC + ')$');
    const tally = new Map();
    const body = lines.map(line => Array.from(line).map(ch => {
      if (ch === '\t') return '<span class="rpdf-tab">→</span>';
      if (!junkRe.test(ch)) return esc(ch);
      const code = 'U+' + ch.codePointAt(0).toString(16).toUpperCase().padStart(4, '0');
      tally.set(code, (tally.get(code) || 0) + 1);
      return `<mark class="rpdf-junk">[${code}]</mark>`;
    }).join('')).join('\n');
    const total = [...tally.values()].reduce((a, b) => a + b, 0);
    const tallyHtml = total
      ? `<p class="zmi-muted" style="margin:0.35rem 0 0;">変換できない文字：${total}個（${[...tally].map(([c, n]) => `${c}×${n}`).join('、')}）</p>`
      : `<p class="zmi-muted" style="margin:0.35rem 0 0;">変換できない文字はありませんでした。</p>`;
    return `<details style="margin-top:0.6rem;"><summary class="zmi-muted" style="cursor:pointer;">読み取ったテキストを表示${total ? `（変換できない文字 ${total}個）` : ''}</summary>
      ${tallyHtml}
      <pre class="rpdf-raw">${body}</pre>
      <p class="zmi-muted" style="margin-top:0.25rem;">「→」は欄の区切り、<mark class="rpdf-junk">[U+…]</mark> は変換できなかった文字です。</p></details>`;
  }

  /* 取り込みメイン（不動産カードの「登記情報PDFから自動入力」） */
  async function handleRegistryPdf(event, assetId) {
    const file = event.target.files[0];
    event.target.value = '';
    if (!file) return;
    const asset = assets.find(a => a.id === assetId);
    if (!asset) return;
    if (typeof window.pdfjsLib === 'undefined') {
      alert('PDF読み取りライブラリ（PDF.js）が読み込まれていません。\nインターネット接続を確認し、ページを再読み込みしてからお試しください。');
      return;
    }
    const setStatus = (msg, ok) => {
      _rpdfStatus[assetId] = { msg, ok };
      const el = document.getElementById('rpdfStatus-' + assetId);
      if (el) { el.textContent = msg; el.style.color = _rpdfStatusColor(ok); }
    };
    setStatus('PDFを読み取っています…');

    let ext, result;
    try {
      ext = await _rpdfExtractLines(file);
      result = parseRegistryText(ext.lines);
    } catch (e) {
      console.error(e);
      setStatus('PDFを読み取れませんでした', false);
      alert('PDFの読み取りに失敗しました。\n' + (e && e.message ? e.message : e));
      return;
    }

    const rawHtml = _rpdfRawHtml(ext.lines);

    if (ext.charCount < 20) {
      setStatus('文字データのないPDFです', false);
      await _zmiModal('文字データが見つかりません',
        `<p class="zmi-p">「${esc(file.name)}」には文字データがありません。スキャンした画像のPDFには対応していません。</p>
         <p class="zmi-p">登記情報提供サービスからダウンロードしたPDFをお使いいただくか、手入力してください。</p>`,
        [{ label: '閉じる', value: 'ok', cls: 'save-ok-btn' }]);
      return;
    }
    if (!result.category) {
      setStatus('物件の種別を判定できませんでした', false);
      await _zmiModal('物件の種別を判定できませんでした',
        `<p class="zmi-p">「${esc(file.name)}」から、土地・建物・区分建物のいずれかを示す記載（「地目」「家屋番号」「専有部分の建物の表示」など）が見つかりませんでした。</p>
         <p class="zmi-p">登記事項の全部事項が記載されたPDFか確認してください。</p>${rawHtml}`,
        [{ label: '閉じる', value: 'ok', cls: 'save-ok-btn' }]);
      return;
    }

    const f = result.fields;
    const keys = Object.keys(f).filter(k => !_RPDF_SKIP_KEYS.has(k));
    const missing = keys.filter(k => !_rpdfIsFilled(k, f[k]) && !(k === 'main_name' && f.main_noNameReg)
      && !((k === 'main_structure' || k === 'main_floors') && !f.main_noNameReg)
      && k !== 'unit_name');
    const conflicts = keys.filter(k => _rpdfIsFilled(k, asset.details[k]) && _rpdfIsFilled(k, f[k])
      && JSON.stringify(asset.details[k]) !== JSON.stringify(f[k]));

    const rowsHtml = keys.filter(k => _rpdfIsFilled(k, f[k])).map(k =>
      `<tr><th style="text-align:left;white-space:nowrap;padding:0.2rem 0.6rem 0.2rem 0;vertical-align:top;font-weight:600;">${esc(_RPDF_FIELD_LABEL[k] || k)}</th>
       <td style="padding:0.2rem 0;">${k === 'siteRights' ? _rpdfFmt(k, f[k]).split('<br>').map(esc).join('<br>') : esc(_rpdfFmt(k, f[k]))}</td></tr>`).join('');
    const extra = [];
    if (f.main_noNameReg) extra.push('一棟の建物に名称の登記がないため、「建物名称の登記なし」として反映します。');
    if (result.junkCount) extra.push(`変換できない文字を${result.junkCount}個取り除きました（多くは「余白」などの欄です）。下の「読み取ったテキストを表示」で確認できます。`);
    const summaryHtml = `
      <div class="zmi-chips"><span class="zmi-chip">${esc(_RPDF_CAT_LABEL[result.category])}</span></div>
      <table style="font-size:0.78rem;line-height:1.55;border-collapse:collapse;width:100%;">${rowsHtml}</table>
      ${missing.length ? `<div class="zmi-box zmi-warn"><div class="zmi-box-hd">読み取れなかった項目</div>
        <ul class="zmi-list">${missing.map(k => `<li>${esc(_RPDF_FIELD_LABEL[k] || k)}</li>`).join('')}</ul>
        <p class="zmi-muted" style="margin-top:0.3rem;">反映後に手入力してください。</p></div>` : ''}
      ${result.warnings.concat(extra).length ? `<div class="zmi-box"><div class="zmi-box-hd">ご確認ください</div>
        <ul class="zmi-list">${result.warnings.concat(extra).map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>` : ''}`;

    if (conflicts.length) {
      const ans = await _zmiModal('入力済みの項目を上書きします',
        `<p class="zmi-p">次の項目はすでに入力されています。PDFの内容で上書きしてよろしいですか？</p>
         <div class="zmi-box zmi-warn"><div class="zmi-box-hd">上書きされる項目</div>
           <ul class="zmi-list">${conflicts.map(k => `<li>${esc(_RPDF_FIELD_LABEL[k] || k)}：${
             k === 'siteRights' ? '（現在の敷地権の表示をすべて置き換え）' : esc(_rpdfFmt(k, asset.details[k])) + ' → ' + esc(_rpdfFmt(k, f[k]))}</li>`).join('')}</ul></div>
         <p class="zmi-p" style="margin-top:0.7rem;font-weight:600;">読み取り結果</p>${summaryHtml}${rawHtml}`,
        [{ label: 'キャンセル', value: 'cancel' }, { label: '上書きして反映', value: 'ok', cls: 'save-ok-btn zmi-btn-danger' }]);
      if (ans !== 'ok') { setStatus('反映を取り消しました'); return; }
    }

    /* 反映（空の値は既存を消さない） */
    Object.keys(f).forEach(k => {
      if (_RPDF_SKIP_KEYS.has(k) || _rpdfIsFilled(k, f[k])) {
        asset.details[k] = Array.isArray(f[k]) ? JSON.parse(JSON.stringify(f[k])) : f[k];
      }
    });
    renderAssetInputs();
    updatePreview();
    setStatus(`「${file.name}」から反映しました（${_RPDF_CAT_LABEL[result.category]}）`, true);

    if (!conflicts.length) {
      await _zmiModal('📄 登記情報PDFから反映しました',
        `<p class="zmi-p">「${esc(file.name)}」の内容を入力欄に反映しました。内容が登記の記載と一致しているか確認してください。</p>${summaryHtml}${rawHtml}`,
        [{ label: 'OK', value: 'ok', cls: 'save-ok-btn' }]);
    }
  }

  /* ─── モーダル（選択肢付き） ─────────────────────────────────── */
  let _zmiResolver = null;

  /* ─── 取り込みメイン ─────────────────────────────────────────── */
  /* ═══ v148 被相続人シート（標準テンプレート → 被相続人の表示） ═══════════ */
  const _DEC_FIELDS = [
    { key: 'name',    id: 'deceasedName',    label: '氏名',       re: /^氏名$|^被相続人氏名$|^名前$/,     hint: '例：相続 一郎（戸籍どおりの表記。旧字体もそのまま）' },
    { key: 'honseki', id: 'deceasedHonseki', label: '本籍',       re: /^本籍$|^最後の本籍$/,              hint: '例：名古屋市熱田区〇〇町一丁目1番地' },
    { key: 'address', id: 'deceasedAddress', label: '最後の住所', re: /^最後の住所$|^住所$|^最後の住所地$/, hint: '例：名古屋市熱田区〇〇町一丁目1番1号（住民票の除票どおり）' },
    { key: 'dob',     id: 'deceasedDob',     label: '生年月日',   re: /^生年月日$/,                        hint: '例：昭和20年1月2日（Excelの日付「1945/1/2」でも和暦に変換して取り込みます）' },
    { key: 'dod',     id: 'deceasedDod',     label: '死亡年月日', re: /^死亡年月日$|^死亡日$/,              hint: '例：令和8年3月4日（Excelの日付「2026/3/4」でも和暦に変換して取り込みます）' },
  ];
  const _DEC_MID_COLS = [
    { key: 'name', label: '【氏名】' }, { key: 'relationship', label: '【続柄】' },
    { key: 'address', label: '【最後の住所】' }, { key: 'honseki', label: '【本籍】' }, { key: 'dod', label: '【死亡年月日】' },
  ];

  /* 日付セル → 和暦文字列（Excelの日付・西暦の文字列・S20.1.2 などに対応） */
  function _decDateStr(cell) {
    if (!cell || cell.v === undefined || cell.v === null || cell.v === '') return '';
    const XL = window._XLSXBase || window.XLSX;
    if (typeof cell.v === 'number') {
      try { const d = XL.SSF.parse_date_code(cell.v); if (d && d.y > 1867) return toJapaneseEra(d.y, d.m, d.d); } catch (e) {}
      return String(cell.w || cell.v).trim();
    }
    if (cell.v instanceof Date) return toJapaneseEra(cell.v.getFullYear(), cell.v.getMonth() + 1, cell.v.getDate());
    const raw = String(cell.v).trim();
    const s = raw.normalize('NFKC').replace(/\s+/g, '');
    let m = s.match(/^(\d{4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})日?$/);
    if (m) {
      const y = +m[1], mo = +m[2], d = +m[3];
      if (y > 1867 && mo >= 1 && mo <= 12 && d >= 1 && d <= 31) return toJapaneseEra(y, mo, d);
    }
    m = s.match(/^([MTSHRmtshr明大昭平令])\.?(\d{1,2}|元)[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})日?$/);
    if (m) {
      const era = { M: '明治', T: '大正', S: '昭和', H: '平成', R: '令和', 明: '明治', 大: '大正', 昭: '昭和', 平: '平成', 令: '令和' }[m[1].toUpperCase()] || m[1];
      return `${era}${m[2] === '元' ? '元' : +m[2]}年${+m[3]}月${+m[4]}日`;
    }
    return raw;
  }
  const _decCellText = cell => (!cell || cell.v === undefined || cell.v === null) ? '' : String(cell.w != null && typeof cell.v !== 'string' ? cell.w : cell.v).trim();

  /* 「被相続人」シートを読む。見つからなければ null */
  function _zmiParseDeceasedSheet(wb) {
    const XL = window._XLSXBase || window.XLSX;
    const name = wb.SheetNames.find(n => /被相続人/.test(n));
    if (!name) return null;
    const ws = wb.Sheets[name];
    if (!ws || !ws['!ref']) return null;
    const range = XL.utils.decode_range(ws['!ref']);
    const cellAt = (r, c) => ws[XL.utils.encode_cell({ r, c })];
    const norm = s => String(s || '').normalize('NFKC').replace(/[\s【】\[\]]/g, '');

    const main = { name: '', honseki: '', address: '', dob: '', dod: '' };
    const mids = [];
    let midHeader = null;    // { key: col }
    let midStart = -1;
    for (let r = range.s.r; r <= range.e.r; r++) {
      /* 中間被相続人の表の見出し行 */
      const rowTexts = [];
      for (let c = range.s.c; c <= Math.min(range.e.c, 12); c++) rowTexts[c] = norm(_decCellText(cellAt(r, c)));
      if (!midHeader && rowTexts.includes('氏名') && rowTexts.includes('死亡年月日') && rowTexts.includes('続柄')) {
        midHeader = {};
        _DEC_MID_COLS.forEach(col => { const i = rowTexts.indexOf(norm(col.label)); if (i >= 0) midHeader[col.key] = i; });
        midHeader._note = rowTexts.indexOf('備考');
        midStart = r + 1;
        continue;
      }
      if (midHeader && r >= midStart) {
        const note = midHeader._note >= 0 ? _decCellText(cellAt(r, midHeader._note)) : '';
        if (/記入例/.test(note)) continue;
        const m = {};
        _DEC_MID_COLS.forEach(col => {
          const cell = midHeader[col.key] != null ? cellAt(r, midHeader[col.key]) : null;
          m[col.key] = col.key === 'dod' ? _decDateStr(cell) : _decCellText(cell);
        });
        if (Object.values(m).some(Boolean)) mids.push(m);
        continue;
      }
      /* 被相続人本人（「項目｜内容」の縦型） */
      const label = norm(_decCellText(cellAt(r, range.s.c)));
      const f = _DEC_FIELDS.find(x => x.re.test(label));
      if (!f) continue;
      const vCell = cellAt(r, range.s.c + 1);
      main[f.key] = (f.key === 'dob' || f.key === 'dod') ? _decDateStr(vCell) : _decCellText(vCell);
    }
    const hasMain = Object.values(main).some(Boolean);
    if (!hasMain && !mids.length) return null;
    return { sheet: name, main, mids };
  }

  /* 取り込んだ被相続人情報を画面へ反映（入力済みと違う場合は確認） */
  async function _zmiApplyDeceased(dec) {
    const cur = {};
    _DEC_FIELDS.forEach(f => { const el = document.getElementById(f.id); cur[f.key] = el ? el.value.trim() : ''; });
    const curMids = (intermediateDeceased || []).filter(m => Object.values(m).some(v => String(v || '').trim()));
    const conflicts = _DEC_FIELDS.filter(f => dec.main[f.key] && cur[f.key] && dec.main[f.key] !== cur[f.key]);
    const midSame = JSON.stringify(curMids.map(m => _DEC_MID_COLS.map(c => (m[c.key] || '').trim())))
                 === JSON.stringify(dec.mids.map(m => _DEC_MID_COLS.map(c => m[c.key] || '')));
    const midConflict = dec.mids.length && curMids.length && !midSame;

    let mode = 'overwrite';
    if (conflicts.length || midConflict) {
      const rows = conflicts.map(f => `<tr><th>${esc(f.label)}</th><td>${esc(cur[f.key])}</td><td><strong>${esc(dec.main[f.key])}</strong></td></tr>`).join('');
      const midRow = midConflict ? `<tr><th>中間被相続人</th><td>${curMids.map(m => esc(m.name || '（氏名なし）')).join('、')}</td><td><strong>${dec.mids.map(m => esc(m.name || '（氏名なし）')).join('、')}</strong></td></tr>` : '';
      mode = await _zmiModal('被相続人の情報がすでに入力されています',
        `<p class="zmi-p">テンプレートの「${esc(dec.sheet)}」シートの内容が、現在の入力と異なります。どのように反映しますか？</p>
         <div class="bpdf-table-wrap"><table class="bpdf-table dec-cmp">
           <thead><tr><th>項目</th><th>現在の入力</th><th>シートの内容</th></tr></thead>
           <tbody>${rows}${midRow}</tbody></table></div>
         <ul class="zmi-list" style="margin-top:0.6rem;">
           <li><strong>上書きする</strong>：シートに記入のある項目を、シートの内容に置き換えます（シートが空欄の項目はそのまま）。</li>
           <li><strong>空欄だけ埋める</strong>：現在空欄の項目だけにシートの内容を入れます。</li>
           <li><strong>反映しない</strong>：被相続人の情報は変更しません（財産の取り込みは続けます）。</li>
         </ul>`,
        [{ label: '反映しない', value: 'skip' },
         { label: '空欄だけ埋める', value: 'fill', cls: 'save-ok-btn' },
         { label: '上書きする', value: 'overwrite', cls: 'save-ok-btn zmi-btn-danger' }]);
      if (!mode) mode = 'skip';
    }
    if (mode === 'skip') return '被相続人の情報は反映しませんでした。';

    const changed = [];
    _DEC_FIELDS.forEach(f => {
      const v = dec.main[f.key];
      if (!v) return;
      if (mode === 'fill' && cur[f.key]) return;
      const el = document.getElementById(f.id);
      if (el && el.value !== v) { el.value = v; changed.push(f.label); }
    });
    if (dec.mids.length && (mode === 'overwrite' || !curMids.length) && !midSame) {
      intermediateDeceased = dec.mids.map(m => ({ name: m.name || '', address: m.address || '', honseki: m.honseki || '', dod: m.dod || '', relationship: m.relationship || '' }));
      includeSubsequent = true;
      const chk = document.getElementById('includeSubsequent');
      if (chk) chk.checked = true;
      const panel = document.getElementById('subsequentPanel');
      if (panel) panel.style.display = 'block';
      renderIntermediateDeceasedList();
      renderHeirInputs();
      changed.push(`中間被相続人${dec.mids.length}名`);
    }
    updatePreview();
    return changed.length ? `被相続人の表示に反映しました（${changed.join('・')}）。` : '被相続人の情報に変更はありませんでした。';
  }

  /* ═══ v150 相続人シート（標準テンプレート → 相続人欄） ══════════════════
     ・氏名と住所を1行に1名。並び順はそのまま相続人欄の順番になる
     ・財産の取得者を照合できるよう、財産より先に反映する                     */
  const _HEIR_SHEET_COLS = [
    { k: 'no',      h: 'No.',   w: 6,  hint: '1、2、3…' },
    { k: 'name',    h: '氏名',  w: 22, hint: '例：相続 太郎（戸籍どおりの表記。旧字体もそのまま）' },
    { k: 'address', h: '住所',  w: 46, hint: '例：名古屋市熱田区〇〇町一丁目2番3号（住民票どおり）' },
    { k: 'note',    h: '備考',  w: 34, hint: 'メモ欄（続柄など。協議書には反映されません）' },
  ];
  const _isHeirSheetName = n => /相続人/.test(n) && !/被相続人|中間/.test(n);

  /* 「相続人」シートを読む。見つからなければ null */
  function _zmiParseHeirSheet(wb) {
    const XL = window._XLSXBase || window.XLSX;
    const name = wb.SheetNames.find(_isHeirSheetName);
    if (!name) return null;
    const ws = wb.Sheets[name];
    if (!ws || !ws['!ref']) return null;
    const rows = XL.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false, blankrows: true });
    const norm = s => _zmiNorm(s);
    const hr = rows.slice(0, 12).findIndex(r => { const c = r.map(norm); return c.includes('氏名') && c.includes('住所'); });
    if (hr < 0) return null;
    const hdr = rows[hr].map(norm);
    const col = k => hdr.indexOf(norm(_HEIR_SHEET_COLS.find(c => c.k === k).h));
    const cN = col('name'), cA = col('address'), cB = col('note');
    const hints = _HEIR_SHEET_COLS.map(c => norm(c.hint));
    const list = [];
    let skipped = 0;
    for (let i = hr + 1; i < rows.length; i++) {
      const r = rows[i].map(c => _zmiTrim(c));
      const nm = cN >= 0 ? r[cN] || '' : '', ad = cA >= 0 ? r[cA] || '' : '', nt = cB >= 0 ? r[cB] || '' : '';
      if (!nm && !ad) continue;
      if (hints.includes(norm(nm)) || hints.includes(norm(ad))) continue;     // 記入のポイント行
      if (/【記入例】/.test(nt)) { skipped++; continue; }
      list.push({ name: nm, address: ad });
    }
    return list.length ? { sheet: name, list, skipped } : null;
  }

  /* 相続人欄へ反映（入力済みの相続人がいて内容が違う場合は確認） */
  async function _zmiApplyHeirSheet(hs) {
    const filled = heirs.filter(h => (h.name || '').trim() || (h.address || '').trim());
    const key = arr => JSON.stringify(arr.map(h => [_zmiNorm(h.name), _zmiNorm(h.address)]));
    if (filled.length && key(filled) === key(hs.list)) return '相続人の情報に変更はありませんでした。';
    let mode = 'replace';
    if (filled.length) {
      const li = arr => `<ul class="zmi-list">${arr.map(h => `<li>${esc(h.name || '（氏名なし）')}　<span class="zmi-muted">${esc(h.address || '')}</span></li>`).join('')}</ul>`;
      mode = await _zmiModal('相続人がすでに入力されています',
        `<p class="zmi-p">テンプレートの「${esc(hs.sheet)}」シートの内容が、現在の相続人欄と異なります。どのように反映しますか？</p>
         <div class="zmi-box"><div class="zmi-box-hd">現在の相続人欄（${filled.length}名）</div>${li(filled)}</div>
         <div class="zmi-box"><div class="zmi-box-hd">シートの内容（${hs.list.length}名）</div>${li(hs.list)}</div>
         <ul class="zmi-list" style="margin-top:0.6rem;">
           <li><strong>置き換える</strong>：相続人欄をシートの内容（並び順も）に置き換えます。同じ氏名の相続人は、【】内の肩書などの設定を引き継ぎます。</li>
           <li><strong>後ろに追加</strong>：相続人欄にない氏名だけを後ろに追加します。</li>
           <li><strong>反映しない</strong>：相続人欄は変更しません（財産などの取り込みは続けます）。</li>
         </ul>`,
        [{ label: '反映しない', value: 'skip' },
         { label: '後ろに追加', value: 'append', cls: 'save-ok-btn' },
         { label: '置き換える', value: 'replace', cls: 'save-ok-btn zmi-btn-danger' }]);
      if (!mode) mode = 'skip';
    }
    if (mode === 'skip') return '相続人の情報は反映しませんでした。';

    const blankHeir = h => ({ name: h.name || '', address: h.address || '', isSubsequent: false, subsequentTarget: '', subsequentLabel: '', sigLabelOverride: '' });
    let added = 0;
    if (mode === 'replace') {
      heirs = hs.list.map(h => {
        const old = filled.find(o => _zmiNorm(o.name) && _zmiNorm(o.name) === _zmiNorm(h.name));
        return old ? { ...old, name: h.name, address: h.address || old.address } : blankHeir(h);
      });
      added = heirs.length;
    } else {
      const base = heirs.filter(h => (h.name || '').trim() || (h.address || '').trim());
      hs.list.forEach(h => {
        if (base.some(o => _zmiNorm(o.name) === _zmiNorm(h.name))) return;
        base.push(blankHeir(h)); added++;
      });
      heirs = base.length ? base : [blankHeir({})];
    }
    renderHeirInputs();
    renderAssetInputs();
    if (typeof renderUnknownHeirInput === 'function') renderUnknownHeirInput();
    if (document.getElementById('includeAncestoral')?.checked && typeof renderAncestoralHeirInput === 'function') renderAncestoralHeirInput();
    updatePreview();
    return mode === 'replace' ? `相続人欄を${added}名の内容に置き換えました。` : (added ? `相続人を${added}名追加しました。` : '追加する相続人はありませんでした（すでに登録済み）。');
  }

  async function handleZaisanImport(event) {
    const file = event.target.files[0];
    if (!file) return;
    event.target.value = '';
    const statusEl = document.getElementById('zmiStatus');
    const setStatus = (msg, ok) => {
      if (!statusEl) return;
      statusEl.textContent = msg;
      statusEl.style.color = ok === true ? 'var(--green)' : ok === false ? 'var(--red)' : 'var(--text-muted)';
    };
    if (typeof (window._XLSXBase || window.XLSX) === 'undefined') {
      alert('XLSXライブラリが読み込まれていません。\nページを再読み込みしてお試しください。'); return;
    }
    setStatus('読込中…');

    let result, wb, heirSheet;
    try {
      wb = await _zmiReadWorkbook(file);
      heirSheet = _zmiParseHeirSheet(wb);             // v150
    } catch (e) {
      console.error(e);
      setStatus('読み込みに失敗しました', false);
      alert('ファイルの読み込みに失敗しました。\n' + e.message);
      return;
    }
    /* v150 相続人シート：財産の取得者を照合できるよう、財産の解析より先に反映 */
    const heirMsg = heirSheet ? await _zmiApplyHeirSheet(heirSheet) : '';
    try {
      result = _zmiParseWorkbook(wb);
      result.deceased = _zmiParseDeceasedSheet(wb);   // v148
      result.heirMsg = heirMsg;
    } catch (e) {
      console.error(e);
      setStatus('読み込みに失敗しました', false);
      alert('ファイルの読み込みに失敗しました。\n' + e.message);
      return;
    }

    /* v148 被相続人シート：先に反映（財産がなくても被相続人だけ取り込める） */
    if (result.deceased) result.deceasedMsg = await _zmiApplyDeceased(result.deceased);
    if (!result.assets.length && (result.deceased || result.heirMsg)) {
      setStatus(`✅ 被相続人・相続人の情報を読み込みました（${file.name}）`, true);
      await _zmiModal('📊 被相続人・相続人の情報を読み込みました',
        `${result.deceasedMsg ? `<p class="zmi-p">👤 被相続人：${esc(result.deceasedMsg)}</p>` : ''}${result.heirMsg ? `<p class="zmi-p">👥 相続人：${esc(result.heirMsg)}</p>` : ''}<p class="zmi-p zmi-muted">財産目録のシートには取り込める財産がありませんでした。</p>`,
        [{ label: 'OK', value: 'ok', cls: 'save-ok-btn' }]);
      return;
    }
    if (!result.assets.length) {
      setStatus('取り込める財産が見つかりませんでした', false);
      await _zmiModal('財産が見つかりませんでした',
        `<p class="zmi-p">「${esc(file.name)}」から財産データを読み取れませんでした。</p>
         <p class="zmi-p">1行目（または表の上部）に「金融機関名」「所在地」「評価額」などの<strong>列見出し</strong>があるか確認してください。
         確実に取り込みたい場合は「📥 標準テンプレート」をご利用ください。</p>`,
        [{ label: '閉じる', value: 'ok', cls: 'save-ok-btn' }]);
      return;
    }

    /* 既存データの扱いを確認 */
    const existing = assets.filter(a => !_zmiIsBlankAsset(a));
    let mode = existing.length ? null : 'replace';
    if (!mode) {
      mode = await _zmiModal('入力済みの財産があります',
        `<p class="zmi-p">現在 <strong>${existing.length}件</strong> の財産が入力されています。<br>
         読み込んだ <strong>${result.assets.length}件</strong> をどのように反映しますか？</p>`,
        [
          { label: 'キャンセル', value: null, cls: 'save-cancel-btn' },
          { label: '置き換える', value: 'replace', cls: 'save-ok-btn zmi-btn-danger' },
          { label: '後ろに追加', value: 'append', cls: 'save-ok-btn' },
        ]);
      if (!mode) { setStatus('取り込みをキャンセルしました'); return; }
    }
    assets = (mode === 'append') ? existing.concat(result.assets) : result.assets;
    renderAssetInputs();
    updatePreview();
    setStatus(`✅ ${result.assets.length}件を取り込みました（${file.name}）`, true);
    _zmiShowResult(result, mode, existing.length);
  }

  function _zmiShowResult(r, mode, existingCount) {
    const count = {};
    r.assets.forEach(a => { count[a.type] = (count[a.type] || 0) + 1; });
    const chips = ['bank', 'realestate', 'securities', 'car', 'other', 'debt']
      .filter(t => count[t]).map(t => `<span class="zmi-chip">${getAssetTypeName(t)} ${count[t]}件</span>`).join('');
    const list = (arr, max = 15) => {
      const items = arr.slice(0, max).map(s => `<li>${esc(s)}</li>`).join('');
      return `<ul class="zmi-list">${items}${arr.length > max ? `<li>…ほか${arr.length - max}件</li>` : ''}</ul>`;
    };
    let html = `<p class="zmi-p"><strong>${r.assets.length}件</strong> の財産を${mode === 'append' && existingCount ? '既存の財産の後ろに追加しました' : (existingCount ? '取り込み、入力済みの財産と置き換えました' : '取り込みました')}。</p>
                <div class="zmi-chips">${chips}</div>`;
    if (r.skippedSample) html += `<p class="zmi-p zmi-muted">※ テンプレートの記入例（備考に【記入例】がある行）${r.skippedSample}行は取り込んでいません。</p>`;
    if (r.deceasedMsg) html += `<div class="zmi-box"><div class="zmi-box-hd">👤 被相続人</div><p class="zmi-p" style="margin:0;">${esc(r.deceasedMsg)}</p></div>`;
    if (r.heirMsg) html += `<div class="zmi-box"><div class="zmi-box-hd">👥 相続人</div><p class="zmi-p" style="margin:0;">${esc(r.heirMsg)}</p></div>`;

    if (r.unmatched.length) {
      const noHeirs = !namedHeirs().length;
      const byName = {};
      r.unmatched.forEach(u => { (byName[u.name] = byName[u.name] || []).push(u.where); });
      html += `<div class="zmi-box zmi-warn"><div class="zmi-box-hd">⚠ 取得者が相続人の登録と一致しません</div>
        <p class="zmi-p">${noHeirs ? '相続人がまだ登録されていないため照合できませんでした。' : ''}取得者欄には名前をそのまま入れています。Step 05 の相続人欄の氏名と表記（スペース・旧字体など）を合わせてください。</p>
        ${list(Object.entries(byName).map(([n, w]) => `${n}（${w.join('、')}）`))}</div>`;
    }
    if (r.review.length) {
      html += `<div class="zmi-box"><div class="zmi-box-hd">🔍 念のためご確認ください</div>${list(r.review)}</div>`;
    }
    if (r.notes.length) {
      html += `<div class="zmi-box"><div class="zmi-box-hd">ℹ 協議書に反映されない備考など</div>
        <p class="zmi-p zmi-muted">この財産の種類には備考欄がないため、以下は取り込んでいません。必要に応じて手入力してください。</p>${list(r.notes)}</div>`;
    }
    _zmiModal('📊 財産目録の取り込み完了', html, [{ label: 'OK', value: 'ok', cls: 'save-ok-btn' }]);
  }


  /* ─── xlsxに「入力規則（プルダウン）」を後から埋め込む ─────────────
     SheetJS 無償版は入力規則を書き出せないため、生成したxlsx(zip)の
     シートXMLへ <dataValidations> を直接挿入する。失敗時は null を返す。 */
  function _zmiAddListValidation(wbArray, sheetIndex, sqref, items, opt = {}) {
    try {
      const CFB = (window.XLSX && window.XLSX.CFB) || (window._XLSXBase && window._XLSXBase.CFB);
      if (!CFB) return null;
      const zip = CFB.read(new Uint8Array(wbArray), { type: 'array' });
      const target = `xl/worksheets/sheet${sheetIndex}.xml`;
      let entry = CFB.find(zip, '/' + target);
      if (!entry) { const i = zip.FullPaths.findIndex(fp => fp.endsWith('/' + target)); if (i >= 0) entry = zip.FileIndex[i]; }
      if (!entry || !entry.content) return null;
      let xml = new TextDecoder('utf-8').decode(entry.content);
      const x = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const list = items.join(',');
      const dv = `<dataValidations count="1"><dataValidation type="list" allowBlank="1" showDropDown="0"`
        + ` showInputMessage="1" showErrorMessage="1" errorStyle="${opt.strict ? 'stop' : 'warning'}"`
        + ` promptTitle="${x(opt.promptTitle || '')}" prompt="${x(opt.prompt || '')}"`
        + ` errorTitle="${x(opt.errorTitle || '')}" error="${x(opt.error || '')}" sqref="${sqref}">`
        + `<formula1>${x('"' + list + '"')}</formula1></dataValidation></dataValidations>`;
      /* スキーマ上の順序：mergeCells・conditionalFormatting の後、hyperlinks・pageMargins などの前 */
      const before = ['<hyperlinks', '<printOptions', '<pageMargins', '<pageSetup', '<headerFooter', '<rowBreaks', '<colBreaks',
        '<customProperties', '<cellWatches', '<ignoredErrors', '<smartTags', '<drawing', '<legacyDrawing', '<picture', '<oleObjects',
        '<controls', '<webPublishItems', '<tableParts', '<extLst', '</worksheet>'];
      let pos = -1;
      for (const tag of before) { const i = xml.indexOf(tag); if (i >= 0 && (pos < 0 || i < pos)) pos = i; }
      if (pos < 0) return null;
      xml = xml.slice(0, pos) + dv + xml.slice(pos);
      entry.content = new TextEncoder().encode(xml);
      entry.size = entry.content.length;
      return CFB.write(zip, { fileType: 'zip', type: 'array' });
    } catch (e) {
      console.warn('入力規則の埋め込みに失敗しました（プルダウンなしで出力します）', e);
      return null;
    }
  }
  function _zmiDownloadBytes(bytes, filename, mime) {
    const blob = new Blob([bytes], { type: mime || 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    if (typeof saveAs === 'function') { saveAs(blob, filename); return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  const _ZMI_KIND_OPTIONS = ['預貯金', '不動産（土地）', '不動産（建物）', '不動産（区分建物）', '有価証券', '自動車', 'その他', '負債'];
  /* ═══ v149 分類別シートの標準テンプレート ══════════════════════════════
     被相続人／預貯金／不動産（土地・建物）／区分建物／有価証券／自動車／その他／負債／合算目録／記入方法
     ・各分類シートは「1行目：タイトル　2行目：説明　3行目：列見出し　4行目：記入のポイント　5行目〜：入力」
     ・合算目録は各シートを数式で集計（Excel 2010 以降・LibreOffice で動作）                              */
  const _TPL_DATA_ROW = 5;        // 入力開始行（1始まり）
  const _TPL_SCAN_TO  = 504;      // 合算目録の集計範囲（入力行の上限）

  const _tplCol = (spec, k) => spec.cols.findIndex(c => c.k === k);
  const _tplLetter = i => (window._XLSXBase || window.XLSX).utils.encode_col(i);

  /* ─── 取り込み：分類別シート1枚を解析 ─────────────────────────── */
  function _zmiTplSpecFor(sheetName, rows) {
    const nm = _zmiNorm(sheetName);
    const bySheet = _TPL_SPECS.find(s => _zmiNorm(s.sheet) === nm);
    const headerIdx = spec => rows.slice(0, 12).findIndex(r => {
      const cells = r.map(c => _zmiNorm(c));
      return spec.cols.filter(c => cells.includes(_zmiNorm(c.h))).length >= Math.min(4, spec.cols.length - 1);
    });
    if (bySheet) { const i = headerIdx(bySheet); if (i >= 0) return { spec: bySheet, headerRow: i }; }
    for (const s of _TPL_SPECS) { const i = headerIdx(s); if (i >= 0) return { spec: s, headerRow: i }; }
    return null;
  }
  function _zmiParseTplSheet(rows, sheetName, range, found, out) {
    const { spec, headerRow } = found;
    const hdr = rows[headerRow].map(c => _zmiNorm(c));
    const colOf = {};
    spec.cols.forEach(c => { const i = hdr.indexOf(_zmiNorm(c.h)); if (i >= 0) colOf[c.k] = i; });
    const hintRow = spec.cols.map(c => _zmiNorm(c.hint));
    let count = 0, prevSec = null;
    for (let i = headerRow + 1; i < rows.length; i++) {
      const cells = rows[i].map(c => _zmiTrim(c));
      if (!cells.some(Boolean)) continue;
      const get = k => colOf[k] != null ? (cells[colOf[k]] || '') : '';
      /* 記入のポイント行・記入例の行は飛ばす */
      if (spec.cols.every(c => !get(c.k) || _zmiNorm(get(c.k)) === hintRow[_tplCol(spec, c.k)])) continue;
      if (/【記入例】/.test(get('note'))) { out.skippedSample++; continue; }
      const rowNo = range.s.r + i + 1;
      const ctx = { where: `${sheetName} ${rowNo}行目`, unmatched: out.unmatched, notes: out.notes, review: out.review };

      let R = { heir: get('heir'), amount: get('amount'), _extras: [], _marks: [] };
      let t = { type: spec.type };
      if (spec.type === 'bank') {
        Object.assign(R, { inst: get('inst'), branch: get('branch'), acctType: get('acctType'), acctNo: get('acctNo') });
        if (!R.inst && !R.acctNo) continue;
      } else if (spec.type === 'realestate') {
        const kind = get('kind');
        const isBldg = /建物|家屋/.test(kind) || (!/土地/.test(kind) && !!(get('lotBldg') || get('bldgStr') || get('bldgArea')));
        t = { type: 'realestate', sub: isBldg ? 'building' : 'land' };
        Object.assign(R, isBldg
          ? { location: get('location'), lot: get('lotBldg'), category: [get('bldgType'), get('bldgStr')].filter(Boolean).join('／'), area: get('bldgArea'), share: get('share') }
          : { location: get('location'), lot: get('lotLand'), category: get('landCat'), area: get('landArea'), share: get('share') });
        if (!R.location && !R.lot) continue;
        if (!kind) ctx.review.push(`${ctx.where}：【種別】が空欄のため、入力内容から「${isBldg ? '建物' : '土地'}」と判定しました`);
      } else if (spec.type === 'securities') {
        const unit = get('unit');
        const qty = get('qty');
        Object.assign(R, { company: get('company'), branch: get('branch'), acctNo: get('acctNo'), issue: get('issue'), subkind: get('subkind'),
          qty: qty ? qty.replace(/,/g, '') + (unit || (/投資信託|ETF|REIT/.test(get('subkind')) ? '口' : /債/.test(get('subkind')) ? '円' : '株')) : '' });
        if (!R.company && !R.issue) continue;
      } else if (spec.type === 'car') {
        Object.assign(R, { carName: get('carName'), regNo: get('regNo'), carModel: get('carModel'), vin: get('vin') });
        if (!R.carName && !R.regNo && !R.vin) continue;
      } else if (spec.type === 'other') {
        Object.assign(R, { name: get('name'), detail: get('detail') });
        if (!R.name && !R.detail) continue;
      } else if (spec.type === 'debt') {
        Object.assign(R, { creditor: get('creditor'), debtType: get('debtType'), acctNo: get('acctNo'), note: get('note') });
        if (!R.creditor && !R.debtType) continue;
      }
      const built = _zmiBuildAsset(R, t, ctx);
      if (spec.type !== 'debt' && get('note')) ctx.notes.push(`${ctx.where}：${get('note')}`);

      /* 有価証券：同じ口座（証券会社・支店・口座番号・取得者が同じ）の続きの行は1つにまとめる */
      if (spec.type === 'securities') {
        const d = built.asset.details;
        const dep = _zmiParseAmount(get('deposit'));
        const key = [R.company, R.branch, R.acctNo].map(_zmiNorm).join('|') + '#' + built.heirKey;
        if (prevSec && prevSec.key === key && R.company) {
          const pd = prevSec.asset.details;
          if (pd.issues.length === 1 && pd.amount && !pd.issues[0].evalAmount) pd.issues[0].evalAmount = pd.amount;
          d.issues[0].evalAmount = d.amount;
          pd.issues.push(d.issues[0]);
          if (dep !== null && !pd.depositAmount) pd.depositAmount = _zmiFmtYen(dep);
          else if (dep !== null) ctx.review.push(`${ctx.where}：同じ口座の預り金が2行以上に入力されています。1行目の金額だけを取り込みました`);
          continue;
        }
        if (dep !== null) d.depositAmount = _zmiFmtYen(dep);
        prevSec = { key, asset: built.asset };
      }
      out.assets.push(built.asset);
      count++;
    }
    return count;
  }

  function downloadZaisanTemplateXlsm() {
    try {
      const bin = atob(_TPL_XLSM_B64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      _zmiDownloadBytes(bytes, _TPL_XLSM_NAME, 'application/vnd.ms-excel.sheet.macroEnabled.12');
      const st = document.getElementById('zmiStatus');
      if (st) {
        st.textContent = '標準テンプレート（.xlsm）をダウンロードしました。マクロ（一覧図の読み込み）が止められる場合は、OneDriveの外のフォルダ（例：C:\\相続テンプレート）に移し、Excelの「信頼できる場所」に登録してください（手順は操作マニュアル「📥 標準テンプレート（Excel）」）。';
        st.style.color = 'var(--text-muted)';
      }
    } catch (e) {
      console.error(e);
      alert('標準テンプレートのダウンロードに失敗しました。\n' + e.message);
    }
  }

  /* ─── テンプレート出力（.xlsx：v151 では画面から使わず、.xlsm の作り直し用に残す） ─── */
  function downloadZaisanTemplateXlsx() {
    if (typeof XLSX === 'undefined') { alert('XLSXライブラリが読み込まれていません。\nページを再読み込みしてお試しください。'); return; }
    const S = '【記入例】上書きしたらこの文字を消してください';
    const F = 'ＭＳ Ｐゴシック';
    const bd = { style: 'thin', color: { rgb: 'B7C3D6' } };
    const BOX = { top: bd, bottom: bd, left: bd, right: bd };
    const hdStyle = rgb => ({ font: { name: F, bold: true, color: { rgb: 'FFFFFF' }, sz: 10 }, fill: { patternType: 'solid', fgColor: { rgb } }, alignment: { horizontal: 'center', vertical: 'center', wrapText: true }, border: BOX });
    const ST = {
      title: { font: { name: F, bold: true, sz: 13, color: { rgb: '1D4680' } } },
      note:  { font: { name: F, sz: 9, color: { rgb: '555555' } }, alignment: { wrapText: true, vertical: 'top' } },
      hint:  { font: { name: F, sz: 8, color: { rgb: '666666' } }, fill: { patternType: 'solid', fgColor: { rgb: 'F4F6FA' } }, alignment: { wrapText: true, vertical: 'top' }, border: BOX },
      inp:   { font: { name: F, sz: 10 }, fill: { patternType: 'solid', fgColor: { rgb: 'FFFBEA' } }, border: BOX, alignment: { vertical: 'center' } },
      sample:{ font: { name: F, sz: 10, color: { rgb: '8A8A8A' }, italic: true }, border: BOX, alignment: { vertical: 'center' } },
    };
    const GRP_COLOR = { c: '1D4680', l: '1F5F99', b: '1A5C3A' };
    const wb = XLSX.utils.book_new();
    const validations = [];   // { sheetIndex, sqref, items, opt }
    const freezes = {};       // { sheetIndex: 固定する行数 }
    const sheetOrder = [];
    const addSheet = (ws, name) => { XLSX.utils.book_append_sheet(wb, ws, name); sheetOrder.push(name); return sheetOrder.length; };
    const setCell = (ws, r, c, v, s) => {
      const ref = XLSX.utils.encode_cell({ r, c });
      /* 空欄も書式（色・罫線）を付けるため空文字のセルにする（集計側は「1文字以上」で判定） */
      if (v === null || v === undefined || v === '') ws[ref] = { t: 's', v: '' };
      else if (typeof v === 'number') ws[ref] = { t: 'n', v };
      else ws[ref] = { t: 's', v: String(v) };
      if (s) ws[ref].s = JSON.parse(JSON.stringify(s));   // 書式オブジェクトはセルごとに複製（共有すると書式が混ざる）
      return ws[ref];
    };

    /* ── 1. 被相続人 ── */
    {
      const ws = {};
      setCell(ws, 0, 0, '被相続人の表示（遺産分割協議書に反映されます）', ST.title);
      setCell(ws, 1, 0, '【内容】の列に入力してください。空欄の項目は取り込みません。生年月日・死亡年月日は「昭和20年1月2日」のほか、Excelの日付（1945/1/2）でも入力できます（和暦に変換します）。', ST.note);
      ['【項目】', '【内容】', '【記入のポイント】'].forEach((h, c) => setCell(ws, 2, c, h, hdStyle('1D4680')));
      _DEC_FIELDS.forEach((f, i) => {
        setCell(ws, 3 + i, 0, f.label, { ...ST.inp, font: { name: F, bold: true, sz: 10 }, fill: { patternType: 'solid', fgColor: { rgb: 'E8EEF7' } } });
        setCell(ws, 3 + i, 1, '', ST.inp);
        setCell(ws, 3 + i, 2, f.hint, { font: { name: F, sz: 9, color: { rgb: '666666' } }, alignment: { wrapText: true } });
      });
      const r0 = 3 + _DEC_FIELDS.length + 1;
      setCell(ws, r0, 0, '数次相続の中間被相続人（該当する場合のみ。1行に1名）', ST.title);
      setCell(ws, r0 + 1, 0, '被相続人の死亡後、遺産分割前に亡くなった相続人がいる場合に入力します。入力があると、ツールの「数次相続」が有効になります。', ST.note);
      ['【No.】', ..._DEC_MID_COLS.map(c => c.label), '【備考】'].forEach((h, c) => setCell(ws, r0 + 2, c, h, hdStyle('1D4680')));
      ['1', '相続 二郎', '被相続人の長男', '名古屋市熱田区〇〇町二丁目2番2号', '名古屋市熱田区〇〇町一丁目1番地', '令和8年5月6日', S].forEach((v, c) => setCell(ws, r0 + 3, c, v, ST.sample));

      ws['!rows'] = []; ws['!rows'][1] = { hpt: 30 }; ws['!rows'][r0 + 1] = { hpt: 30 };

      ['1', '相続 太郎', '名古屋市熱田区〇〇町一丁目2番3号', S].forEach((v, i) => setCell(ws, 4, i, v, ST.sample));
      for (let r = 5; r < 5 + CAP; r++) cols.forEach((c, i) => setCell(ws, r, i, c.k === 'no' ? String(r - 4) : '', c.k === 'no' ? { ...ST.inp, alignment: { horizontal: 'center' } } : ST.inp));
      ws['!ref'] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: 4 + CAP, c: n - 1 } });
      ws['!cols'] = cols.map(c => ({ wch: c.w }));
      ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: n - 1 } }, { s: { r: 1, c: 0 }, e: { r: 1, c: n - 1 } }];
      ws['!rows'] = []; ws['!rows'][1] = { hpt: 44 }; ws['!rows'][3] = { hpt: 30 };
      freezes[addSheet(ws, '相続人')] = 4;

    /* ── 2. 分類別シート ── */
