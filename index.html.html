  /* ─── Asset grouping ─────────────────────────────────────────── */
  const CIRCLED = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];

  function buildGroupedAssets() {
    let lastHeir = '';
    const resolved = assets.map(asset => {
      const h = (asset.heirName||'').trim();
      if (h && asset.type !== 'debt') lastHeir = h;
      return { ...asset, resolvedHeir: h||lastHeir||'　　　　　　' };
    });
    const groups = [];
    const seen = new Map();
    resolved.forEach(asset => {
      // 共有財産・負債は常に単独の条文にする
      const isDebt = asset.type === 'debt';
      const key = isCoOwned(asset) ? `__coowned_${asset.id}` : isDebt ? `__debt_${asset.id}` : asset.resolvedHeir;
      if (!seen.has(key)) {
        const g = { heir: asset.resolvedHeir, items: [], coOwnedAsset: isCoOwned(asset) ? asset : null };
        seen.set(key, g);
        groups.push(g);
      }
      seen.get(key).items.push(asset);
      // 負債は lastHeir を更新しない（前の相続人の引継ぎをリセットしない）
    });
    return groups;
  }

  function buildArticleTitle(group, n) {
    const { heir, items: ga, coOwnedAsset } = group;
    const multi = ga.length > 1;

    if (coOwnedAsset) {
      const asset = coOwnedAsset;
      const typeName = getAssetTypeName(asset.type);
      const allParties = [
        { name: (asset.heirName||'').trim()||'　　　　　　', num: asset.heirNum, den: asset.heirDen },
        ...(asset.coOwners||[]).filter(co => (co.name||'').trim()).map(co => ({ name: co.name.trim(), num: co.num, den: co.den }))
      ];
      const err = validateShares(asset);
      const hasRatios = allParties.every(p => (p.num||'').trim() && (p.den||'').trim());
      // 均等チェックまたは全員の割合が等しい場合 → 均等表記
      const isEqual = asset.equalShare || isEqualRatio(asset);
      if (isEqual) {
        const nameList = allParties.map((p, i) => i === 0 ? `相続人 ${p.name}` : p.name).join(' 、');
        return `第${n}条　以下の${typeName}については、${nameList}が 均等の割合でそれぞれ取得する。`;
      }
      if (hasRatios && !err) {
        const parts = allParties.map(p => `相続人 ${p.name} が ${(p.den||'').trim()}分の${(p.num||'').trim()}`);
        return `第${n}条　以下の${typeName}は、${parts.join('、')}の割合でそれぞれ取得する。`;
      }
      // 割合未入力または不正の場合のフォールバック
      const parts = allParties.map(p => `相続人 ${p.name}`);
      const verb = multi ? '各財産を取得する' : `${typeName}を取得する`;
      return `第${n}条　${parts.join(' 及び ')} は、次の${verb}。`;
    } else if (ga[0] && ga[0].type === 'debt') {
      const asset      = ga[0];
      const creditor   = (asset.details && asset.details.creditor || '').trim() || '債権者';
      const decName    = (document.getElementById('deceasedName')?.value || '').trim() || '被相続人';
      const primary    = (asset.heirName || heir || '').trim() || '（相続人未入力）';
      const coHeirs    = (asset.details.debtCoHeirs || []).map(c => (c.name||'').trim()).filter(Boolean);
      const allHeirs   = [primary, ...coHeirs];
      const heirStr    = allHeirs.length === 1
        ? `相続人 ${allHeirs[0]} が全て承継する`
        : allHeirs.map(h => `相続人 ${h}`).join(' 及び ') + ' が連帯して承継する';
      return `第${n}条　被相続人 ${decName} の ${creditor} に対する次の債務は、${heirStr}。`;
    } else {
      if (multi) {
        return `第${n}条　相続人 ${heir} は、次の各財産を取得する。`;
      } else {
        return `第${n}条　相続人 ${heir} は、次の${getAssetTypeName(ga[0].type)}を取得する。`;
      }
    }
  }

  // 共有割合の本文センテンスを生成（割合が全員分入力済みかつ合計1の場合のみ）
  function coOwnedShareSentence(asset) {
    if (!isCoOwned(asset)) return null;
    const allParties = [
      { name: (asset.heirName||'').trim()||'　　　　　　', num: asset.heirNum, den: asset.heirDen },
      ...(asset.coOwners||[]).filter(co => (co.name||'').trim()).map(co => ({ name: co.name.trim(), num: co.num, den: co.den }))
    ];
    const err = validateShares(asset);
    const hasRatios = allParties.every(p => (p.num||'').trim() && (p.den||'').trim());
    if (!hasRatios) return null;
    if (err) return null;
    const parts = allParties.map((p, i) => {
      const frac = `${(p.den||'').trim()}分の${(p.num||'').trim()}`;
      return i === 0 ? `相続人 ${p.name} が ${frac}` : `${p.name} が ${frac}`;
    });
    return parts.join('、') + 'の割合で、それぞれ取得する。';
  }

          const lblPart = noLbl ? '' : ((fl.label||'').trim()||'　　') + '　';

        });
      } else {
        lines.push('　建物の名称　' + ((asset.details.main_name||'').trim()||'　　　　　'));
      }
      lines.push('');
      lines.push('専有部分の建物の表示');
      lines.push('　家 屋 番 号　' + ((asset.details.unit_lotNumber||'').trim()||'　　　　　'));
      lines.push('　建物の名称　' + ((asset.details.unit_name||'').trim()||'　　　　　'));
      lines.push('　種　　　類　' + ((asset.details.unit_type||'').trim()||'　　　　　'));
      lines.push('　構　　　造　' + ((asset.details.unit_structure||'').trim()||'　　　　　'));

      const uShare = (asset.details.unit_share||'').trim();

          lines.push('　敷地権の割合　' + ((sr.ratio||'').trim()||'　　　　　'));
        });
      }

    return lines;

  function getAssetBodyLines(asset) {
    if (asset.type === 'bank') {
      _initBankAccounts(asset);

      const _wBankAmtSuffix = (() => {
        if (!asset.details.showAmountInDoc || !(asset.details.amount||'').trim()) return '';

        const n = parseInt(raw, 10);
        return `　　金${isNaN(n) ? raw : n.toLocaleString('ja-JP')}円`;
      })();
      const lines = asset.details.accounts.map((acct, i) =>
        (multi ? `（${i+1}）　` : '') + buildBankTextFromAcct(acct) + _wBankAmtSuffix
      );

        lines.push('※　端数が生じた場合は ' + asset.details.fractionHeir + ' が取得する。');

    } else if (asset.type === 'car') {
      _initCars(asset);

      asset.details.cars.forEach((car, idx) => {

        lines.push(`車名：${car.carName||'　　　'}`);
        lines.push(`型式：${car.carModel||'　　　'}`);
        lines.push(`登録番号：${car.regNo||'　　　'}`);
        lines.push(`車台番号：${car.vin||'　　　'}`);
      });
      return lines;

      _initOtherItems(asset);

      const lines = [];
      asset.details.otherItems.forEach((item, idx) => {
        const title = (item.otherTitle||'').trim() || '（財産の種類・名称）';

        lines.push((multi ? `（${idx+1}）　` : '') + title);

      });

        lines.push(`残　　　高　金　${balance}${balanceUnit}${baseDateDisp}`);
      }
      if (contractNo) lines.push(`契 約 番 号　${contractNo}`);
      if (note) note.split('\n').forEach(l => lines.push(l));
      return lines;
    } else if (asset.type === 'realestate') {
      return getRealestateBodyLines(asset);
    } else {
      const compName  = (asset.details.companyName||'').trim();
      const branch    = (asset.details.branchName||'').trim();
      const acctNo    = (asset.details.accountNumber||'').trim();
      const issues    = asset.details.issues || [];
      const deposit   = (asset.details.depositAmount||'').trim();

      const multiIssueW = issues.length > 1;
      issues.forEach((issue, i) => {
        const name   = (issue.name||'').trim() || '（銘柄名）';
        const type   = issue.type || '普通株式';
        const amount = (issue.amount||'').trim() || '　　　';
        const unit   = issue.unit || '株';
        const numPfx = multiIssueW ? `（${i+1}）　` : '';
        lines.push(`　${numPfx}${name}　${type}　${amount}${unit}`);
      });
      if (deposit) lines.push(`　預り金　金　${deposit}円`);
      return lines;
    }
  }

      if (heirList && heirList.parentNode) {

  // 和暦変換
  function toJapaneseEra(y, m, d) {
    let era, year;
    const isAfter = (ty, tm, td) => y > ty || (y === ty && (m > tm || (m === tm && d >= td)));
    if (isAfter(2019, 5, 1))  { era = '令和'; year = y - 2018; }
    else if (isAfter(1989, 1, 8))  { era = '平成'; year = y - 1988; }
    else if (isAfter(1926, 12, 25)){ era = '昭和'; year = y - 1925; }
    else if (isAfter(1912, 7, 30)) { era = '大正'; year = y - 1911; }
    else                           { era = '明治'; year = y - 1867; }
    return `${era}${year}年${m}月${d}日`;
  }

  function cellToDateStr(cell) {
    if (!cell) return null;
    const v = cell.v;
    if (v === undefined || v === null || v === '') return null;
    if (typeof v === 'number' && cell.t === 'n') {
      try {
        const info = XLSX.SSF.parse_date_code(v);
        return toJapaneseEra(info.y, info.m, info.d);
      } catch(e) { return null; }
    }
    if (typeof v === 'string') return v.trim() || null;
    if (v instanceof Date) return toJapaneseEra(v.getFullYear(), v.getMonth()+1, v.getDate());
    return String(v).trim() || null;
  }

  // シートから被相続人情報を解析
  function parseInheritanceSheet(ws) {
    if (!ws['!ref']) return null;
    const range = XLSX.utils.decode_range(ws['!ref']);
    const getCell = (r, c) => ws[XLSX.utils.encode_cell({r, c})] || null;
    const getStr  = (r, c) => { const cl = getCell(r,c); return cl ? String(cl.v||'').trim() : ''; };

    const result = {};
    let hiredRow = -1; // （被相続人）ラベル行

    // 構造マーカー探索
    for (let r = range.s.r; r <= range.e.r; r++)
      for (let c = range.s.c; c <= range.e.c; c++)
        if (getStr(r,c) === '（被相続人）') hiredRow = r;

    for (let r = range.s.r; r <= range.e.r; r++) {
      for (let c = range.s.c; c <= range.e.c; c++) {
        const s = getStr(r, c);

        // ① 氏名：「被相続人」ラベルと同じ行の隣セル
        if (s === '被相続人' && !result.name) {
          for (let cc = c+1; cc <= range.e.c; cc++) {
            const v = getStr(r, cc);
            if (v && v !== '法定相続情報' && !v.includes('法定相続')) {
              result.name = v.replace(/　/g, ' ').replace(/\s+/g, ' ').trim();
              break;
            }
          }
        }

        // ② 最後の住所：ラベルの下1〜3行（同列）を結合
        if (s.startsWith('最後の住所') && !result.address) {
          let addr = '';
          // v152：結合セルで空いた行があっても読めるよう、下8行まで空行を飛ばして探す
          for (let rr = r+1; rr <= Math.min(r+8, range.e.r); rr++) {
            const v = getStr(rr, c);
            if (!v) continue;
            if (/^(最後の|出生|死亡|（)/.test(v)) break;
            addr += v.replace(/^[　\s]+/, ''); // 先頭の全角スペース除去
          }
          result.address = addr.trim() || null;
        }

        // ③ 最後の本籍：ラベルの次行（同列）
        if (s.startsWith('最後の本籍') && !result.honseki) {
          // v152：結合セルで空いた行は飛ばし、次に文字がある行（最大3行下）を本籍とする
          for (let rr = r+1; rr <= Math.min(r+3, range.e.r); rr++) {
            const v = getStr(rr, c);
            if (!v) continue;
            if (!/^(最後の|出生|死亡|（)/.test(v)) result.honseki = v.trim();
            break;
          }
        }

        // ⑤ 死亡（被相続人行より前のみ）：同行の隣セルから値を取得 & 位置を記録
        if (s.startsWith('死亡') && !result.dod && (hiredRow < 0 || r < hiredRow)) {
          for (let cc = c+1; cc <= range.e.c; cc++) {
            const d = cellToDateStr(getCell(r, cc));
            if (d) { result.dod = d; result._dodRow = r; result._dodCol = c; break; }
          }
        }
      }
    }

    // ④ 生年月日：死亡ラベルと同じ列を上に遡り、直近の「出生」行から取得
    if (result._dodRow !== undefined) {
      const dodRow = result._dodRow, dodCol = result._dodCol;
      for (let r = dodRow - 1; r >= range.s.r; r--) {
        const s = getStr(r, dodCol);
        if (!s) continue;          // 空行はスキップ
        if (s.startsWith('出生')) {
          for (let cc = dodCol+1; cc <= range.e.c; cc++) {
            const d = cellToDateStr(getCell(r, cc));
            if (d) { result.dob = d; break; }
          }
        }
        break; // 出生でも空でもない何かに当たったら終了
      }
      delete result._dodRow; delete result._dodCol;
    }

    return (result.name) ? result : null;
  }

  function parseHeirsFromSheet(ws) {
    if (!ws['!ref']) return [];
    const range = XLSX.utils.decode_range(ws['!ref']);
    const getStr = (r, c) => {
      const cl = ws[XLSX.utils.encode_cell({r, c})];
      return cl ? String(cl.v || '').trim() : '';
    };
    const getStrCell = (r, c) => ws[XLSX.utils.encode_cell({r, c})] || null;
    const foundHeirs = [];
    const ZOKUGARA_RE = /^（[\s　]*(長男|二男|三男|長女|二女|三女|長子|次男|次女|四男|四女|五男|五女|妻|夫|配偶者|父|母|兄|姉|弟|妹|甥|姪|孫|曾孫|養子|子)[^（）]*）$/;
    const SKIP_RE = /被相続人|申出人/;
    for (let r = range.s.r; r <= range.e.r; r++) {
      for (let c = range.s.c; c <= range.e.c; c++) {
        const s = getStr(r, c);
        if (!ZOKUGARA_RE.test(s) || SKIP_RE.test(s)) continue;
        let address = '';
        for (let rr = r - 1; rr >= Math.max(r - 10, range.s.r); rr--) {   // v152：6行→10行（結合セルで空いた行を考慮）
          const v = getStr(rr, c);
          if (!v) continue;
          if (ZOKUGARA_RE.test(v) || v.startsWith('（被相続人')) break;
          if (v.startsWith('住所')) {
            for (let vc = c + 1; vc <= Math.min(c + 4, range.e.c); vc++) {
              const av = getStr(rr, vc);
              if (!av) continue;
              let addrFull = av;
              // v152：住所の2段目は、結合セルで空いた行を飛ばして直下の文字を探す（最大2行下）
              let nextCell = null;
              for (let nr2 = rr + 1; nr2 <= Math.min(rr + 2, range.e.r); nr2++) {
                const cc2 = getStrCell(nr2, vc);
                if (cc2 && String(cc2.v || '').trim()) { nextCell = cc2; break; }
                if (getStr(nr2, c)) break;   // 見出し列に文字がある行（出生など）に来たら終わり
              }
              if (nextCell && nextCell.t === 's') {
                const nextV = String(nextCell.v || '').trim();
                if (nextV && !nextV.startsWith('出生') && !nextV.startsWith('住所') &&
                    !nextV.startsWith('（') && !nextV.startsWith('被') && !nextV.includes('余白')) {
                  addrFull += nextV.replace(/^[\s　]+/, '');
                }
              }
              address = addrFull.trim();
              break;
            }
            break;
          }
        }
        // 続柄の直下（最大3行）から氏名を取得
        let labelName = '';
        for (let nr = r + 1; nr <= Math.min(r + 4, range.e.r); nr++) {   // v152：3行→4行
          const nc = getStrCell(nr, c);
          if (!nc || nc.t !== 's') continue;
          const nv = String(nc.v || '').trim();
          if (!nv) continue;
          if (nv.startsWith('出生') || nv.startsWith('死亡') || nv.startsWith('住所') ||
              ZOKUGARA_RE.test(nv) || nv.startsWith('（被相続人') || nv.includes('余白')) break;
          labelName = nv;
          break;
        }
        // v153：同居の相続人（同じ住所）も残すため、重複判定は「続柄＋氏名＋住所」で行う
        const key = s + '|' + labelName + '|' + address;
        if (address && !foundHeirs.some(h => h._key === key)) {
          foundHeirs.push({ name: '', address, labelName, zokugara: s, _key: key });
        }
      }
    }
    return foundHeirs;
  }

  async function handleExcelUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    event.target.value = '';

    const statusEl = document.getElementById('excelStatus');
    const setStatus = (msg, ok) => {
      if (!statusEl) return;
      statusEl.textContent = msg;
      statusEl.style.color = ok === true ? 'var(--green)' : ok === false ? 'var(--red)' : 'var(--text-muted)';
    };
    setStatus('読込中…');

    try {
      if (typeof XLSX === 'undefined') { setStatus('⚠ ライブラリ読込中です。少し待ってから再度お試しください。', false); return; }
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array' });

      let parsed = null;
      const dataSheets = [];
      for (const name of wb.SheetNames) {
        const ws = wb.Sheets[name];
        const p = parseInheritanceSheet(ws);
        if (p) {
          if (!parsed) parsed = p;
          dataSheets.push(ws);
        }
      }

      if (!parsed) { setStatus('⚠ 情報を読み取れませんでした。手動で入力してください。', false); return; }

      let filled = 0;
      const fill = (id, val) => { if (val) { const el = document.getElementById(id); if(el){ el.value = val; filled++; } } };
      fill('deceasedName',    parsed.name);
      fill('deceasedAddress', parsed.address);
      fill('deceasedHonseki', parsed.honseki);
      fill('deceasedDob',     parsed.dob);
      fill('deceasedDod',     parsed.dod);
      const allHeirs = [];
      for (const ws of dataSheets) {
        for (const h of parseHeirsFromSheet(ws)) {
          // v153：複数シートに同じ一覧図がある場合の重複だけを除く（同じ住所の別人は残す）
          if (!allHeirs.some(eh => eh._key === h._key)) allHeirs.push(h);
        }
      }
      if (allHeirs.length > 0) {
        const heirOrder = z => {
          if (!z) return 99;
          if (/配偶者|妻|夫/.test(z))                                           return 0;
          if (/長男|次男|二男|三男|四男|五男|長女|次女|二女|三女|四女|五女|長子|養子/.test(z)) return 1;
          if (/孫/.test(z))                                                      return 2;
          if (/曾孫/.test(z))                                                    return 3;
          if (/父|母/.test(z))                                                   return 4;
          if (/兄|姉|弟|妹/.test(z))                                            return 5;
          if (/甥|姪/.test(z))                                                   return 6;
          return 7;
        };
        allHeirs.sort((a, b) => heirOrder(a.zokugara) - heirOrder(b.zokugara));
        heirs = allHeirs.map(h => ({ name: h.labelName || h.name || '', address: h.address, labelName: h.labelName || '' }));
        renderHeirInputs();
        renderAssetInputs();      // 財産欄の相続人選択を更新
        renderUnknownHeirInput(); // 未記載遺産条項の相続人選択を更新
        if (document.getElementById('includeAncestoral')?.checked) renderAncestoralHeirInput(); // 祭祀承継者選択を更新
        filled += allHeirs.length;
      }
      updatePreview();
      setStatus('✓ ' + filled + '項目を自動入力しました（内容を確認してください）', true);
    } catch(e) {
      setStatus('エラー: ' + e.message, false);
    }
  }

  /* ─── Word (.docx) 出力 ──────────────────────────────────────── */
  function downloadHeirWord(i) {
    const heir = heirs[i];
    if (!heir) return;
    const label = (heir.labelName||heir.name||'').trim() || `相続人${i+1}`;
    generateWord([heir], `遺産分割協議証明書_${label}`);
  }

  // ── 表紙ボーダーSVG文字列生成（HTML表示・Word出力共用）──────────
  function _buildCoverBordSvgStr() {
    const _bc = '#7a5c28';
    const _mkVineH = (x0, x1, yc, flip) => {
      const n = Math.max(1, Math.round((x1 - x0) / 10));
      const u = (x1 - x0) / n;
      const amp = 2.8, rf = flip ? -1 : 1;
      let d = `M${x0.toFixed(1)},${yc}`;
      const o = [];
      for (let i = 0; i < n; i++) {
        const x = x0 + i * u, xe = x + u, xm = x + u / 2;
        const dir = rf * ((i % 2 === 0) ? -1 : 1);
        const yp = yc + dir * amp;
        d += ` C${(x+u*.28).toFixed(1)},${(yc+dir*amp*1.4).toFixed(1)} ${(xe-u*.28).toFixed(1)},${(yc+dir*amp*1.4).toFixed(1)} ${xe.toFixed(1)},${yc}`;
        const lh=2.3, lw=1.2;
        o.push(`<path d="M${xm},${(yp-dir*lh).toFixed(1)} C${(xm+lw).toFixed(1)},${(yp-dir*lh*.3).toFixed(1)} ${(xm+lw).toFixed(1)},${(yp+dir*lh*.3).toFixed(1)} ${xm},${(yp+dir*lh).toFixed(1)} C${(xm-lw).toFixed(1)},${(yp+dir*lh*.3).toFixed(1)} ${(xm-lw).toFixed(1)},${(yp-dir*lh*.3).toFixed(1)} ${xm},${(yp-dir*lh).toFixed(1)} Z" fill="${_bc}"/>`);
        const tx = x, ty = yc, td = -dir, cr = 2.0;
        o.push(`<path d="M${tx},${ty} C${(tx-cr*.8).toFixed(1)},${(ty+td*cr).toFixed(1)} ${(tx-cr*.8).toFixed(1)},${(ty+td*cr*2.1).toFixed(1)} ${(tx+cr*.35).toFixed(1)},${(ty+td*cr*1.9).toFixed(1)} C${(tx+cr*.9).toFixed(1)},${(ty+td*cr*1.7).toFixed(1)} ${(tx+cr*.7).toFixed(1)},${(ty+td*cr*.7).toFixed(1)} ${tx},${ty}" fill="none" stroke="${_bc}" stroke-width="0.52"/>`);
      }
      return `<path d="${d}" fill="none" stroke="${_bc}" stroke-width="0.82"/>` + o.join('');
    };
    const _mkVineV = (y0, y1, xc, flip) => {
      const n = Math.max(1, Math.round((y1 - y0) / 10));
      const u = (y1 - y0) / n;
      const amp = 2.8, rf = flip ? -1 : 1;
      let d = `M${xc},${y0.toFixed(1)}`;
      const o = [];
      for (let i = 0; i < n; i++) {
        const y = y0 + i * u, ye = y + u, ym = y + u / 2;
        const dir = rf * ((i % 2 === 0) ? -1 : 1);
        const xp = xc + dir * amp;
        d += ` C${(xc+dir*amp*1.4).toFixed(1)},${(y+u*.28).toFixed(1)} ${(xc+dir*amp*1.4).toFixed(1)},${(ye-u*.28).toFixed(1)} ${xc},${ye.toFixed(1)}`;
        const lh=2.3, lw=1.2;
        o.push(`<path d="M${(xp-dir*lh).toFixed(1)},${ym} C${(xp-dir*lh*.3).toFixed(1)},${(ym+lw).toFixed(1)} ${(xp+dir*lh*.3).toFixed(1)},${(ym+lw).toFixed(1)} ${(xp+dir*lh).toFixed(1)},${ym} C${(xp+dir*lh*.3).toFixed(1)},${(ym-lw).toFixed(1)} ${(xp-dir*lh*.3).toFixed(1)},${(ym-lw).toFixed(1)} ${(xp-dir*lh).toFixed(1)},${ym} Z" fill="${_bc}"/>`);
        const tx = xc, ty = y, td = -dir, cr = 2.0;
        o.push(`<path d="M${tx},${ty} C${(tx+td*cr).toFixed(1)},${(ty-cr*.8).toFixed(1)} ${(tx+td*cr*2.1).toFixed(1)},${(ty-cr*.8).toFixed(1)} ${(tx+td*cr*1.9).toFixed(1)},${(ty+cr*.35).toFixed(1)} C${(tx+td*cr*1.7).toFixed(1)},${(ty+cr*.9).toFixed(1)} ${(tx+td*cr*.7).toFixed(1)},${(ty+td*cr*.7).toFixed(1)} ${tx},${ty}" fill="none" stroke="${_bc}" stroke-width="0.52"/>`);
      }
      return `<path d="${d}" fill="none" stroke="${_bc}" stroke-width="0.82"/>` + o.join('');
    };
    const _mkFlower = (cx, cy) => {
      let ps = '';
      for (let a = 0; a < 5; a++) {
        const ang = (a * 72 - 90) * Math.PI / 180;
        const pr = 3.8, cr2 = 5.2;
        const px = +(cx + pr * Math.cos(ang)).toFixed(1), py = +(cy + pr * Math.sin(ang)).toFixed(1);
        const c1x = +(cx + cr2 * Math.cos(ang - .45)).toFixed(1), c1y = +(cy + cr2 * Math.sin(ang - .45)).toFixed(1);
        const c2x = +(cx + cr2 * Math.cos(ang + .45)).toFixed(1), c2y = +(cy + cr2 * Math.sin(ang + .45)).toFixed(1);
        ps += `<path d="M${cx},${cy} C${c1x},${c1y} ${px},${py} ${px},${py} C${px},${py} ${c2x},${c2y} ${cx},${cy} Z" fill="${_bc}"/>`;
      }
      return ps + `<circle cx="${cx}" cy="${cy}" r="1.8" fill="white"/><circle cx="${cx}" cy="${cy}" r="0.8" fill="${_bc}"/>`;
    };
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297">`
      + `<rect x="8" y="8" width="194" height="281" fill="none" stroke="${_bc}" stroke-width="1.2"/>`
      + `<rect x="22" y="22" width="166" height="253" fill="none" stroke="${_bc}" stroke-width="0.5"/>`
      + _mkVineH(22, 188, 15, false)
      + _mkVineH(22, 188, 282, true)
      + _mkVineV(22, 275, 15, false)
      + _mkVineV(22, 275, 195, true)
      + _mkFlower(15, 15) + _mkFlower(195, 15)
      + _mkFlower(15, 282) + _mkFlower(195, 282)
      + `</svg>`;
  }

  // ── SVG文字列 → PNG base64 変換（canvas利用）────────────────────
  function _svgToPngBase64(svgStr, w, h) {
    return new Promise((resolve, reject) => {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        const img = new Image();
        img.onload = () => {
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/png').split(',')[1]);
        };
        img.onerror = reject;
        img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgStr);
      } catch(e) { reject(e); }
    });
  }

  /* ─── 印刷前処理：署名セクションが途中で割れる場合に改ページ挿入 ─── */
  function printDoc() {
    const sigSection = document.querySelector('.doc-sig-section');
    if (sigSection) {
      // リセット
      sigSection.style.breakBefore = '';
      sigSection.style.pageBreakBefore = '';

      // プレビューエリアを基準にしたオフセットを取得
      const previewArea = document.getElementById('preview-area');
      if (previewArea) {
        // A4印刷レイアウトでの1ページ高さ（297mm - 上下余白42mm = 255mm）
        // スクリーン上の近似値として計算（96dpi基準）
        const mmToPx = 96 / 25.4;
        const pageHeightPx = 255 * mmToPx; // 約963px（印刷可能領域）

        const previewTop = previewArea.getBoundingClientRect().top + window.scrollY;
        const sigTop     = sigSection.getBoundingClientRect().top  + window.scrollY;
        const sigBottom  = sigSection.getBoundingClientRect().bottom + window.scrollY;
        const sigRelTop  = sigTop - previewTop;
        const sigRelBot  = sigBottom - previewTop;

        // 署名セクションの先頭ページ番号と末尾ページ番号
        const startPage = Math.floor(sigRelTop  / pageHeightPx);
        const endPage   = Math.floor(sigRelBot  / pageHeightPx);

        if (startPage !== endPage) {
          // ページをまたぐ → 署名セクション前に強制改ページ
          sigSection.style.breakBefore     = 'page';
          sigSection.style.pageBreakBefore = 'always';
        }

        // 個々の相続人が割れる場合もチェック（さらに確実に）
        const heirs = sigSection.querySelectorAll('.doc-heir');
        heirs.forEach(heir => {
          const ht = heir.getBoundingClientRect().top    + window.scrollY - previewTop;
          const hb = heir.getBoundingClientRect().bottom + window.scrollY - previewTop;
          if (Math.floor(ht / pageHeightPx) !== Math.floor(hb / pageHeightPx)) {
            sigSection.style.breakBefore     = 'page';
            sigSection.style.pageBreakBefore = 'always';
          }
        });
      }
    }
    window.print();
    // 印刷後リセット
    setTimeout(() => {
      if (sigSection) {
        sigSection.style.breakBefore     = '';
        sigSection.style.pageBreakBefore = '';
      }
    }, 2000);
  }

  async function generateWord(heirSubset, filenameOverride) {
    if (typeof docx === 'undefined') { alert('docxライブラリの読み込みが完了していません。しばらくお待ちください。'); return; }
    const { Document, Packer, Paragraph, TextRun, AlignmentType, ImageRun,
            HorizontalPositionRelativeFrom, VerticalPositionRelativeFrom, TextWrappingType,
            Table, TableRow, TableCell, WidthType } = docx;
    const docType = document.querySelector('input[name="docType"]:checked').value;
    const isShomei = docType === '協議証明書';
    const titleText = isShomei ? '遺産分割協議証明書' : '遺産分割協議書';
    const val = (id) => document.getElementById(id).value;

    const makeKV = (key, value) => new Paragraph({
      children: [
        new TextRun({ text: key + '：　', font: 'ＭＳ 明朝' }),
        new TextRun({ text: value||'　　　　　　', font: 'ＭＳ 明朝' }),
      ]
    });

    const hasCover = document.getElementById('includeCover')?.checked;
    const coverName = (val('deceasedName')||'').trim() || '　　　　　　';
    const children = [];
    if (hasCover) {
      // 蔓草ボーダーSVGをPNGに変換してWordに埋め込む
      let coverBorderImageRun = null;
      try {
        const svgStr = _buildCoverBordSvgStr();
        const pngB64 = await _svgToPngBase64(svgStr, 794, 1123);
        const binStr = atob(pngB64);
        const bytes = new Uint8Array(binStr.length);
        for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
        if (ImageRun && HorizontalPositionRelativeFrom && VerticalPositionRelativeFrom && TextWrappingType) {
          coverBorderImageRun = new ImageRun({
            data: bytes,
            transformation: { width: 794, height: 1123 },
            floating: {
              horizontalPosition: { relative: HorizontalPositionRelativeFrom.PAGE, offset: 0 },
              verticalPosition:   { relative: VerticalPositionRelativeFrom.PAGE,   offset: 0 },
              allowOverlap: true,
              behindDocument: true,
              wrap: { type: TextWrappingType.NONE },
            },
          });
        }
      } catch(e) { console.warn('表紙画像の生成に失敗しました:', e); }

      : (wIdNames.length > 0

          payees.forEach((p, pi) => {

        } else if (method === '均等割') {
          if (recipients.length <= 1) {
            const rName = recipients[0] ? (recipients[0].name||'').trim() : '　　　　　　';
            articleText = `第${n}条　${intro}相続人 ${rName} に対して、均等に割った額の金銭を支払うものとする。`;

    children.push(new Paragraph({ children: [new TextRun({ text: isShomei ? '以上のとおり、被相続人の遺産分割協議が成立したことに相違ないことを証明するため、本書を作成し署名捺印します。' : '以上のとおり、相続人全員による遺産分割協議が成立したので、本書を作成し各自署名捺印する。', font: 'ＭＳ 明朝' })], spacing: { after: 300 } }));
    children.push(new Paragraph({ children: [new TextRun({ text: val('agreementDate')||'令和　　年　　月　　日', font: 'ＭＳ 明朝' })], spacing: { after: 500 } }));

    (heirSubset || heirs).forEach(heir => {
      const wLabel = (heir.labelName||heir.name||'').trim() || '（氏名未入力）';
      const wHeirBlockLabel = (heir.sigLabelOverride||'').trim() || `相続人　${wLabel}`;

      // 【ラベル】
      children.push(new Paragraph({
        children: [new TextRun({ text: '【' + wHeirBlockLabel + '】', font: 'ＭＳ 明朝' })],
        spacing: { before: 480, after: 80 }
      }));

      // 署名欄：住所（段落）+ 3列テーブルで「氏名」左 | 「-----/実印」中央 | 「-----/捨印」右
      const _nb = { style: 'none', size: 0, color: 'FFFFFF' };
      const _allNb = (b) => ({ top: b, bottom: b, left: b, right: b });

      // 住所は通常段落
      children.push(new Paragraph({
        children: [new TextRun({ text: '住　所　' + (heir.address||''), font: 'ＭＳ 明朝' })],
        spacing: { after: 160 },
      }));

      try {
        if (!Table || !TableRow || !TableCell || !WidthType) throw new Error('Table API unavailable');

        children.push(new Table({
          width: { size: 8500, type: WidthType.DXA },
          borders: {
            top: _nb, bottom: _nb, left: _nb, right: _nb,
            insideH: _nb, insideV: _nb,
          },
          rows: [
            // 氏名（左） | -----/実印（中央） | -----/捨印（右端）
            new TableRow({
              children: [
                // 氏名
                new TableCell({
                  width: { size: 2500, type: WidthType.DXA },
                  borders: _allNb(_nb),
                  children: [new Paragraph({
                    children: [new TextRun({ text: '氏　名', font: 'ＭＳ 明朝' })],
                    spacing: { after: 0 },
                  })],
                }),
                // 実印：空行 + 破線 + ラベル
                new TableCell({
                  width: { size: 3000, type: WidthType.DXA },
                  borders: _allNb(_nb),
                  children: [
                    new Paragraph({ children: [], spacing: { after: 0 } }),
                    new Paragraph({
                      children: [new TextRun({ text: '-----', font: 'ＭＳ 明朝', color: 'AAAAAA' })],
                      alignment: AlignmentType.CENTER,
                      spacing: { after: 40 },
                    }),
                    new Paragraph({
                      children: [new TextRun({ text: '実印', font: 'ＭＳ 明朝', size: 14 })],
                      alignment: AlignmentType.CENTER,
                      spacing: { before: 0, after: 0 },
                    }),
                  ],
                }),
                // 捨印：空行 + 破線 + ラベル
                new TableCell({
                  width: { size: 3000, type: WidthType.DXA },
                  borders: _allNb(_nb),
                  children: [
                    new Paragraph({ children: [], spacing: { after: 0 } }),
                    new Paragraph({
                      children: [new TextRun({ text: '-----', font: 'ＭＳ 明朝', color: 'AAAAAA' })],
                      alignment: AlignmentType.CENTER,
                      spacing: { after: 40 },
                    }),
                    new Paragraph({
                      children: [new TextRun({ text: '捨印', font: 'ＭＳ 明朝', size: 14 })],
                      alignment: AlignmentType.CENTER,
                      spacing: { before: 0, after: 0 },
                    }),
                  ],
                }),
              ],
            }),
          ],
        }));
      } catch(tableErr) {
        // テーブル生成失敗時のテキストフォールバック
        console.warn('署名テーブル生成失敗、テキスト形式で出力:', tableErr);
        children.push(new Paragraph({
          children: [new TextRun({ text: '氏　名　　　　　　　　　-----　　実印　　　　-----　　捨印', font: 'ＭＳ 明朝' })],
        }));
      }

      children.push(new Paragraph({ children: [], spacing: { after: 320 } }));
    });

    const doc = new Document({ sections: [{ properties: {}, children }] });
    const dlName = filenameOverride || titleText;
    try {
      const blob = await Packer.toBlob(doc);
      saveAs(blob, `${dlName}.docx`);
    } catch(e) { alert('Word出力中にエラーが発生しました: ' + e.message); }
  }

  /* ─────────────────────────────────────────────────────────────
     財産目録 Excel 出力
  ───────────────────────────────────────────────────────────── */
  function downloadZaisanMokurokXlsx() {
    if (typeof XLSX === 'undefined') { alert('XLSXライブラリが読み込まれていません。\nページを再読み込みしてお試しください。'); return; }
    const nh = namedHeirs();
    if (nh.length === 0) { alert('相続人の名前を入力してから出力してください。'); return; }
    try { _buildZaisanXlsx(nh); }
    catch(e) { alert('Excel出力エラー:\n' + e.message + '\n' + (e.stack||'')); console.error(e); }
  }

  function _buildZaisanXlsx(nh) {

    /* ════════════════════════════════════════════════════════════
       ① 金額パース
    ════════════════════════════════════════════════════════════ */
    function parseAmount(str) {
      if (!str) return null;
      const n = parseFloat(String(str).replace(/[,，\s円]/g, ''));
      return isNaN(n) ? null : n;
    }
    function getAssetAmount(asset) {
      const d = asset.details || {};
      if (asset.type === 'debt') {
        const n = parseAmount(d.balance);
        if (n === null) return parseAmount(d.amount);
        return d.balanceUnit === '万円' ? n * 10000 : n;
      }
      return parseAmount(d.amount);
    }

    /* ════════════════════════════════════════════════════════════
       ② 列定数
       A(0)=No.  B(1)=D1  C(2)=D2  D(3)=D3  E(4)=D4
       F(5)=D5   G(6)=D6  H(7)=金額  I+(8+)=相続人列
    ════════════════════════════════════════════════════════════ */
    const COL_NO  = 0;
    const COL_D1  = 1;
    const COL_D2  = 2;
    const COL_D3  = 3;
    const COL_D4  = 4;
    const COL_D5  = 5;
    const COL_D6  = 6;
    const COL_AMT = 7;
    const COL_HS  = 8;
    const TOTAL_COLS = COL_HS + nh.length;

    /* ════════════════════════════════════════════════════════════
       ③ スタイル定義（ファクトリ関数 — 呼ぶたびに新オブジェクトを返す）
       xlsx-js-style はセルのスタイルオブジェクトを内部で書き換えるため
       共有オブジェクトを使うとスタイルが崩れる。ファクトリで毎回生成。
    ════════════════════════════════════════════════════════════ */
    function mkFont(sz, bold, rgb) {
      return { name:'ＭＳ Ｐゴシック', sz:sz||10, bold:!!bold,
               color:rgb?{rgb}:undefined };
    }
    function mkFill(rgb) { return { patternType:'solid', fgColor:{rgb} }; }
    function mkAl(h, v, wrap) {
      return { horizontal:h||'left', vertical:v||'center', wrapText:!!wrap };
    }
    function mkBdr(style, rgb) {
      const b = { style, color:{ rgb } };
      return { top:b, bottom:b, left:b, right:b };
    }
    function mkBdrDouble(rgb) {
      const top   = { style:'double', color:{ rgb } };
      const other = { style:'medium', color:{ rgb } };
      return { top, bottom:other, left:other, right:other };
    }

    /* ─ スタイルファクトリ ─ */
    const ST = {
      title:    () => ({ font:mkFont(16,true,'1D4680'), fill:mkFill('FFFFFF'), alignment:mkAl('center','center'),       border:mkBdr('thin','D8D5CF') }),
      deceased: () => ({ font:mkFont(10,true,'1D4680'), fill:mkFill('E5ECF8'), alignment:mkAl('center','center'),       border:mkBdr('medium','1D4680') }),
      secHd:    () => ({ font:mkFont(11,true,'1D4680'), fill:mkFill('E5ECF8'), alignment:mkAl('left','center'),         border:mkBdr('medium','1D4680') }),
      colHd:    () => ({ font:mkFont(9,true,'FFFFFF'),  fill:mkFill('1D4680'), alignment:mkAl('center','center',true),  border:mkBdr('thin','FFFFFF') }),
      heirHd:   () => ({ font:mkFont(9,true,'FFFFFF'),  fill:mkFill('375623'), alignment:mkAl('center','center',true),  border:mkBdr('thin','FFFFFF') }),
      dL:  () => ({ font:mkFont(9),          fill:mkFill('FFFFFF'), alignment:mkAl('left',  'center',true), border:mkBdr('thin','D8D5CF') }),
      dC:  () => ({ font:mkFont(9),          fill:mkFill('FFFFFF'), alignment:mkAl('center','center'),      border:mkBdr('thin','D8D5CF') }),
      dR:  () => ({ font:mkFont(9),          fill:mkFill('FFFFFF'), alignment:mkAl('right', 'center'),      border:mkBdr('thin','D8D5CF'), numFmt:'#,##0' }),
      dLz: () => ({ font:mkFont(9),          fill:mkFill('F8F9FA'), alignment:mkAl('left',  'center',true), border:mkBdr('thin','D8D5CF') }),
      dCz: () => ({ font:mkFont(9),          fill:mkFill('F8F9FA'), alignment:mkAl('center','center'),      border:mkBdr('thin','D8D5CF') }),
      dRz: () => ({ font:mkFont(9),          fill:mkFill('F8F9FA'), alignment:mkAl('right', 'center'),      border:mkBdr('thin','D8D5CF'), numFmt:'#,##0' }),
      mk:  () => ({ font:mkFont(11,true,'FFFFFF'), fill:mkFill('375623'), alignment:mkAl('center','center'), border:mkBdr('thin','375623') }),
      mkz: () => ({ font:mkFont(11,true,'FFFFFF'), fill:mkFill('2E6B1F'), alignment:mkAl('center','center'), border:mkBdr('thin','2E6B1F') }),
      subLbl: () => ({ font:mkFont(9,true,'1D4680'), fill:mkFill('E5ECF8'), alignment:mkAl('center','center'), border:mkBdr('medium','1D4680') }),
      subAmt: () => ({ font:mkFont(9,true,'1D4680'), fill:mkFill('E5ECF8'), alignment:mkAl('right', 'center'), border:mkBdr('medium','1D4680'), numFmt:'#,##0' }),
      totLbl: () => ({ font:mkFont(10,true,'FFFFFF'), fill:mkFill('1D4680'), alignment:mkAl('center','center'), border:mkBdrDouble('1D4680') }),
      totAmt: () => ({ font:mkFont(10,true,'FFFFFF'), fill:mkFill('1D4680'), alignment:mkAl('right', 'center'), border:mkBdrDouble('1D4680'), numFmt:'#,##0' }),
      netLbl: () => ({ font:mkFont(10,true,'FFFFFF'), fill:mkFill('163560'), alignment:mkAl('center','center'), border:mkBdrDouble('163560') }),
      netAmt: () => ({ font:mkFont(10,true,'FFFFFF'), fill:mkFill('163560'), alignment:mkAl('right', 'center'), border:mkBdrDouble('163560'), numFmt:'#,##0' }),
      debtSecHd: () => ({ font:mkFont(11,true,'FFFFFF'), fill:mkFill('8B2635'), alignment:mkAl('left','center'),         border:mkBdr('medium','8B2635') }),
      debtColHd: () => ({ font:mkFont(9,true,'FFFFFF'),  fill:mkFill('8B2635'), alignment:mkAl('center','center',true),  border:mkBdr('thin','FFFFFF') }),
      debtL:  () => ({ font:mkFont(9,false,'4A0D16'), fill:mkFill('FFFFFF'), alignment:mkAl('left',  'center',true), border:mkBdr('thin','D8D5CF') }),
      debtC:  () => ({ font:mkFont(9,false,'4A0D16'), fill:mkFill('FFFFFF'), alignment:mkAl('center','center'),      border:mkBdr('thin','D8D5CF') }),
      debtR:  () => ({ font:mkFont(9,false,'4A0D16'), fill:mkFill('FFFFFF'), alignment:mkAl('right', 'center'),      border:mkBdr('thin','D8D5CF'), numFmt:'#,##0' }),
      debtLz: () => ({ font:mkFont(9,false,'4A0D16'), fill:mkFill('FFF0F0'), alignment:mkAl('left',  'center',true), border:mkBdr('thin','D8D5CF') }),
      debtCz: () => ({ font:mkFont(9,false,'4A0D16'), fill:mkFill('FFF0F0'), alignment:mkAl('center','center'),      border:mkBdr('thin','D8D5CF') }),
      debtRz: () => ({ font:mkFont(9,false,'4A0D16'), fill:mkFill('FFF0F0'), alignment:mkAl('right', 'center'),      border:mkBdr('thin','D8D5CF'), numFmt:'#,##0' }),
      debtSubLbl: () => ({ font:mkFont(9,true,'8B2635'), fill:mkFill('FCE4D6'), alignment:mkAl('center','center'), border:mkBdr('medium','8B2635') }),
      debtSubAmt: () => ({ font:mkFont(9,true,'8B2635'), fill:mkFill('FCE4D6'), alignment:mkAl('right', 'center'), border:mkBdr('medium','8B2635'), numFmt:'#,##0' }),
      debtTotLbl: () => ({ font:mkFont(10,true,'FFFFFF'), fill:mkFill('8B2635'), alignment:mkAl('center','center'), border:mkBdrDouble('8B2635') }),
      debtTotAmt: () => ({ font:mkFont(10,true,'FFFFFF'), fill:mkFill('8B2635'), alignment:mkAl('right', 'center'), border:mkBdrDouble('8B2635'), numFmt:'#,##0' }),
      spacer: () => ({ font:mkFont(6), fill:mkFill('FFFFFF'), alignment:mkAl('left','center'), border:mkBdr('thin','EEEEEE') }),
    };

    /* ════════════════════════════════════════════════════════════
       ④ 行・セル生成ヘルパー
       stFn = ファクトリ関数（呼ぶたびに新スタイルオブジェクトを返す）
    ════════════════════════════════════════════════════════════ */
    const wsData = [];
    const merges = [];

    function addRow(cells) { wsData.push(cells); return wsData.length - 1; }

    /* 文字列セル: v=値, stFn=スタイルファクトリ */
    function C(v, stFn, t) {
      const s = stFn();
      return { v: (v ?? ''), t: t || 's', s };
    }
    /* 数値セル: null/undefined/NaN のときは空文字列セルを返す */
    function N(n, stFn) {
      if (n === null || n === undefined || isNaN(n)) return C('', stFn);
      const s = stFn();
      const cell = { v: n, t: 'n', s };
      if (s.numFmt) cell.z = s.numFmt;
      return cell;
    }
    /* 全列を同じスタイルで埋めた空白行配列 */
    function blankRow(stFn) {
      return Array.from({ length: TOTAL_COLS }, () => C('', stFn));
    }

    /* ════════════════════════════════════════════════════════════
       ⑤ 相続人インデックス・持分取得
       Returns Map<heirIndex, {share:number, num:string, den:string, useEqual:boolean}>
    ════════════════════════════════════════════════════════════ */
    function heirShares(asset, overrideHeirName) {
      const map = new Map();
      const coOwners = (asset.coOwners || []).filter(co => (co.name || '').trim());
      const heirName = overrideHeirName || (asset.heir || asset.heirName || '').trim();
      const totalParticipants = 1 + coOwners.length;
      const useEqual = !!asset.equalShare ||
        (!asset.heirNum && !asset.heirDen && coOwners.every(co => !co.num && !co.den));

      function calcShare(num, den, fallback) {
        const n = parseFloat(num); const d = parseFloat(den);
        return (n > 0 && d > 0) ? n / d : fallback;
      }

      if (heirName) {
        const i = nh.findIndex(h => (h.name || '').trim() === heirName);
        if (i >= 0) {
          const share = useEqual ? 1 / totalParticipants
            : calcShare(asset.heirNum, asset.heirDen, 1 / totalParticipants);
          map.set(i, { share, num: asset.heirNum || '', den: asset.heirDen || '', useEqual });
        }
      }
      coOwners.forEach(co => {
        const name = (co.name || '').trim();
        const i = nh.findIndex(h => (h.name || '').trim() === name);
        if (i >= 0 && !map.has(i)) {
          const share = useEqual ? 1 / totalParticipants
            : calcShare(co.num, co.den, 1 / totalParticipants);
          map.set(i, { share, num: co.num || '', den: co.den || '', useEqual });
        }
      });
      return map;
    }

    function markLabel(info) {
      if (!info || info.useEqual) return '○';
      const n = info.num; const d = info.den;
      return (n && d) ? `○ ${n}/${d}` : '○';
    }

    /* ════════════════════════════════════════════════════════════
       ⑥ 全体タイトル・被相続人行
    ════════════════════════════════════════════════════════════ */
    const decedentName = (document.getElementById('deceasedName')?.value || '').trim() || '被相続人';
    {
      const r = blankRow(ST.title);
      r[COL_NO] = C('財　産　目　録', ST.title);
      const ri = addRow(r);
      merges.push({ s:{r:ri,c:0}, e:{r:ri,c:TOTAL_COLS-1} });
    }
    {
      const r = blankRow(ST.deceased);
      r[COL_NO] = C(`被相続人　${decedentName}　相続財産目録`, ST.deceased);
      const ri = addRow(r);
      merges.push({ s:{r:ri,c:0}, e:{r:ri,c:TOTAL_COLS-1} });
    }

    /* ════════════════════════════════════════════════════════════
       ⑦ 合計累積変数
    ════════════════════════════════════════════════════════════ */
    const heirAssetTotals = Array(nh.length).fill(0);
    const heirDebtTotals  = Array(nh.length).fill(0);
    let globalNo = 1;
    /* 氏名未入力時の直前相続人引き継ぎ用（負債セクションは対象外） */
    let lastHeir = '';

    /* ════════════════════════════════════════════════════════════
       ⑧ セクション出力関数
    ════════════════════════════════════════════════════════════ */
    const SECTION_LABELS = {
      bank:       '預　貯　金　等',
      securities: '有　価　証　券',
      realestate: '不　動　産',
      car:        '自　動　車',
      other:      'そ　の　他　の　財　産',
      debt:       '負　債　・　債　務',
    };
    const COL_DEFS = {
      bank:       ['口座種別',        '金融機関名',      '支店・本店',     '口座番号',         '',              ''],
      securities: ['証券会社・発行元', '銘柄名・種類',    '数量・株数',     '口座番号',         '',              ''],
      realestate: ['種別',            '所在地',          '地番・家屋番号', '地目・構造・種類', '地積・床面積（㎡）', '持分'],
      car:        ['車種・車名',      '登録番号',         '型式',           '車台番号',         '',              ''],
      other:      ['財産の名称・内容', '所在・保管場所等', '備考・詳細',     '',                 '',              ''],
      debt:       ['債務の種別',      '借入先・債権者',   '内容・口座等',   '承継者・負担割合', '',              ''],
    };
    const AMT_LABEL = {
      bank:'残高・評価額（円）', securities:'評価額（円）', realestate:'評価額（円）',
      car:'評価額（円）',        other:'評価額（円）',      debt:'負債残高（円）',
    };

    function addSection(typeKey) {
      const sect = assets.filter(a => a.type === typeKey);
      if (!sect.length) return;

      const isDebt = (typeKey === 'debt');
      const secHdFn  = isDebt ? ST.debtSecHd  : ST.secHd;
      const colHdFn  = isDebt ? ST.debtColHd  : ST.colHd;
      const heirHdFn = isDebt ? ST.debtColHd  : ST.heirHd;

      /* セクション大見出し */
      {
        const r = blankRow(secHdFn);
        r[COL_NO] = C(SECTION_LABELS[typeKey] || typeKey, secHdFn);
        const ri = addRow(r);
        merges.push({ s:{r:ri,c:0}, e:{r:ri,c:TOTAL_COLS-1} });
      }

      /* 列ヘッダー */
      const defs = COL_DEFS[typeKey] || ['','','','','',''];
      {
        const r = blankRow(colHdFn);
        r[COL_NO]  = C('No.',                           colHdFn);
        r[COL_D1]  = C(defs[0]||'',                    colHdFn);
        r[COL_D2]  = C(defs[1]||'',                    colHdFn);
        r[COL_D3]  = C(defs[2]||'',                    colHdFn);
        r[COL_D4]  = C(defs[3]||'',                    colHdFn);
        r[COL_D5]  = C(defs[4]||'',                    colHdFn);
        r[COL_D6]  = C(defs[5]||'',                    colHdFn);
        r[COL_AMT] = C(AMT_LABEL[typeKey]||'金額（円）', colHdFn);
        nh.forEach((h, i) => { r[COL_HS + i] = C(h.labelName || h.name, heirHdFn); });
        addRow(r);
      }

      /* データ行 */
      const heirSecTotals = Array(nh.length).fill(0);
      let secTotal = 0;
      let altFlag  = false;

      sect.forEach(asset => {
        const alt = altFlag; altFlag = !altFlag;
        const d      = asset.details || {};

        /* ── 氏名引き継ぎロジック ──
           負債は独立処理（引き継ぎ対象外）。
           プラス財産は heirName が入力されていれば lastHeir を更新し、
           空欄の場合は lastHeir を補完使用する。 */
        let resolvedHeir;
        if (isDebt) {
          // 負債：入力されている氏名をそのまま使用。引き継ぎはしない
          resolvedHeir = (asset.heir || asset.heirName || '').trim();
        } else {
          const rawHeir = (asset.heir || asset.heirName || '').trim();
          if (rawHeir) { lastHeir = rawHeir; resolvedHeir = rawHeir; }
          else          { resolvedHeir = lastHeir; }
        }

        const shareMap = heirShares(asset, resolvedHeir);
        const amount = getAssetAmount(asset);
        let amountHandled = false;

        let sLFn, sCFn, sRFn, sMarkFn;
        if (isDebt) {
          sLFn    = alt ? ST.debtLz : ST.debtL;
          sCFn    = alt ? ST.debtCz : ST.debtC;
          sRFn    = alt ? ST.debtRz : ST.debtR;
          sMarkFn = alt ? ST.debtCz : ST.debtC;
        } else {
          sLFn    = alt ? ST.dLz : ST.dL;
          sCFn    = alt ? ST.dCz : ST.dC;
          sRFn    = alt ? ST.dRz : ST.dR;
          sMarkFn = alt ? ST.mkz : ST.mk;
        }

        const r = blankRow(sLFn);
        r[COL_NO] = C(String(globalNo++), sCFn);

        /* 種別ごとのデータ埋め */
        if (typeKey === 'bank') {
          _initBankAccounts(asset);
          const accounts = asset.details.accounts;
          const bankHasMulti = accounts.length > 1;
          accounts.forEach((acct, acctIdx) => {
            const rowR = acctIdx === 0 ? r : blankRow(sLFn);
            if (acctIdx > 0) rowR[COL_NO] = C('', sCFn);
            const inst = [acct.institutionName, acct.institutionType ? `（${acct.institutionType}）` : ''].filter(Boolean).join('');
            const xlsAcctType = (acct.accountType || '普通預金').trim();
            const xlsIsYubin  = xlsAcctType === '通常貯金' || xlsAcctType === '定期貯金';
            rowR[COL_D1] = C(xlsAcctType, sCFn);
            rowR[COL_D2] = C(inst,         sLFn);
            if (xlsIsYubin) {
              const sym = (acct.accountSymbol||'').trim();
              const num = (acct.accountNumber||'').trim();
              rowR[COL_D3] = C('',                                                     sLFn);
              rowR[COL_D4] = C(sym && num ? `${sym}－${num}` : (sym||num||''),        sCFn);
            } else {
              rowR[COL_D3] = C([acct.branchName, acct.branchType].filter(Boolean).join(' '), sLFn);
              rowR[COL_D4] = C(acct.accountNumber || '',                               sCFn);
            }
            rowR[COL_D5] = C('', sLFn);
            rowR[COL_D6] = C('', sLFn);
            if (bankHasMulti) {
              // 複数口座：各口座の個別金額を使用
              const acctAmt = parseAmount(acct.amount);
              rowR[COL_AMT] = acctAmt !== null ? N(acctAmt, sRFn) : C('', sRFn);
              if (acctAmt !== null) {
                secTotal += acctAmt;
                nh.forEach((h, i) => {
                  const info = shareMap.get(i);
                  if (info !== undefined) {
                    rowR[COL_HS + i] = C(markLabel(info), sMarkFn);
                    const portion = acctAmt * info.share;
                    heirAssetTotals[i] += portion;
                    heirSecTotals[i] += portion;
                  } else {
                    rowR[COL_HS + i] = C('', sCFn);
                  }
                });
              } else {
                nh.forEach((_, i) => { rowR[COL_HS + i] = C('', sCFn); });
              }
              if (acctIdx > 0) addRow(rowR);
            } else {
              if (acctIdx > 0) {
                // 追加口座行：金額・相続人列は空にして二重計上を防ぐ
                rowR[COL_AMT] = C('', sRFn);
                nh.forEach((_, i) => { rowR[COL_HS + i] = C('', sCFn); });
                addRow(rowR);
              }
            }
          });
          if (bankHasMulti) amountHandled = true;
          // 元の r はすでに最初の口座データが入っている。後続の共通処理に任せる

        } else if (typeKey === 'securities') {
          const issues  = d.issues || [];
          const secComp = [d.companyName, d.branchName].filter(Boolean).join(' ');
          const secHasMulti = issues.length > 1;
          if (secHasMulti) {
            // 複数銘柄：各銘柄に個別行を作成
            issues.forEach((iss, issIdx) => {
              const rowR = issIdx === 0 ? r : blankRow(sLFn);
              if (issIdx > 0) rowR[COL_NO] = C('', sCFn);
              const issLabel = [iss.name, iss.type?`（${iss.type}）`:''].filter(Boolean).join('');
              const issQty   = [iss.amount, iss.unit].filter(Boolean).join('');
              rowR[COL_D1] = C(secComp || '',  sLFn);
              rowR[COL_D2] = C(issLabel,       sLFn);
              rowR[COL_D3] = C(issQty,         sCFn);
              rowR[COL_D4] = C(d.accountNumber || '', sCFn);
              rowR[COL_D5] = C('', sLFn);
              rowR[COL_D6] = C('', sLFn);
              const issEvalAmt = parseAmount(iss.evalAmount);
              rowR[COL_AMT] = issEvalAmt !== null ? N(issEvalAmt, sRFn) : C('', sRFn);
              if (issEvalAmt !== null) {
                secTotal += issEvalAmt;
                nh.forEach((h, i) => {
                  const info = shareMap.get(i);
                  if (info !== undefined) {
                    rowR[COL_HS + i] = C(markLabel(info), sMarkFn);
                    const portion = issEvalAmt * info.share;
                    heirAssetTotals[i] += portion;
                    heirSecTotals[i] += portion;
                  } else {
                    rowR[COL_HS + i] = C('', sCFn);
                  }
                });
              } else {
                nh.forEach((_, i) => { rowR[COL_HS + i] = C('', sCFn); });
              }
              if (issIdx > 0) addRow(rowR);
            });
            amountHandled = true;
          } else {
            // 単一銘柄：従来の処理
            const issName = issues.map(iss => [iss.name, iss.type?`（${iss.type}）`:''].filter(Boolean).join('')).join('、');
            const issAmt  = issues.map(iss => [iss.amount, iss.unit].filter(Boolean).join('')).join('、');
            r[COL_D1] = C(secComp || '',          sLFn);
            r[COL_D2] = C(issName,                sLFn);
            r[COL_D3] = C(issAmt,                 sCFn);
            r[COL_D4] = C(d.accountNumber || '',  sCFn);
            r[COL_D5] = C('', sLFn);
            r[COL_D6] = C('', sLFn);
          }

        } else if (typeKey === 'realestate') {
          const sub = d.houseSubType || d.realestateType;
          if (sub === 'land') {
            // 土地：land_付きキーと単体キーの両方を参照（フォールバック対応）
            const loc   = d.land_location  || d.location  || '';
            const lot   = d.land_lotNumber || d.lotNumber || '';
            const cat   = d.land_category  || d.category  || '';
            const area  = d.land_area      || d.area      || '';
            const share = d.land_share     || d.share     || '';
            r[COL_D1] = C('土　地',                                   sCFn);
            r[COL_D2] = C(loc,                                         sLFn);
            r[COL_D3] = C(lot,                                         sCFn);
            r[COL_D4] = C(cat,                                         sCFn);
            r[COL_D5] = C(area ? `${area} ㎡` : '',                   sCFn);
            r[COL_D6] = C(share,                                       sCFn);
          } else if (sub === 'condominium') {
            // 区分建物：main_/unit_付きキーと単体キーの両方を参照
            const bldgName = [d.main_location || d.location, d.main_name].filter(Boolean).join(' ');
            const unitInfo = [d.unit_name, d.unit_number].filter(Boolean).join(' ');
            const share    = d.unit_share || d.share || '';
            const area     = d.unit_area  || d.area  || '';
            r[COL_D1] = C('区分建物',                                  sCFn);
            r[COL_D2] = C(bldgName,                                    sLFn);
            r[COL_D3] = C(unitInfo || d.unit_lotNumber || d.lotNumber || '', sCFn);
            r[COL_D4] = C(d.unit_structure || d.structure || '',       sCFn);
            r[COL_D5] = C(area ? `${area} ㎡` : '',                   sCFn);
            r[COL_D6] = C(share,                                       sCFn);
          } else {
            // 戸建て・建物：building_ → land_ → 単体キーの順にフォールバック
            const floors  = d.building_floors || d.floors || [];
            const rawArea = d.building_area || d.land_area || d.area || '';
            const areaStr = floors.length
              ? floors.map(f => `${f.label||''}${f.area||''}㎡`).filter(s => s && s !== '㎡').join(' ')
              : (rawArea ? `${rawArea}㎡` : '');
            const loc    = d.building_location  || d.land_location  || d.location  || '';
            const lot    = d.building_lotNumber || d.land_lotNumber || d.lotNumber || '';
            const bType  = d.building_type      || d.type           || '';
            const bStr   = d.building_structure || d.structure      || d.land_category || d.category || '';
            const struct = [bType, bStr].filter(Boolean).join(' ');
            const share  = d.building_share || d.land_share || d.share || '';
            r[COL_D1] = C('建　物',                                    sCFn);
            r[COL_D2] = C(loc,                                          sLFn);
            r[COL_D3] = C(lot,                                          sCFn);
            r[COL_D4] = C(struct,                                       sLFn);
            r[COL_D5] = C(areaStr,                                      sCFn);
            r[COL_D6] = C(share,                                        sCFn);
          }

        } else if (typeKey === 'car') {
          _initCars(asset);
          const cars = asset.details.cars;
          const carHasMulti = cars.length > 1;
          cars.forEach((car, carIdx) => {
            const rowR = carIdx === 0 ? r : blankRow(sLFn);
            if (carIdx > 0) rowR[COL_NO] = C('', sCFn);
            rowR[COL_D1] = C(car.carName  || '', sLFn);
            rowR[COL_D2] = C(car.regNo    || '', sCFn);
            rowR[COL_D3] = C(car.carModel || '', sCFn);
            rowR[COL_D4] = C(car.vin      || '', sCFn);
            rowR[COL_D5] = C('', sLFn);
            rowR[COL_D6] = C('', sLFn);
            if (carHasMulti) {
              // 複数車両：各車両の個別金額を使用
              const carAmt = parseAmount(car.amount);
              rowR[COL_AMT] = carAmt !== null ? N(carAmt, sRFn) : C('', sRFn);
              if (carAmt !== null) {
                secTotal += carAmt;
                nh.forEach((h, i) => {
                  const info = shareMap.get(i);
                  if (info !== undefined) {
                    rowR[COL_HS + i] = C(markLabel(info), sMarkFn);
                    const portion = carAmt * info.share;
                    heirAssetTotals[i] += portion;
                    heirSecTotals[i] += portion;
                  } else {
                    rowR[COL_HS + i] = C('', sCFn);
                  }
                });
              } else {
                nh.forEach((_, i) => { rowR[COL_HS + i] = C('', sCFn); });
              }
              if (carIdx > 0) addRow(rowR);
            } else {
              if (carIdx > 0) {
                rowR[COL_AMT] = C('', sRFn);
                nh.forEach((_, i) => { rowR[COL_HS + i] = C('', sCFn); });
                addRow(rowR);
              }
            }
          });
          if (carHasMulti) amountHandled = true;

        } else if (typeKey === 'other') {
          _initOtherItems(asset);
          const otherItems = asset.details.otherItems;
          otherItems.forEach((item, itemIdx) => {
            const rowR = itemIdx === 0 ? r : blankRow(sLFn);
            if (itemIdx > 0) rowR[COL_NO] = C('', sCFn);
            rowR[COL_D1] = C(item.otherTitle || 'その他', sLFn);
            rowR[COL_D2] = C('',                          sLFn);
            rowR[COL_D3] = C(item.otherBody  || '',       sLFn);
            rowR[COL_D4] = C('', sLFn);
            rowR[COL_D5] = C('', sLFn);
            rowR[COL_D6] = C('', sLFn);
            if (itemIdx > 0) {
              rowR[COL_AMT] = C('', sRFn);
              nh.forEach((_, i) => { rowR[COL_HS + i] = C('', sCFn); });
              addRow(rowR);
            }
          });

        } else if (typeKey === 'debt') {
          const coHeirNames = (d.debtCoHeirs||[]).map(c=>c.name||'').filter(Boolean).join('、');
          const heirName    = (asset.heirName || asset.heir || '').trim();
          const shokeisha   = coHeirNames || heirName || '';
          r[COL_D1] = C(d.debtType   || '負債',  sCFn);
          r[COL_D2] = C(d.creditor   || '',       sLFn);
          r[COL_D3] = C(d.contractNo || '',       sCFn);
          r[COL_D4] = C(shokeisha,                sLFn);
          r[COL_D5] = C('', sLFn);
          r[COL_D6] = C('', sLFn);
        }

        /* 金額列・相続人列（複数アイテムで個別処理済みの場合はスキップ） */
        if (!amountHandled) {
          if (amount !== null) {
            r[COL_AMT] = N(amount, sRFn);
            secTotal  += amount;
          } else {
            r[COL_AMT] = C('', sRFn);
          }

          /* 相続人列（○マーク） */
          nh.forEach((h, i) => {
            const info = shareMap.get(i);
            if (info !== undefined) {
              r[COL_HS + i] = C(markLabel(info), sMarkFn);
              if (amount !== null) {
                const portion = amount * info.share;
                if (isDebt) heirDebtTotals[i]  += portion;
                else        heirAssetTotals[i] += portion;
                heirSecTotals[i] += portion;
              }
            } else {
              r[COL_HS + i] = C('', sCFn);
            }
          });
        }

        addRow(r);
      });

      /* 小計行 */
      {
        const subLblFn = isDebt ? ST.debtSubLbl : ST.subLbl;
        const subAmtFn = isDebt ? ST.debtSubAmt : ST.subAmt;
        const lbl      = isDebt ? '負債　小計' : `${SECTION_LABELS[typeKey]}　小計`;
        const r        = blankRow(subLblFn);
        r[COL_NO]      = C(lbl, subLblFn);
        const ri       = addRow(r);
        merges.push({ s:{r:ri,c:0}, e:{r:ri,c:COL_AMT-1} });
        r[COL_AMT] = secTotal > 0 ? N(secTotal, subAmtFn) : C('', subAmtFn);
        nh.forEach((h, i) => {
          r[COL_HS + i] = heirSecTotals[i] > 0
            ? N(Math.round(heirSecTotals[i]), subAmtFn)
            : C('', subAmtFn);
        });
      }
    }

    /* ════════════════════════════════════════════════════════════
       ⑨ スペーサー行
    ════════════════════════════════════════════════════════════ */
    function addSpacer() { addRow(blankRow(ST.spacer)); }

    /* ════════════════════════════════════════════════════════════
       ⑩ セクション出力
    ════════════════════════════════════════════════════════════ */
    const hasType = t => assets.some(a => a.type === t);

    if (hasType('bank'))       {               addSection('bank');       }
    if (hasType('securities')) { addSpacer(); addSection('securities'); }
    if (hasType('realestate')) { addSpacer(); addSection('realestate'); }
    if (hasType('car'))        { addSpacer(); addSection('car');        }
    if (hasType('other'))      { addSpacer(); addSection('other');      }

    /* 資産合計行 */
    {
      addSpacer();
      const assetTotal = assets.filter(a => a.type !== 'debt')
        .reduce((s, a) => { const v = getAssetAmount(a); return s + (v||0); }, 0);
      const r  = blankRow(ST.totLbl);
      r[COL_NO] = C('資　産　合　計', ST.totLbl);
      const ri  = addRow(r);
      merges.push({ s:{r:ri,c:0}, e:{r:ri,c:COL_AMT-1} });
      r[COL_AMT] = assetTotal > 0 ? N(assetTotal, ST.totAmt) : C('', ST.totAmt);
      nh.forEach((h, i) => {
        r[COL_HS + i] = heirAssetTotals[i] > 0
          ? N(Math.round(heirAssetTotals[i]), ST.totAmt)
          : C('', ST.totAmt);
      });
    }

    /* 負債セクション */
    const debtAssets = assets.filter(a => a.type === 'debt');
    if (debtAssets.length) {
      addSpacer();
      addSection('debt');
      /* 負債合計行 */
      {
        addSpacer();
        const debtTotal = debtAssets.reduce((s, a) => { const v = getAssetAmount(a); return s + (v||0); }, 0);
        const r  = blankRow(ST.debtTotLbl);
        r[COL_NO] = C('負　債　合　計', ST.debtTotLbl);
        const ri  = addRow(r);
        merges.push({ s:{r:ri,c:0}, e:{r:ri,c:COL_AMT-1} });
        r[COL_AMT] = debtTotal > 0 ? N(debtTotal, ST.debtTotAmt) : C('', ST.debtTotAmt);
        nh.forEach((h, i) => {
          r[COL_HS + i] = heirDebtTotals[i] > 0
            ? N(Math.round(heirDebtTotals[i]), ST.debtTotAmt)
            : C('', ST.debtTotAmt);
        });
      }
    }

    /* 純資産合計行 */
    {
      addSpacer();
      const assetTotal = assets.filter(a => a.type !== 'debt')
        .reduce((s, a) => { const v = getAssetAmount(a); return s + (v||0); }, 0);
      const debtTotal = debtAssets
        .reduce((s, a) => { const v = getAssetAmount(a); return s + (v||0); }, 0);
      const net = assetTotal - debtTotal;
      const r   = blankRow(ST.netLbl);
      r[COL_NO] = C('純　資　産　合　計（資産 − 負債）', ST.netLbl);
      const ri  = addRow(r);
      merges.push({ s:{r:ri,c:0}, e:{r:ri,c:COL_AMT-1} });
      r[COL_AMT] = (assetTotal > 0 || debtTotal > 0) ? N(net, ST.netAmt) : C('', ST.netAmt);
      nh.forEach((h, i) => {
        const netH = heirAssetTotals[i] - heirDebtTotals[i];
        r[COL_HS + i] = (heirAssetTotals[i] > 0 || heirDebtTotals[i] > 0)
          ? N(Math.round(netH), ST.netAmt)
          : C('', ST.netAmt);
      });
    }

    /* ════════════════════════════════════════════════════════════
       ⑪ ワークシート組み立て
    ════════════════════════════════════════════════════════════ */
    const ws = {};
    wsData.forEach((row, ri) => {
      row.forEach((cell, ci) => {
        if (!cell) return;
        const addr = XLSX.utils.encode_cell({ r: ri, c: ci });
        ws[addr] = { v: cell.v, t: cell.t || 's', s: cell.s };
        if (cell.t === 'n' && cell.s && cell.s.numFmt) ws[addr].z = cell.s.numFmt;
      });
    });

    ws['!merges'] = merges;

    const heirMaxW = Math.max(10, ...nh.map(h => Math.ceil((h.labelName||h.name||'').length * 1.9)));
    ws['!cols'] = [
      { wch: 4  },  // A  No.
      { wch: 14 },  // B  D1
      { wch: 22 },  // C  D2
      { wch: 16 },  // D  D3
      { wch: 14 },  // E  D4
      { wch: 12 },  // F  D5
      { wch: 10 },  // G  D6
      { wch: 16 },  // H  金額
      ...nh.map(() => ({ wch: Math.min(16, Math.max(10, heirMaxW)) })),
    ];

    ws['!rows'] = wsData.map((_, i) => {
      if (i === 0) return { hpt: 38 };
      if (i === 1) return { hpt: 22 };
      return { hpt: 20 };
    });

    ws['!ref'] = XLSX.utils.encode_range({
      s: { r: 0, c: 0 },
      e: { r: wsData.length - 1, c: TOTAL_COLS - 1 },
    });

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '財産目録');
    XLSX.writeFile(wb, `財産目録_${decedentName}.xlsx`);
  }

<!-- ─── 1. ツール概要 ─── -->
<div class="section-anchor" id="overview"></div>
<div class="card">
  <h2>1. ツール概要</h2>
  <p>
    本ツールは、相続手続きで必要となる <strong>遺産分割協議書</strong> および <strong>遺産分割協議証明書</strong> を
    ブラウザ上で作成するための自動作成システムです。
    入力した内容がリアルタイムでプレビューに反映され、
    Word形式（.docx）・PDF・Excelへの出力が可能です。
  </p>
  <h3>主な機能</h3>
  <ul>
    <li>被相続人・相続人情報の入力とリアルタイムプレビュー</li>
    <li>不動産・預貯金・有価証券・その他財産の詳細入力</li>
    <li>相続分（取得者・割合指定）の設定</li>
    <li>財産目録（Excel/CSV）の一括取り込みと、取り込み用標準テンプレート（Excel）の出力</li>
    <li>登記情報PDF（登記情報提供サービス）からの不動産の自動入力</li>
    <li>負債条項の注記・換価分割の経費控除など、実務上のリスクに配慮した特約・定型条項</li>
    <li>Word文書（.docx）・PDF・財産目録Excel の出力</li>
    <li>数次相続・協議証明書・祭祀承継者などの特殊ケース対応</li>
    <li>案件のブラウザ内保存・JSON形式でのエクスポート/インポート</li>
  </ul>
  <div class="tip">
    <div class="tip-title">💡 ご注意</div>
    データはすべてブラウザ（IndexedDB）またはローカルのJSONファイルに保存されます。
    外部サーバーへの送信は一切行いません。
  </div>
</div>

<!-- ─── 3. 被相続人の入力 ─── -->
<div class="section-anchor" id="decedent"></div>
<div class="card">
  <h2>3. 被相続人の入力</h2>
  <p>画面左上の <strong>「被相続人」</strong> セクションで、亡くなられた方の情報を入力します。</p>
  <h3>入力項目</h3>
  <ul>
    <li><strong>氏名</strong>（必須）― 協議書の冒頭「亡〇〇の遺産分割協議書」に使用されます</li>
    <li><strong>最後の住所</strong> ― 住民票または戸籍の附票の住所と一致させることが重要です</li>
    <li><strong>本籍</strong> ― 被相続人の死亡時の戸籍（除籍）または住民票の除票（本籍地入り）と合わせて記載します</li>
    <li><strong>死亡年月日</strong> ― 「令和〇年〇月〇日」の形式で入力します</li>
  </ul>
  <div class="tip">
    <div class="tip-title">💡 ヒント</div>
    すべての項目は任意入力です。未入力の場合は空白欄（　　　　）として出力されます。
    実務では後から手書き補充する場合にも便利です。
  </div>

  <h3>協議書の種類（書類タイプ）</h3>
  <p>被相続人セクション内の <strong>「協議書の種類」</strong> で以下を選択できます：</p>
  <ul>
    <li><strong>遺産分割協議書</strong>（標準）― 全相続人が連名で署名・捺印する書類</li>
    <li><strong>遺産分割協議証明書</strong> ― 各相続人が個別に証明する書類（相続人が遠方に分散している場合に有効）</li>
  </ul>
  <p>協議証明書を選択すると、各相続人ごとに書類が分割されて出力されます。</p>

  <h3>作成日</h3>
  <p>「作成日」欄に協議書の日付を入力します。空欄の場合は空白行として出力されます。</p>

  <h3>床面積の入力（平家建・区分建物）</h3>
  <ul>
    <li><strong>平家建</strong> ― 登記簿では階を書かずに面積だけが記載されています。床面積の行の <strong>階の欄を空欄</strong> にして面積だけを入力すると、協議書にも「床 面 積　２１６．２８㎡」のように階を書かずに出力されます（階の欄に薄く表示される「1階」は見本の文字で、空欄として扱われます）。</li>
    <li><strong>一棟の建物の床面積</strong>（区分建物）― 「建物名称の登記なし」にチェックしたときに協議書へ出力されます。「床 面 積」は最初の階だけに記載し、2階以降は省略して階の位置をそろえます。</li>

  <h3>敷地権なしの区分建物</h3>
  <p>
    区分建物で「敷地権なし」を選んだ場合、建物とは別に敷地の土地（持分）を記載する必要があります。
    持分が入力された土地が1件もないときは、区分建物のカード内に <strong>記載漏れの注意</strong> が表示されます。
    「＋ 不動産」で「一般住宅（戸建て）→ 土地」を追加し、持分を入力してください。
    注意の表示のみで、入力は必須ではありません（通常の土地が混ざっている場合なども、そのまま進められます）。
  </p>

  <h3>📄 登記情報PDFから自動入力</h3>
  <p>不動産カード上部の <strong>「📄 登記情報PDFから自動入力」</strong> から、登記情報提供サービスでダウンロードしたPDFを選ぶと、内容を読み取って入力欄に反映します。</p>
  <ul>
    <li>物件の種別（土地／一般建物／区分建物・敷地権あり／区分建物・敷地権なし）を自動で判定し、カードの種別も切り替えます。</li>
    <li>土地は所在・地番・地目・地積、建物は所在・家屋番号・種類・構造・床面積、区分建物は一棟の建物・専有部分・敷地権の表示（複数筆対応）を取り込みます。</li>
    <li>変更の履歴（地目変更・増築・市制施行による所在の変更など）がある場合は、最新の記載を採用します。</li>
    <li>地積・床面積の「１５０：２５」という登記簿の表記は「１５０．２５」に置き換えます。数字の全角・半角はPDFのままです。</li>
    <li>入力済みの項目がある場合は、上書きする前に確認画面が表示されます。</li>
    <li>読み取り後の画面で、読み取れなかった項目や注意点を確認できます。「読み取ったテキストを表示」で、PDFから取り出した文字をそのまま確認できます。</li>
  </ul>
  <div class="warn">
    <div class="warn-title">⚠️ 自動入力の注意点</div>
    ・スキャンした画像のPDF（文字データのないもの）には対応していません。<br>
    ・附属建物、表題部の所有者欄、権利部（甲区・乙区）の内容、持分は取り込みません。必要に応じて手入力してください。<br>
    ・PDFの「余白」欄など、文字に変換できない記号は自動で取り除きます。所在などの中に外字（珍しい漢字）が含まれていた場合は、その文字が抜けている可能性があるため、画面に警告が表示されます。<strong>必ず登記事項証明書と照合してください。</strong><br>
    ・PDFの読み取りに使う部品をインターネットから読み込むため、オフライン環境では利用できません（PDFの内容が外部に送信されることはありません）。

<!-- ─── 6. 財産目録の取り込み ─── -->
<div class="section-anchor" id="import"></div>
<div class="card">
  <h2>6. 財産目録の取り込み（Excel/CSV）</h2>
  <p>手元の財産目録（Excel・CSV）を読み込んで、財産欄と協議書プレビューへまとめて反映できます。財産が多い案件で、1件ずつ手入力する手間を省けます。</p>
  <div class="tip">
    <div class="tip-title">💡 標準テンプレートの使用をおすすめします</div>
    読み取り機能を使う場合は、<strong>📥 標準テンプレート(Excel)</strong> に入力してから取り込んでください。標準テンプレートは読み取り機能に合わせた様式のため、最も正確に反映されます（詳しくは本章の「📥 標準テンプレート（Excel）」をご覧ください）。
  </div>
  <div class="warn">
    <div class="warn-title">⚠️ 事務所ごとに作成した財産目録の読み込みについて</div>
    事務所独自の様式で作成した財産目録も読み込めますが、列の見出しや表の組み方によっては、<strong>内容が十分に反映されない</strong>場合があります（財産の種類の誤判定、項目の取りこぼし、入力欄のずれなど）。独自様式を読み込んだ場合は、取り込み結果を必ず1件ずつ確認・修正してください。正確に取り込みたい場合は、内容を標準テンプレートに貼り付けてから取り込むことをおすすめします。
  </div>

  <h3>取り込みの手順</h3>
  <ol>
    <li><strong>相続人の氏名を先に入力</strong>しておきます（取得者の自動照合に使います）。</li>
    <li>「Step 03 相続財産」の <strong>📊 財産目録（Excel/CSV）から取り込み</strong> を押し、ファイルを選びます。</li>
    <li>すでに財産が入力されている場合は、<strong>「置き換える」「後ろに追加」「キャンセル」</strong> から選びます（初期状態の空の財産カードだけのときは、確認なしで置き換わります）。</li>
    <li>完了画面で、取り込んだ件数と要確認事項を確認します。</li>
    <li>各財産カードとプレビューを見て、内容を確認・修正します。</li>
  </ol>

  <h3>読み込めるファイル</h3>
  <table class="asset-table">
    <thead><tr><th>ファイル</th><th>内容</th></tr></thead>
    <tbody>
      <tr><td>Excel（.xlsx / .xlsm / .xls）</td><td>すべてのシートを読み込みます（「記入方法」「説明」などの名前のシートは対象外）。</td></tr>
      <tr><td>CSV（.csv）</td><td>文字コード（UTF-8／Shift_JIS）は自動で判別します。</td></tr>
      <tr><td>本ツールの財産目録Excel</td><td>「📊 財産目録 Excel」で出力したファイルをそのまま読み込めます。複数口座・共有持分（○ 1/2）・連帯債務も復元されます。</td></tr>
      <tr><td>事務所独自の様式</td><td>表の上部に <strong>列の見出し</strong>（金融機関名・所在地・評価額など）があれば読み込めます。ただし、様式によっては十分に反映されない場合があります（上記の注意をご覧ください）。</td></tr>
      <tr><td>標準テンプレート（推奨）</td><td>読み取り機能に合わせた様式です。最も正確に取り込めます。</td></tr>
    </tbody>
  </table>

  <h3>自動で判別される列の見出し</h3>
  <p>独自様式の財産目録では、次のような見出しを、表記ゆれを含めて自動で判別します。列の並び順は自由です。ここにない見出しの列や、1つのセルに複数の情報をまとめて書いた列は、正しく読み取れないことがあります。</p>
  <table class="asset-table">
    <thead><tr><th>項目</th><th>判別される見出しの例</th></tr></thead>
    <tbody>
      <tr><td>種別</td><td>種別／種類／区分／財産の種類</td></tr>
      <tr><td>金融機関・支店</td><td>金融機関名／銀行名／支店名／店舗名／取扱店</td></tr>
      <tr><td>預金種別・口座番号</td><td>預金種別／口座種別／科目／口座番号／記号番号</td></tr>
      <tr><td>不動産</td><td>所在地／所在／土地の表示／地番／家屋番号／地目／構造／地積／床面積／持分</td></tr>
      <tr><td>有価証券</td><td>証券会社名／発行元／銘柄名／株数／数量／口数</td></tr>
      <tr><td>自動車</td><td>車名／車種／登録番号／型式／車台番号</td></tr>
      <tr><td>負債</td><td>債権者／借入先／債務の種類／契約番号</td></tr>
      <tr><td>取得者</td><td>取得者／承継人／承継者／帰属先／取得希望者</td></tr>
      <tr><td>金額</td><td>評価額／残高／金額／価額／時価</td></tr>
      <tr><td>その他</td><td>名称／品目／内容／備考／摘要／メモ</td></tr>
    </tbody>
  </table>

  <h3>財産の種類の判定</h3>
  <p>財産の種類は、次の順番で判定します。</p>
  <ol>
    <li><strong>「種別」列の値</strong>（例：預貯金、不動産（土地）、有価証券、負債）</li>
    <li><strong>表の中の見出し行</strong>（例：「【不動産】」「預 貯 金 等」だけが書かれた行）</li>
    <li><strong>行の内容から推測</strong>（例：「〇〇銀行」→預貯金、「〇〇市…番」「宅地」→不動産、「100株」→有価証券、「ローン」「借入」→負債）</li>
  </ol>
  <p>どれにも当てはまらない行は <strong>「その他の財産」</strong> として取り込み、名称と内容を残します（情報が消えることはありません）。小計・合計の行は自動で読み飛ばします。</p>

  <h3>取得者の指定</h3>
  <ul>
    <li>取得者欄の氏名は、<strong>Step 05 の相続人欄と同じ表記</strong>にすると自動で照合されます（スペースの全角・半角の違いは吸収します）。</li>
    <li>共有にする場合は「相続 太郎 1/2、相続 花子 1/2」のように <strong>「、」で区切って</strong> 入力します。「2分の1」の書き方にも対応しています。</li>
    <li>負債で取得者を複数入れた場合は、2人目以降が連帯して承継する人になります。</li>
  </ul>

  <h3>取り込み結果の確認</h3>
  <p>取り込み後に表示される完了画面では、次の内容を確認できます。</p>
  <table class="asset-table">
    <thead><tr><th>表示</th><th>内容と対応</th></tr></thead>
    <tbody>
      <tr><td>取り込み件数</td><td>財産の種類ごとの件数です。</td></tr>
      <tr><td>⚠ 取得者が相続人の登録と一致しません</td><td>取得者欄には名前をそのまま入れています。相続人欄の氏名と表記を合わせてください。</td></tr>
      <tr><td>🔍 念のためご確認ください</td><td>種別を内容から判定した行、金融機関の種類（銀行・信用金庫など）を推定した行などです。財産カードのバッジと内容を確認してください。</td></tr>
      <tr><td>ℹ 協議書に反映されない備考など</td><td>預貯金・不動産などには備考欄がないため、備考は取り込まれません。必要に応じて手入力してください。</td></tr>
    </tbody>
  </table>

  <h3>📥 標準テンプレート（Excel）</h3>
  <p>「Step 03 相続財産」の <strong>📥 標準テンプレート(Excel)をダウンロード</strong> で、取り込み用のテンプレート（<strong>標準テンプレート_一覧図読込.xlsm</strong>）を出力します。読み取り機能を使う場合は、このテンプレートの使用をおすすめします。すでに事務所の様式で作成した財産目録がある場合も、内容をこのテンプレートに貼り付けてから取り込むと、正確に反映されます。テンプレートは財産の分類ごとにシートが分かれており、各シートの列見出しがそのまま協議書に記載する項目になっています。</p>
  <div class="tip">
    <div class="tip-title">💡 法定相続情報一覧図（Excel）から被相続人・相続人を読み込めます</div>
    テンプレートの「被相続人」シートにある <strong>［📂 一覧図を読み込む］</strong> ボタンを押し、法定相続情報一覧図のExcelファイルを選ぶと、被相続人（氏名・本籍・最後の住所・生年月日・死亡年月日）と相続人（氏名・住所・続柄）を自動で転記します。読み込んだ内容は、必ず一覧図と見比べて確認してください。<br>
    ・一覧図のファイルに様式のシートが複数ある場合は、記入されているシートを自動で選びます。<br>
    ・死亡の記載がある方（被代襲者など）は相続人から除きます。一覧図に住所の記載がない相続人は、住所が空欄になります。
  </div>
  <div class="warn">
    <div class="warn-title">⚠️ マクロ有効ブック（.xlsm）について（最初に1回だけ設定）</div>
    一覧図の読み込みボタンはマクロ（VBA）で動きます。Excelの安全機能により、ダウンロードしたファイルや <strong>OneDrive と同期しているフォルダ</strong>（デスクトップ・ドキュメントなど）に置いたファイルでは、マクロが止められることがあります（赤い帯「このファイルのソースが信頼されていないため…」）。次の設定をしておくと、毎回そのまま使えます。<br>
    <strong>① 専用フォルダを作る</strong>：エクスプローラーで「PC」→「ローカルディスク (C:)」を開き、フォルダ（例：<code>C:\\相続テンプレート</code>）を作ります。<br>
    <strong>② テンプレートを入れる</strong>：ダウンロードした <strong>標準テンプレート_一覧図読込.xlsm</strong> をこのフォルダに移します。<br>
    <strong>③ 信頼できる場所に登録</strong>：Excelの「ファイル」→「オプション」→「トラスト センター」→「トラスト センターの設定」→「信頼できる場所」→「新しい場所の追加」→「参照」で①のフォルダを選び、「OK」を押します。<br>
    <strong>④ 開き直す</strong>：Excelを閉じ、フォルダ内のテンプレートを開き直します。<br>
    ・登録したフォルダに入れたファイルは確認なしでマクロが動きます。<strong>このテンプレート以外のファイルは入れないでください。</strong><br>
    ・OneDrive以外の場所で黄色い帯「コンテンツの有効化」が出たときは、押せば使えます。ファイルのプロパティに「許可する」の欄がある場合は、チェックを入れて「OK」を押してから開き直す方法でも使えます。<br>
    ・マクロが使えない環境でも、手入力のテンプレートとしてそのまま使えます。入力したテンプレートは .xlsm のまま「📊 財産目録（Excel/CSV）から取り込み」で読み込めます。
  </div>

    <tbody>

      <tr><td>区分建物</td><td>マンションなどの区分建物を、一棟の建物・専有部分・敷地権まで入力します。</td></tr>

      <tr><td>その他</td><td>財産の名称・内容（協議書に記載する文言）・評価額・取得者・備考</td></tr>

  <p>各シートの4行目（灰色）に列ごとの「記入のポイント」があります。5行目から入力してください（薄い黄色の欄が入力欄。見出しはスクロールしても固定されます）。金額は数字のみで入力してください。</p>
  <div class="tip">
    <div class="tip-title">💡 有価証券は1行に1銘柄</div>

    「合算目録」シートでは、分類ごとの件数・金額の総括表（資産合計・負債・正味の遺産額）と、各シートの明細の一覧を自動で表示します。入力したシートを更新すると自動で再計算されます（Excel 2010 以降・LibreOffice で動作）。明細欄の行数には上限があり、超えた場合は注意書きが表示されます（総括表の金額には含まれます）。

    ・以前の1シート形式のテンプレート（「財産目録」シート）も、これまでどおり取り込めます。

  <h3>「被相続人」シートの書き方</h3>
  <ul>
    <li>【内容】の列に、氏名・本籍・最後の住所・生年月日・死亡年月日を入力します。空欄の項目は取り込みません。</li>
    <li>生年月日・死亡年月日は「昭和20年1月2日」「S20.1.2」のほか、Excelの日付（1945/1/2）でも入力できます。取り込み時に和暦（令和○年○月○日）に変換します。</li>
    <li>数次相続の場合は、下の表に中間被相続人（氏名・続柄・最後の住所・本籍・死亡年月日）を1行に1名ずつ入力します。入力があると「数次相続」が有効になります。記入例の行（備考に【記入例】）は取り込まれません。</li>
    <li>ツールに入力済みの被相続人情報と異なる場合は、確認画面で <strong>上書きする／空欄だけ埋める／反映しない</strong> を選べます。</li>
    <li>財産目録シートが空でも、被相続人の情報だけを取り込めます。</li>

  <h3>「区分建物」シートの書き方</h3>
  <p>1行目は見出しのグループ、2行目が列見出しです。3行目から入力します。</p>

    <thead><tr><th>グループ</th><th>列</th></tr></thead>

      <tr><td>専有部分の建物の表示</td><td>家屋番号／建物の名称／種類／構造／床面積（例：3階部分 65.50）／持分</td></tr>
      <tr><td>敷地権の表示</td><td>符号／所在及び地番／地目／地積／敷地権の種類／敷地権の割合</td></tr>
      <tr><td>その他</td><td>評価額／取得希望者／備考</td></tr>
    </tbody>
  </table>
  <ul>
    <li><strong>敷地権が2筆以上ある場合</strong>は、同じ物件No.で行を追加し、敷地権の列だけを入力します（一棟・専有の列は空欄で構いません）。</li>
    <li>一棟の建物に名称の登記がない場合は、【一棟】建物の名称に <strong>「なし」</strong> と入力すると「登記なし」として扱われます。</li>

  <div class="tip">
    <div class="tip-title">💡 「財産目録」シートでマンションを入力した場合</div>
    「財産目録」シートで種別を「不動産（区分建物）」にした場合、取り込めるのは所在・家屋番号・構造・床面積までです。一棟の建物や敷地権は、取り込み後に画面で補ってください。
  </div>

  <div class="warn">
    <div class="warn-title">⚠️ 取り込み後は必ず確認を</div>
    取り込んだ内容は、登記事項証明書・通帳・残高証明書などの原資料と照合してください。特に、金融機関の種類（例：「JAあいち」→「あいち農業協同組合」）や、内容から判定した財産の種類は推定を含みます。
  </div>
</div>

<!-- ─── 7. 遺産分割方法の設定 ─── -->
<div class="section-anchor" id="division"></div>
<div class="card">
  <h2>7. 遺産分割方法の設定</h2>
  <p>各財産カード内の <strong>「取得者・分割方法」</strong> セクションで、誰がどのように取得するかを設定します。</p>

  <h3>分割方法の種類</h3>
  <ul>
    <li><strong>単独取得</strong> ― 相続人1名が全部取得する場合</li>
    <li><strong>共有取得</strong> ― 複数の相続人が割合で取得する場合（例：1/2ずつ）</li>
    <li><strong>換価分割</strong> ― 売却して代金を分配する場合</li>
    <li><strong>代償分割</strong> ― 取得者が他の相続人に代償金を支払う場合</li>
  </ul>

  <h3>取得者の選択</h3>
  <p>
    相続人セクションで入力した相続人が選択肢に表示されます。
    チェックボックスで取得者を選択すると、共有の場合は持分割合を入力できます。
  </p>

  <h3>負債条項の注記（STEP 04 特約・定型条項）</h3>
  <p>
    「債権者への対外関係（内部負担割合である旨）の解説注記を条文に含める」にチェックすると（初期設定はオン）、
    借入・負債等の各条文の末尾に次の一文が入ります。
  </p>
  <div class="tip">
    なお、本条の規定は共同相続人内部における負担割合を定めたものであり、債権者に対する免責的債務引受については、別途当該債権者の承諾を要するものとする。
  </div>
  <p>
    遺産分割協議で特定の相続人が債務を承継すると定めても、債権者の承諾（免責的債務引受）がない限り、債権者に対しては各相続人が法定相続分に応じて責任を負います。
    当事者間の誤解やトラブルを防ぐための注記です。
  </p>

  <h3>換価分割の経費控除（STEP 04 特約・定型条項）</h3>
  <p>
    「特定の相続人が相続財産を承継・換価し、換価金を相続人で分割する旨の条項を含める」にチェックすると、換価分割の入力欄が表示されます。
    その上部の <strong>「換価費用・税金の控除規定を含める」</strong>（初期設定はオン）で、売却経費を差し引いてから分配する旨を条文に入れるかを選べます。
  </p>
  <ul>
    <li><strong>オン</strong> ― 「売却に要した一切の経費（仲介手数料、登記費用、測量費用、譲渡所得税その他の諸費用等）を控除したうえで」と出力します。</li>
    <li><strong>内訳の欄</strong> ― （　）内の経費の内訳を案件ごとに編集できます。空欄にすると「売却に要した一切の経費を控除したうえで」と出力します。</li>
    <li><strong>オフ</strong> ― 経費控除の文言を入れずに出力します。</li>
  </ul>
  <div class="warn">
    <div class="warn-title">⚠️ 譲渡所得税の扱いにご注意ください</div>
    代表者が取得して売却する換価分割では、譲渡所得税は各相続人が取得割合に応じてそれぞれ申告・納税するのが通常です。
    売却代金から譲渡所得税を先に差し引いて分配すると、申告の実態と合わない場合があります。
    案件に応じて、内訳から「譲渡所得税」を外すか、別途精算の取り決めを置くかをご検討ください。
  </div>
</div>

<!-- ─── 9. 案件管理・保存 ─── -->
<div class="section-anchor" id="case-mgmt"></div>
<div class="card">
  <h2>9. 案件管理・保存</h2>

  <h3>📂 案件管理（IndexedDB）</h3>
  <p>ブラウザの IndexedDB に複数の案件を保存・管理できます。</p>
  <ul>
    <li>ヘッダーの <strong>「📂 案件管理」</strong> ボタンで案件一覧を開きます</li>
    <li>案件を選択してクリックすると、その案件のデータが読み込まれます</li>
    <li>ステータス（進行中・完了・保留等）でフィルタリングできます</li>
    <li>案件名・被相続人名で検索できます</li>
  </ul>

  <h3>⬆ DB保存</h3>
  <p>現在入力中の内容をブラウザのIndexedDBに保存します。</p>
  <ul>
    <li><strong>「⬆ DB保存」</strong> ボタンで保存ダイアログが開きます</li>
    <li>案件名・担当者・ステータスを設定して保存できます</li>
    <li>同じ案件を上書き保存することも、新規案件として保存することもできます</li>
  </ul>
  <div class="warn">
    <div class="warn-title">⚠️ ご注意</div>
    IndexedDB のデータはブラウザのキャッシュと同様です。
    ブラウザのデータ削除操作を行うと消えることがあります。
    重要な案件は必ずJSONエクスポートでバックアップしてください。
  </div>

  <h3>💾 JSONエクスポート・インポート</h3>
  <ul>
    <li><strong>「💾 JSONエクスポート」</strong> ― 現在の入力内容をJSONファイルとしてダウンロード</li>
    <li><strong>「📂 JSONインポート」</strong> ― 保存したJSONファイルを読み込み（既存の入力は上書きされます）</li>
  </ul>
  <div class="tip">
    <div class="tip-title">💡 バックアップのすすめ</div>
    重要な案件は定期的にJSONエクスポートしてローカルに保管してください。
    JSONファイルはテキスト形式のため、メールや共有フォルダでの受け渡しにも使用できます。
  </div>

  <h3>🗑 新規</h3>
  <p>「🗑 新規」ボタンで入力内容をすべてリセットして新しい案件を開始します。確認ダイアログが表示されます。</p>
</div>

<!-- ─── 10. 特殊機能 ─── -->
<div class="section-anchor" id="special"></div>
<div class="card">
  <h2>10. 特殊機能</h2>

  <h3>数次相続への対応</h3>
  <p>
    一次相続の手続き中に相続人が死亡した場合（数次相続）、
    その相続人の後継者（数次相続人）を相続人として追加できます。
  </p>
  <ul>
    <li>相続人の署名欄の「【】内の肩書」を手動変更することで、<br>
        例：<code>亡山田花子相続人　山田一郎</code> のように表示できます</li>
    <li>中間被相続人（一次相続の途中で亡くなった方）の情報は、<br>
        被相続人セクション内の <strong>「中間被相続人を追加」</strong> ボタンから入力します</li>
    <li>中間被相続人には：氏名・最後の住所・本籍・死亡年月日・続柄 が入力できます</li>
  </ul>

  <h3>祭祀承継者</h3>
  <p>仏壇・墓石などの祭祀財産の承継者を指定できます。</p>
  <ul>
    <li>被相続人セクション内の <strong>「祭祀承継者を設定」</strong> で指定します</li>
    <li>相続人の中から選択、または外部の方の氏名を直接入力することもできます</li>
  </ul>

  <h3>協議証明書モード</h3>
  <p>
    遺産分割協議証明書は、各相続人が個別に作成する形式の書類です。
    被相続人セクションの「書類タイプ」で「遺産分割協議証明書」を選択すると、
    各相続人ごとに証明書が作成されます。
  </p>
  <ul>
    <li>Word出力時は相続人ごとにファイルを分けて出力するか、<br>
        1ファイルにまとめて出力するかを選択できます</li>
  </ul>

  <h3>相続分の指定（割合・法定相続分）</h3>
  <p>
    各相続人の法定相続分は自動計算されませんが、
    財産ごとに取得割合を分数（例：1/2、1/3）で入力できます。
  </p>

<!-- ─── 11. よくある質問 ─── -->
<div class="section-anchor" id="faq"></div>
<div class="card">
  <h2>11. よくある質問</h2>

  <h3>Q. データはサーバーに送信されますか？</h3>
  <p>
    <span class="badge badge-green">A</span>
    いいえ。すべてのデータはお使いのブラウザ（IndexedDB・ローカルメモリ）内で処理されます。
    外部サーバーへの送信は一切行いません。
  </p>

  <h3>Q. 複数のパソコンで同じデータを使いたい</h3>
  <p>
    <span class="badge badge-blue">A</span>
    JSONエクスポート機能でデータをファイル出力し、別のパソコンでJSONインポートすることでデータを移行できます。
  </p>
