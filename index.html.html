        setCell(ws, 2, i, c.h, hdStyle(GRP_COLOR[c.grp || 'c']));
        setCell(ws, 3, i, c.hint, ST.hint);
      });
      let r = _TPL_DATA_ROW - 1;
      spec.sample.forEach(row => {
        spec.cols.forEach((c, i) => {
          const v = c.note ? S : row[i];

      });

        setCell(ws, r, i, '', c.money ? { ...ST.inp, numFmt: '#,##0' } : c.text ? { ...ST.inp, numFmt: '@' } : ST.inp);

      const cGroupRow = ['', '一棟の建物の表示', '', '', '', '専有部分の建物の表示', '', '', '', '', '', '敷地権の表示（1行に1筆）', '', '', '', '', '', '', '', ''];
      const cRows = [
        ['1', '名古屋市〇〇区〇〇町一丁目 1番地1、1番地2', '〇〇マンション', '鉄筋コンクリート造陸屋根10階建', '1階 500.00　2階 480.00　3階 480.00',
         '〇〇町一丁目1番1の305', '305', '居宅', '鉄筋コンクリート造1階建', '3階部分 65.50', '',
         '1', '名古屋市〇〇区〇〇町一丁目1番1', '宅地', '800.00', '所有権', '10000分の456', 12000000, '相続 太郎', S],
        ['1', '', '', '', '', '', '', '', '', '', '', '2', '名古屋市〇〇区〇〇町一丁目1番2', '宅地', '120.00', '所有権', '10000分の456', '', '', S],
      ];
      const ws3 = {};
      const colorOf = c => c >= 1 && c <= 4 ? '1D4680' : c >= 5 && c <= 10 ? '1A5C3A' : c >= 11 && c <= 16 ? '8A5A1C' : '4A5568';
      cHeader.forEach((h, c) => { setCell(ws3, 0, c, cGroupRow[c], hdStyle(colorOf(c))); setCell(ws3, 1, c, h, hdStyle(colorOf(c))); });
      cRows.forEach((row, i) => row.forEach((v, c) => setCell(ws3, 2 + i, c, v, c === 17 ? { ...ST.sample, numFmt: '#,##0' } : ST.sample)));
      for (let r = 4; r < 34; r++) cHeader.forEach((_, c) => setCell(ws3, r, c, '', c === 17 ? { ...ST.inp, numFmt: '#,##0' } : ST.inp));
      ws3['!ref'] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: 33, c: cHeader.length - 1 } });
      ws3['!merges'] = [{ s: { r: 0, c: 1 }, e: { r: 0, c: 4 } }, { s: { r: 0, c: 5 }, e: { r: 0, c: 10 } }, { s: { r: 0, c: 11 }, e: { r: 0, c: 16 } }];
      ws3['!cols'] = [{ wch: 9 }, { wch: 30 }, { wch: 16 }, { wch: 26 }, { wch: 30 }, { wch: 20 }, { wch: 12 }, { wch: 10 }, { wch: 22 }, { wch: 16 }, { wch: 10 },
        { wch: 8 }, { wch: 30 }, { wch: 8 }, { wch: 10 }, { wch: 12 }, { wch: 14 }, { wch: 14 }, { wch: 22 }, { wch: 40 }];
      freezes[addSheet(ws3, '区分建物')] = 2;
    }
    _TPL_SPECS.slice(2).forEach(buildSpecSheet);   // 有価証券・自動車・その他・負債

    /* ── 合算目録（数式で自動集計） ── */
    {
      const ws = {};
      const q = name => `'${name}'`;
      const rng = (sheet, col, from = _TPL_DATA_ROW) => `${q(sheet)}!$${col}$${from}:$${col}$${_TPL_SCAN_TO}`;
      const colL = (spec, k) => _tplLetter(_tplCol(spec, k));
      const CONDO = { sheet: '区分建物', from: 3, key: 'F', note: 'T', amount: 'R', heir: 'S', cap: 10 };
      /* 集計対象の条件（キー列が空欄でなく、備考に【記入例】がない） */
      const cntF = (sh, key, note, from) => `COUNTIFS(${rng(sh, key, from)},"?*",${rng(sh, note, from)},"<>*【記入例】*")`;
      const sumF = (sh, key, note, amt, from) => `SUMIFS(${rng(sh, amt, from)},${rng(sh, key, from)},"?*",${rng(sh, note, from)},"<>*【記入例】*")`;
      const cats = _TPL_SPECS.map(s => ({ label: s.sheet, sheet: s.sheet, key: colL(s, s.cols.find(c => c.key).k), note: colL(s, 'note'), amount: colL(s, 'amount'), heir: colL(s, 'heir'), cap: s.cap, spec: s, from: _TPL_DATA_ROW }));
      const byType = t => cats.find(c => c.spec.type === t);
      const condoCat = { label: '区分建物', ...CONDO };
      const assetCats = [byType('bank'), byType('realestate'), condoCat, byType('securities'), byType('car'), byType('other')];
      const debtCat = byType('debt');
      const num = { ...ST.inp, fill: undefined, numFmt: '#,##0', alignment: { horizontal: 'right' } };
      const cellF = (r, c, f, s) => { const ref = XLSX.utils.encode_cell({ r, c }); ws[ref] = { t: 'n', f, s: s ? JSON.parse(JSON.stringify(s)) : undefined }; return ws[ref]; };
      const cellFs = (r, c, f, s) => { const ref = XLSX.utils.encode_cell({ r, c }); ws[ref] = { t: 's', f, s: s ? JSON.parse(JSON.stringify(s)) : undefined }; return ws[ref]; };
      const lbl = { font: { name: F, sz: 10 }, border: BOX };
      const lblB = { font: { name: F, sz: 10, bold: true }, border: BOX, fill: { patternType: 'solid', fgColor: { rgb: 'E8EEF7' } } };
      const numB = { ...lblB, numFmt: '#,##0', alignment: { horizontal: 'right' } };

      setCell(ws, 0, 1, '相続財産目録（合算）', { font: { name: F, bold: true, sz: 15, color: { rgb: '1D4680' } } });
      setCell(ws, 1, 1, '※このシートは各シートの入力内容から自動で作成されます（入力・取り込みは不要です）。', ST.note);
      setCell(ws, 2, 1, '被相続人', lblB);
      cellFs(2, 2, `IF(${q('被相続人')}!$B$4="","",${q('被相続人')}!$B$4)`, lbl);
      setCell(ws, 2, 3, '死亡年月日', lblB);
      cellFs(2, 4, `IF(${q('被相続人')}!$B$8="","",${q('被相続人')}!$B$8)`, lbl);

      /* 総括表 */
      let r = 4;
      setCell(ws, r++, 1, '【総括表】', { font: { name: F, bold: true, sz: 11 } });
      ['分類', '件数', '金額（円）'].forEach((h, i) => setCell(ws, r, 1 + i, h, hdStyle('1D4680')));
      r++;
      const sumRowsStart = r;
      assetCats.forEach(c => {
        const isSec = c.spec && c.spec.type === 'securities';
        setCell(ws, r, 1, isSec ? '有価証券（預り金を含む）' : c.label, lbl);
        cellF(r, 2, cntF(c.sheet, c.key, c.note, c.from), { ...num, numFmt: '0"件"' });
        cellF(r, 3, sumF(c.sheet, c.key, c.note, c.amount, c.from)
          + (isSec ? `+SUMIFS(${rng(c.sheet, colL(c.spec, 'deposit'))},${rng(c.sheet, colL(c.spec, 'note'))},"<>*【記入例】*")` : ''), num);   // 預り金は銘柄の有無にかかわらず集計
        r++;
      });
      const assetTotalRow = r;
      setCell(ws, r, 1, '資産合計', lblB);
      cellF(r, 2, `SUM(C${sumRowsStart + 1}:C${r})`, { ...numB, numFmt: '0"件"' });
      cellF(r, 3, `SUM(D${sumRowsStart + 1}:D${r})`, numB);
      r++;
      setCell(ws, r, 1, '負債', lbl);
      cellF(r, 2, cntF(debtCat.sheet, debtCat.key, debtCat.note, debtCat.from), { ...num, numFmt: '0"件"' });
      cellF(r, 3, sumF(debtCat.sheet, debtCat.key, debtCat.note, debtCat.amount, debtCat.from), num);
      const debtRow = r;
      r++;
      setCell(ws, r, 1, '正味の遺産額（資産合計－負債）', { ...lblB, fill: { patternType: 'solid', fgColor: { rgb: 'FDE9C8' } } });
      setCell(ws, r, 2, '', { ...lblB, fill: { patternType: 'solid', fgColor: { rgb: 'FDE9C8' } } });
      cellF(r, 3, `D${assetTotalRow + 1}-D${debtRow + 1}`, { ...numB, fill: { patternType: 'solid', fgColor: { rgb: 'FDE9C8' } }, font: { name: F, sz: 11, bold: true } });
      r++;
      /* 明細の表示枠を超えたときの注意 */
      const over = [...assetCats, debtCat].map(c => `${cntF(c.sheet, c.key, c.note, c.from)}>${c.cap}`).join(',');
      cellFs(r, 1, `IF(OR(${over}),"※明細欄に表示しきれない財産があります（総括表の件数・金額には含まれています）。","")`, { font: { name: F, sz: 9, color: { rgb: 'C0392B' }, bold: true } });
      r += 2;

      /* 明細（分類ごとに、入力された行だけを上から詰めて表示） */
      setCell(ws, r++, 1, '【明細】', { font: { name: F, bold: true, sz: 11 } });
      ['No.', '財産の表示', '評価額・残高（円）', '取得者'].forEach((h, i) => setCell(ws, r, 1 + i, h, hdStyle('1D4680')));
      r++;
      const IX = (c, col, rowRef) => `INDEX(${q(c.sheet)}!$${col}:$${col},${rowRef})`;
      const descOf = (c, rr) => {
        const s = c.spec, g = k => IX(c, colL(s, k), rr);
        const opt = (k, pre = '', post = '') => `IF(${g(k)}="","","${pre}"&${g(k)}&"${post}")`;
        if (!s) return `${IX(c, 'B', rr)}&IF(${IX(c, 'C', rr)}="","","　"&${IX(c, 'C', rr)})&"　"&${IX(c, 'F', rr)}`;   // 区分建物
        switch (s.type) {
          case 'bank':       return `${g('inst')}&${opt('branch', '　')}&${opt('acctType', '　')}&${opt('acctNo', '　口座番号 ')}`;
          case 'realestate': return `IF(ISNUMBER(SEARCH("建物",${g('kind')})),${g('location')}&${opt('lotBldg', '　家屋番号 ')}&${opt('bldgType', '　')}&${opt('bldgStr', '　')}&${opt('bldgArea', '　床面積 ')},`
                                  + `${g('location')}&${g('lotLand')}&${opt('landCat', '　')}&${opt('landArea', '　', '㎡')})&${opt('share', '（持分 ', '）')}`;
          case 'securities': return `${g('company')}&${opt('branch', ' ')}&"　"&${g('issue')}&${opt('subkind', '　')}&${opt('qty', '　')}&${g('unit')}`;
          case 'car':        return `${g('carName')}&${opt('regNo', '　')}&${opt('vin', '　車台番号 ')}`;
          case 'other':      return `${g('name')}&${opt('detail', '　')}`;
          case 'debt':       return `${g('creditor')}&${opt('debtType', '　')}&${opt('acctNo', '　契約番号 ')}`;
        }
      };
      [...assetCats, debtCat].forEach(c => {
        const isDebt = c === debtCat;
        const bh = { font: { name: F, sz: 10, bold: true, color: { rgb: 'FFFFFF' } }, fill: { patternType: 'solid', fgColor: { rgb: isDebt ? '8B2C2C' : '4A5568' } }, border: BOX };
        setCell(ws, r, 1, '■', bh);
        setCell(ws, r, 2, `${isDebt ? '負債' : c.label}　小計`, bh);
        cellF(r, 3, `${sumF(c.sheet, c.key, c.note, c.amount, c.from)}`, { ...bh, numFmt: '#,##0', alignment: { horizontal: 'right' } });
        setCell(ws, r, 4, '', bh);
        r++;
        const rows0 = r;
        for (let k = 1; k <= c.cap; k++, r++) {
          const R1 = r + 1;
          /* A列（非表示）：元シートの行番号。条件に合う k 番目の行を AGGREGATE(15,6,…) で求める */
          cellF(r, 0, `IFERROR(_xlfn.AGGREGATE(15,6,ROW(${rng(c.sheet, c.key, c.from)})/((${rng(c.sheet, c.key, c.from)}<>"")*ISERROR(SEARCH("【記入例】",${rng(c.sheet, c.note, c.from)}))),${k}),"")`, { font: { name: F, sz: 8, color: { rgb: 'AAAAAA' } } });
          cellFs(r, 1, `IF($A${R1}="","",${k})`, { ...lbl, alignment: { horizontal: 'center' } });
          cellFs(r, 2, `IF($A${R1}="","",${descOf(c, '$A' + R1)})`, { ...lbl, alignment: { wrapText: true, vertical: 'center' } });
          cellF(r, 3, `IF($A${R1}="","",N(${IX(c, c.amount, '$A' + R1)}))`, { ...num, border: BOX });
          cellFs(r, 4, `IF($A${R1}="","",${IX(c, c.heir, '$A' + R1)}&"")`, lbl);
        }
        if (c.spec && c.spec.type === 'securities') {
          setCell(ws, r, 1, '', lbl);
          setCell(ws, r, 2, '預り金（合計）', lbl);
          cellF(r, 3, `SUMIFS(${rng(c.sheet, colL(c.spec, 'deposit'))},${rng(c.sheet, colL(c.spec, 'note'))},"<>*【記入例】*")`, { ...num, border: BOX });
          setCell(ws, r, 4, '', lbl);
          r++;
        }
        r++;
      });
      ws['!ref'] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r, c: 4 } });
      ws['!cols'] = [{ wch: 5, hidden: true }, { wch: 30 }, { wch: 64 }, { wch: 18 }, { wch: 26 }];
      ws['!merges'] = [{ s: { r: 1, c: 1 }, e: { r: 1, c: 4 } }];
      addSheet(ws, '合算目録');
    }

    /* ── 記入方法 ── */
    {
      const guide = [
        ['財産目録 標準テンプレートの記入方法'],
        [''],
        ['シート', '入力する内容'],
        ['被相続人', '被相続人の氏名・本籍・最後の住所・生年月日・死亡年月日。数次相続の場合は中間被相続人も入力します。'],
        ['相続人', '相続人の氏名・住所を1行に1名ずつ入力します。上から順番にツールの相続人欄に並びます。財産シートの【取得者】は、ここと同じ表記の氏名で入力してください。'],
        ..._TPL_SPECS.slice(0, 2).map(s => [s.sheet, s.note]),
        ['区分建物', 'マンションなどの区分建物を、一棟の建物・専有部分・敷地権まで入力します（下の「区分建物」シートの書き方を参照）。'],
        ..._TPL_SPECS.slice(2).map(s => [s.sheet, s.note]),
        ['合算目録', '各シートの入力内容を数式で自動集計した全体の財産目録です（入力不要・取り込み対象外）。総括表で分類ごとの件数・金額と、資産合計・負債・正味の遺産額を確認できます。'],
        [''],
        ['共通のポイント'],
        ['・各シートとも、4行目（灰色）の「記入のポイント」を参考に、5行目から入力してください（薄い黄色の欄が入力欄です）。'],
        ['・金額（残高・評価額など）は数字のみで入力してください（合算目録で合計するため）。'],
        ['・共有にする場合は【取得者】に「相続 太郎 1/2、相続 花子 1/2」のように区切って入力します。'],
        ['・取得者の氏名は、ツールの相続人欄と同じ表記にすると自動で照合されます。'],
        ['・【備考】は事務所用のメモ欄です（負債シートを除き、協議書には反映されません）。'],
        ['・備考に【記入例】と書かれた行は取り込まれず、合算目録にも含まれません。記入例を上書きしたら、その文字を消してください。'],
        ['・入力欄が足りない場合は、表の下に続けて入力できます（合算目録の総括表には500行目まで集計されます）。'],
        ['・このシート（記入方法）と「合算目録」シートは取り込み対象外です。'],
        [''],
        ['「区分建物」シートの書き方'],
        ['・1行目は見出しのグループ、2行目が列見出しです。3行目から入力してください。'],
        ['・物件ごとに【物件No.】を付けます（1、2、3…）。'],
        ['・敷地権が2筆以上あるときは、同じ物件No.で行を追加し、敷地権の列だけを入力します（一棟・専有の列は空欄でOK）。'],
        ['・【一棟】床面積は「1階 500.00　2階 480.00」のように階と面積を並べて入力します。【専有】床面積は「3階部分 65.50」のように入力します。'],
        ['・一棟の建物に名称の登記がない場合は、【一棟】建物の名称に「なし」と入力します。'],
        ['・評価額と取得希望者は、各物件の1行目に入力します。'],
      ];
      const ws = XLSX.utils.aoa_to_sheet(guide);
      ws['!cols'] = [{ wch: 22 }, { wch: 110 }];
      const t = XLSX.utils.encode_cell({ r: 0, c: 0 }); if (ws[t]) ws[t].s = ST.title;
      [2].forEach(rr => [0, 1].forEach(c => { const ref = XLSX.utils.encode_cell({ r: rr, c }); if (ws[ref]) ws[ref].s = hdStyle('1D4680'); }));
      guide.forEach((row, rr) => { if (row.length === 1 && /ポイント|書き方/.test(row[0])) { const ref = XLSX.utils.encode_cell({ r: rr, c: 0 }); ws[ref].s = { font: { name: F, bold: true, sz: 11, color: { rgb: '1D4680' } } }; } });
      addSheet(ws, '記入方法');
    }

    const FNAME = '財産目録_標準テンプレート.xlsx';
    const raw = XLSX.write(wb, { bookType: 'xlsx', type: 'array', cellStyles: true });
    const out = _zmiAddListValidationsMulti(raw, validations, true, freezes);
    _zmiDownloadBytes(out || raw, FNAME);
  }

  /* 複数シート・複数列の入力規則（プルダウン）を埋め込み、開いたときに数式を再計算させる */
  function _zmiAddListValidationsMulti(wbArray, list, fullCalc, freezes) {
    try {
      const CFB = (window.XLSX && window.XLSX.CFB) || (window._XLSXBase && window._XLSXBase.CFB);
      if (!CFB) return null;
      const zip = CFB.read(new Uint8Array(wbArray), { type: 'array' });
      const findEntry = target => {
        let e = CFB.find(zip, '/' + target);
        if (!e) { const i = zip.FullPaths.findIndex(fp => fp.endsWith('/' + target)); if (i >= 0) e = zip.FileIndex[i]; }
        return e;
      };
      const x = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const bySheet = {};
      list.forEach(v => { (bySheet[v.sheetIndex] = bySheet[v.sheetIndex] || []).push(v); });
      const before = ['<hyperlinks', '<printOptions', '<pageMargins', '<pageSetup', '<headerFooter', '<rowBreaks', '<colBreaks',
        '<customProperties', '<cellWatches', '<ignoredErrors', '<smartTags', '<drawing', '<legacyDrawing', '<picture', '<oleObjects',
        '<controls', '<webPublishItems', '<tableParts', '<extLst', '</worksheet>'];
      Object.entries(bySheet).forEach(([idx, vs]) => {
        const entry = findEntry(`xl/worksheets/sheet${idx}.xml`);
        if (!entry || !entry.content) return;
        let xml = new TextDecoder('utf-8').decode(entry.content);
        const dv = `<dataValidations count="${vs.length}">` + vs.map(v => {
          const o = v.opt || {};
          return `<dataValidation type="list" allowBlank="1" showDropDown="0" showInputMessage="1" showErrorMessage="1" errorStyle="warning"`
            + ` promptTitle="${x(o.promptTitle || '')}" prompt="${x(o.prompt || '')}" errorTitle="${x(o.errorTitle || '')}" error="${x(o.error || '')}" sqref="${v.sqref}">`
            + `<formula1>${x('"' + v.items.join(',') + '"')}</formula1></dataValidation>`;
        }).join('') + `</dataValidations>`;
        let pos = -1;
        for (const tag of before) { const i = xml.indexOf(tag); if (i >= 0 && (pos < 0 || i < pos)) pos = i; }
        if (pos < 0) return;
        xml = xml.slice(0, pos) + dv + xml.slice(pos);
        entry.content = new TextEncoder().encode(xml);
        entry.size = entry.content.length;
      });
      /* 見出し行の固定（ウィンドウ枠の固定） */
      Object.entries(freezes || {}).forEach(([idx, rows]) => {
        const entry = findEntry(`xl/worksheets/sheet${idx}.xml`);
        if (!entry || !entry.content) return;
        let xml = new TextDecoder('utf-8').decode(entry.content);
        const pane = `<pane ySplit="${rows}" topLeftCell="A${rows + 1}" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft" activeCell="A${rows + 1}" sqref="A${rows + 1}"/>`;
        xml = xml.replace(/<sheetView([^>]*)\/>/, `<sheetView$1>${pane}</sheetView>`);
        entry.content = new TextEncoder().encode(xml);
        entry.size = entry.content.length;
      });
      if (fullCalc) {
        const wbe = findEntry('xl/workbook.xml');
        if (wbe && wbe.content) {
          let xml = new TextDecoder('utf-8').decode(wbe.content);
          if (/<calcPr[^>]*\/>/.test(xml)) xml = xml.replace(/<calcPr([^>]*)\/>/, (m, a) => `<calcPr${a.replace(/\sfullCalcOnLoad="[^"]*"/, '')} fullCalcOnLoad="1"/>`);
          else xml = xml.replace('</workbook>', '<calcPr calcId="191029" fullCalcOnLoad="1"/></workbook>');
          wbe.content = new TextEncoder().encode(xml);
          wbe.size = wbe.content.length;
        }
      }
      return CFB.write(zip, { fileType: 'zip', type: 'array' });
    } catch (e) {
      console.warn('入力規則の埋め込みに失敗しました（プルダウンなしで出力します）', e);
      return null;
    }
  }
